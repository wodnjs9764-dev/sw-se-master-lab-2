 정합성을 보장하는 유일한 방법이다.","API Gateway가 요청 단위 트랜잭션을 관리하므로, 실패가 감지되면 모든 서비스의 DB 변경을 자동으로 롤백한다.","Saga 패턴을 적용하여, 실패한 단계 이전에 완료된 작업을 보상 트랜잭션(결제 취소, 주문 취소)으로 되돌린다."],"answer":[5],"id":"MP-019"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"MSA 장애 대응 패턴","prompt":"마이크로서비스 A가 서비스 B를 호출할 때, B의 실패율이 임계치를 넘으면 일정 시간 동안 B를 호출하지 않고 즉시 실패 처리(대체 응답 반환)한다. 이후 일부 요청만 시험적으로 보내 B의 회복 여부를 확인한 뒤 정상 호출을 재개한다. 이 패턴의 이름 ⓐ를 작성하시오.","explanation":"Circuit Breaker 패턴은 Closed → Open → Half-Open 상태 전이로 장애가 연쇄적으로 전파되는 것을 막는다.","blanks":[{"label":"ⓐ","answers":["CircuitBreaker","서킷브레이커","서킷 브레이커","회로차단기","circuitbreakerpattern","서킷브레이커패턴"]}],"id":"MP-020"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"API Gateway의 역할","prompt":"MSA 환경에서 API Gateway의 역할로 옳지 않은 것을 고르시오.","explanation":"API Gateway는 단일 진입점으로서 라우팅·인증·트래픽 제어·응답 조합 등을 담당한다. 서비스별 DB를 통합하는 것은 Gateway의 역할이 아니며 MSA 원칙에도 맞지 않는다.","choices":["각 서비스의 DB를 하나로 통합하여 데이터 일관성을 보장한다.","인증·인가를 공통으로 처리한다.","클라이언트 요청을 적절한 마이크로서비스로 라우팅한다.","여러 서비스의 응답을 조합하여 클라이언트에 하나의 응답으로 제공할 수 있다.","호출량 제한(Rate Limiting)과 로깅을 공통으로 적용한다."],"answer":[1],"id":"MP-021"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"서비스별 데이터 관리","prompt":"MSA의 'Database per Service' 원칙에 대한 설명으로 가장 옳은 것을 고르시오.","explanation":"각 서비스가 데이터를 독립적으로 소유해야 독립 배포·확장이 가능하다. 다른 서비스 DB 직접 접근은 강한 결합을 만든다. DBMS 제품은 서비스 특성에 맞게 선택하며 반드시 달라야 하는 것은 아니다.","choices":["서비스별로 DB를 분리하면 각 서비스가 자기 데이터만 다루므로, 서비스 간 데이터 정합성 문제는 발생하지 않는다.","모든 서비스가 하나의 공유 DB를 사용해야 서비스 간 조인이 쉬워지고 데이터 중복도 없어지므로 MSA에서 권장된다.","각 서비스는 자신의 데이터를 소유하며, 다른 서비스의 데이터는 해당 서비스의 API나 이벤트를 통해서만 접근한다.","이 원칙에 따라 서비스마다 반드시 서로 다른 DBMS 제품(Oracle, MySQL, MongoDB 등)을 사용해야 한다.","다른 서비스의 테이블을 직접 조회하면 API를 호출하는 것보다 네트워크 의존이 줄어, 서비스 간 결합도가 더 낮아진다."],"answer":[3],"id":"MP-022"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"서비스 분리 기준","prompt":"모놀리식 커머스 시스템을 마이크로서비스로 분리할 때 서비스 경계를 정하는 기준으로 가장 적절한 것을 고르시오.","explanation":"서비스 경계는 업무 도메인과 데이터 일관성 경계(Bounded Context)를 기준으로 정해야 서비스 간 결합도가 낮고 응집도가 높아진다. 지나치게 잘게 나누면 서비스 간 호출이 폭증한다.","choices":["재사용성을 극대화하기 위해 모든 기능을 가능한 한 가장 작은 함수 단위로 쪼개어 각각 별도 서비스로 배포한다.","도메인 주도 설계(DDD)의 Bounded Context를 기준으로, 업무 의미와 데이터의 일관성 경계가 같은 단위로 분리한다.","사용자 화면 하나당 서비스 하나로 분리하여, 화면 변경이 다른 서비스에 영향을 주지 않도록 한다.","현재 개발 조직의 개발자 수에 맞춰 서비스를 나누어, 개발자 한 명이 서비스 하나를 전담하도록 한다.","물리 데이터 모델의 테이블 하나당 서비스 하나로 분리하여, 각 서비스가 정확히 한 개의 테이블만 관리하도록 한다."],"answer":[2],"id":"MP-023"},{"category":"방법론/프로세스","type":"short","difficulty":"상","title":"점진적 MSA 전환 전략","prompt":"기존 모놀리식 시스템 앞에 라우팅 계층(프록시/API Gateway)을 두고, 기능을 하나씩 신규 마이크로서비스로 옮긴 뒤 해당 요청만 신규 서비스로 보내는 방식으로 점진적으로 교체하여, 최종적으로 레거시 시스템을 제거하는 전환 패턴을 ⓐ에 작성하시오.","explanation":"Strangler Fig(스트랭글러 피그) 패턴은 기존 시스템을 한 번에 교체하지 않고 기능 단위로 점진적으로 대체하는 전환 전략이다.","blanks":[{"label":"ⓐ","answers":["StranglerFig","Strangler","스트랭글러","스트랭글러피그","스트랭글러 피그","stranglerfigpattern","교살자","교살자패턴","교살자무화과"]}],"id":"MP-024"},{"category":"방법론/프로세스","type":"mcq","difficulty":"상","title":"MSA 데이터 아키텍처 패턴","prompt":"주문 데이터의 변경(생성·취소)은 정규화된 DB에서 처리하고, 조회 화면은 별도로 구성한 읽기 전용 모델(반정규화된 조회 DB)에서 처리하도록 분리하는 아키텍처 패턴에 대한 설명으로 가장 옳은 것을 고르시오.","explanation":"CQRS(Command Query Responsibility Segregation)는 명령(쓰기)과 조회(읽기) 책임을 분리하는 패턴이다. 읽기 모델은 이벤트 등으로 비동기 갱신되는 경우가 많아 최종 일관성을 고려해야 한다.","choices":["CQRS 패턴으로, 쓰기와 읽기 모델을 분리해 각각 최적화할 수 있지만, 두 모델 간 데이터 동기화 지연(최종 일관성)을 고려해야 한다.","API Gateway 패턴으로, 읽기와 쓰기 요청을 하나의 진입점에서 받아 같은 테이블에서 처리하도록 라우팅한다.","Saga 패턴으로, 쓰기 작업이 실패하면 읽기 전용 모델이 보상 트랜잭션을 실행하여 정규화된 DB의 변경을 되돌린다.","Strangler 패턴으로, 레거시 시스템 앞에 라우팅 계층을 두고 기능을 하나씩 신규 서비스로 점진적으로 교체한다.","Circuit Breaker 패턴으로, 조회 모델에 장애가 발생하면 쓰기 요청까지 일정 시간 차단하여 장애 전파를 막는다."],"answer":[1],"id":"MP-025"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"MSA의 특징","prompt":"마이크로서비스 아키텍처(MSA)의 특징으로 옳지 않은 것을 고르시오.","explanation":"MSA에서 서비스 간 호출은 네트워크를 통한 원격 호출(REST, gRPC, 메시지)이므로 지연·타임아웃·부분 장애를 반드시 고려해야 한다.","choices":["서비스 수가 늘어나 모니터링·분산 추적 등 운영 복잡도가 증가한다.","한 서비스의 장애가 전체 시스템 장애로 번지는 것을 줄일 수 있다.","서비스 간 호출이 같은 프로세스 내부의 메서드 호출로 이루어지므로 네트워크 지연이나 장애를 고려할 필요가 없다.","서비스 특성에 맞는 언어·프레임워크·DB를 선택할 수 있다.","서비스별로 독립적으로 배포할 수 있다."],"answer":[3],"id":"MP-026"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"개발 모형의 선택","prompt":"아래 [프로젝트 특성]에 가장 적합한 개발 모형을 고르시오.","explanation":"요구사항이 법령으로 확정되어 변경 가능성이 낮고, 단계별 산출물 승인과 문서화가 필수인 프로젝트에는 순차적으로 진행하는 폭포수 모형이 적합하다.","context":"[프로젝트 특성]\n• 개정된 법령에 따라 세금 계산 로직을 변경하는 프로젝트로, 요구사항이 법 조문으로 명확히 확정되어 있다.\n• 감독기관에 단계별(분석·설계·구현·테스트) 산출물을 제출하고 승인을 받아야 다음 단계로 진행할 수 있다.\n• 시행일이 정해져 있어 범위와 일정이 고정되어 있다.","choices":["폭포수(Waterfall) 모형","Scrum","칸반(Kanban)","프로토타이핑 모형","XP(eXtreme Programming)"],"answer":[1],"id":"MP-027"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"반복형 개발 모형","prompt":"계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가의 단계를 반복하면서 점진적으로 시스템을 완성하며, 특히 매 반복마다 위험 요소를 식별하고 줄이는 것을 핵심으로 하는 개발 모형을 ⓐ에 작성하시오.","explanation":"나선형(Spiral) 모형은 반복마다 위험 분석을 수행하여 위험을 관리하는 것이 특징이며, 대규모·고위험 프로젝트에 적합하다.","blanks":[{"label":"ⓐ","answers":["나선형","나선형모형","Spiral","스파이럴","나선형모델","spiralmodel","나선형 모형"]}],"id":"MP-028"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"V-모델의 단계 대응","prompt":"V-모델에서 개발 단계와 테스트 단계의 대응 관계로 옳지 않은 것을 고르시오.","explanation":"V-모델에서 상세(모듈) 설계는 단위 테스트로 검증한다. 인수 테스트는 사용자 요구사항을 검증하는 단계이므로 요구사항 분석에 대응한다.","choices":["요구사항 분석 – 인수 테스트","시스템 설계 – 시스템 테스트","아키텍처(상위) 설계 – 통합 테스트","상세(모듈) 설계 – 단위 테스트","상세(모듈) 설계 – 인수 테스트"],"answer":[5],"id":"MP-029"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"프로토타이핑의 활용","prompt":"프로토타이핑 모형을 적용하기에 가장 적합한 상황을 고르시오.","explanation":"프로토타이핑은 요구사항이 불명확할 때 시제품을 만들어 사용자 피드백을 받으며 요구사항을 구체화하는 데 효과적이다.","choices":["요구사항이 법령으로 완전히 확정되어 있고, 변경 가능성이 없어 설계 문서만으로 충분히 합의할 수 있는 경우","현업이 원하는 화면 구성과 사용 흐름을 말로 명확히 설명하지 못해, 실제 동작하는 시안을 보며 요구사항을 구체화해야 하는 경우","사용자 화면 없이 야간에 정해진 데이터만 일괄 처리하는 배치 프로그램만 개발하는 경우","기존 시스템과 동일한 기능을 그대로 유지하면서 서버 장비만 신규 인프라로 이전하는 단순 전환 작업인 경우","단계별 산출물에 대한 공식 승인이 필수이며, 이전 단계로 돌아가는 반복 개발이 계약상 허용되지 않는 경우"],"answer":[2],"id":"MP-030"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"정보공학 방법론","prompt":"정보공학(Information Engineering) 방법론의 특징으로 가장 옳은 것을 고르시오.","explanation":"정보공학 방법론은 데이터 중심 방법론으로 정보전략계획 → 업무영역분석 → 시스템 설계 → 구축 단계를 거친다. DFD 중심은 구조적 방법론, 컴포넌트 조립은 CBD, 객체 중심은 객체지향 방법론, 짧은 반복은 애자일이다.","choices":["객체와 클래스, 상속을 중심으로 시스템을 모델링한다.","짧은 반복 주기로 동작하는 소프트웨어를 지속적으로 제공하는 것을 핵심으로 한다.","기능을 하향식으로 분해하여 DFD(자료 흐름도)를 중심으로 분석하는 프로세스 중심 방법론이다.","데이터 중심으로 전사적 정보전략계획(ISP)부터 분석·설계·구축까지 단계적으로 수행하며, ERD 등 데이터 모델을 핵심 산출물로 한다.","재사용 가능한 컴포넌트를 조립하여 시스템을 개발하는 것을 핵심으로 한다."],"answer":[4],"id":"MP-031"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"현행 시스템 분석","prompt":"신규 시스템 구축을 위한 현행 시스템 분석 단계에서 파악할 항목으로 보기 어려운 것을 고르시오.","explanation":"현행 시스템 분석은 AS-IS의 구성·기능·인터페이스·데이터·아키텍처를 파악하는 활동이다. 신규 화면 디자인 확정은 설계 단계의 활동이다.","choices":["현행 시스템의 구성과 제공 기능","타 시스템과의 인터페이스(연동 방식, 주기, 데이터)","현행 데이터의 구조와 데이터량","현행 아키텍처와 하드웨어·소프트웨어 구성","신규 시스템 화면의 최종 디자인 시안 확정"],"answer":[5],"id":"MP-032"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"연동 방식의 선택","prompt":"시스템 간 연동 방식을 선택한 내용으로 가장 적절하지 않은 것을 고르시오.","explanation":"대량 데이터를 정해진 주기로 전달할 때는 배치 기반 파일 전송이나 DB 연계(ETL)가 적합하다. 수십 GB를 건별 REST로 호출하면 호출 수가 지나치게 많아 비효율적이고 장애 위험이 크다.","choices":["SAP ERP에 정의된 원가 계산 함수를 외부 시스템이 원격으로 호출한다. – RFC","모바일 앱이 주문 상태를 실시간으로 조회한다. – REST API","협력사와 일 단위 대량 정산 파일을 주고받는다. – 파일 전송(SFTP) 배치","주문 발생 이벤트를 여러 서비스가 비동기로 구독한다. – 메시지 큐(MQ)","하루 1회, 수십 GB의 일 마감 매출 데이터를 정산 시스템으로 전달한다. – 건별 실시간 REST API 호출"],"answer":[5],"id":"MP-033"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"인터페이스 정의서 작성","prompt":"아래 [인터페이스 정의서]의 '처리 유형' 칸 ⓐ, ⓑ에 들어갈 내용을 각각 작성하시오.","explanation":"정해진 시각에 모아서 일괄 전송하는 것은 배치, 이벤트 발생 즉시 건별로 전송하는 것은 실시간 처리이다.","context":"[인터페이스 정의서]\n| IF ID | 송신 시스템 | 수신 시스템 | 연동 방식 | 처리 주기 | 처리 유형 |\n| IF-001 | 주문 | 정산 | SFTP 파일 | 매일 02:00 전일 주문 전체 | ⓐ |\n| IF-002 | 주문 | 물류 | REST API | 결제 완료 즉시 건별 | ⓑ |","blanks":[{"label":"ⓐ","answers":["배치","Batch","일괄","배치처리"]},{"label":"ⓑ","answers":["실시간","Realtime","Real-time","온라인","Online","실시간처리"]}],"id":"MP-034"},{"category":"방법론/프로세스","type":"essay","difficulty":"상","title":"MSA 연동 방식 설계","prompt":"아래 [업무 흐름]의 연동 ⓐ, ⓑ에 대해 각각 동기/비동기 중 적합한 통신 방식을 제시하고 그 이유를 서술하시오.","explanation":"즉시 결과가 필요한 연동은 동기, 후속·부가 처리는 비동기라는 판단과 근거가 제시되면 정답.","context":"[업무 흐름]\n1) 고객이 주문하면 주문 서비스는 결제 서비스에 결제 승인을 요청하고, 승인 결과에 따라 주문을 확정하거나 실패를 고객에게 즉시 안내해야 한다. ⓐ\n2) 주문이 확정되면 포인트 서비스는 적립을 처리하고, 알림 서비스는 주문 완료 알림톡을 발송한다. 이 처리는 몇 초 늦어져도 업무상 문제가 없다. ⓑ\n3) 포인트·알림 서비스가 일시적으로 장애가 나더라도 주문은 정상적으로 접수되어야 한다.","answer_text":"ⓐ 주문 → 결제: 동기 방식(REST/gRPC 호출)\n  - 결제 승인 여부를 즉시 받아야 주문 확정 여부를 고객에게 바로 응답할 수 있으므로, 응답을 기다리는 동기 호출이 적합하다.\n  - 단, 타임아웃·재시도·Circuit Breaker를 적용하여 결제 지연이 주문 서비스 전체로 전파되지 않도록 한다.\nⓑ 주문 → 포인트 적립/알림: 비동기 방식(메시지 브로커 이벤트 발행)\n  - 주문 완료 응답에 반드시 포함될 필요가 없는 후속 처리이므로, '주문완료' 이벤트를 발행하고 각 서비스가 구독하여 처리한다.\n  - 포인트·알림 서비스 장애가 주문 처리에 영향을 주지 않으며(결합도↓, 장애 격리), 처리 실패 시 재처리할 수 있다.","id":"MP-035"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"인터페이스 응답 데이터 작성 Ⅰ","prompt":"아래 [화면정의서]에 출력된 데이터와 동일한 데이터를 서버로부터 응답받았다. [인터페이스 정의서]를 참고하여 JSON 형식의 [Response 데이터] 중 ⓐ, ⓑ에 들어갈 코드를 각각 작성하시오.","explanation":"화면의 '총 12건'은 totalCount(Number) 12, '10개씩 보기'는 pageSize(Number) 10이다. JSON에서 키는 큰따옴표로 감싸고 숫자 값은 따옴표 없이 작성한다.","context":"[화면정의서] 주문 내역 화면\n```\n┌──────────────────────────────────────────┐\n│ 주문 내역        총 12건   [10개씩 보기 ▼] │\n├──────────────────────────────────────────┤\n│ 2025-03-02  수분크림 외 1건     32,000원  │\n│ 2025-03-01  선크림              18,000원  │\n│ ...                                       │\n├──────────────────────────────────────────┤\n│              < 1  2 >                     │\n└──────────────────────────────────────────┘\n```\n\n[인터페이스 정의서]\n| 구분 | 속성 | 속성명 | 타입 |\n| 기본 | totalCount | 총건수 | Number |\n| 기본 | page | 현재페이지 | Number |\n| 기본 | pageSize | 페이지당건수 | Number |\n| 기본 | orders | 주문목록 | Order[ ] |\n| Order | orderNo | 주문번호 | String |\n| Order | orderDate | 주문일자 | String |\n| Order | amount | 결제금액 | Number |\n\n[Response 데이터]\n```json\n{\n  ⓐ,\n  \"page\": 1,\n  ⓑ,\n  \"orders\": [\n    { \"orderNo\": \"O250302001\", \"orderDate\": \"2025-03-02\", \"amount\": 32000 },\n    { \"orderNo\": \"O250301007\", \"orderDate\": \"2025-03-01\", \"amount\": 18000 }\n    /* 중간 생략 */\n  ]\n}\n```","blanks":[{"label":"ⓐ","answers":["\"totalCount\": 12","totalCount:12","\"totalCount\":12,","totalCount=12"]},{"label":"ⓑ","answers":["\"pageSize\": 10","pageSize:10","\"pageSize\":10,","pageSize=10"]}],"id":"SD-001"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"인터페이스 응답 데이터 작성 Ⅱ","prompt":"아래 [화면정의서]와 [인터페이스 정의서]를 참고하여 XML 형식의 [Response 데이터] 중 ⓐ에 들어갈 코드를 작성하시오.","explanation":"첫 번째 배송지에 '기본배송지' 표시가 있으므로 Boolean 속성 isDefault 값이 true이다. XML은 <속성>값<\/속성> 형식으로 작성한다.","context":"[화면정의서] 배송지 관리 화면\n```\n┌───────────────────────────────────┐\n│ [기본배송지] 집                    │\n│ 06236 서울 강남구 테헤란로 123     │\n├───────────────────────────────────┤\n│ 회사                               │\n│ 04323 서울 용산구 한강대로 372     │\n└───────────────────────────────────┘\n```\n\n[인터페이스 정의서]\n| 구분 | 속성 | 속성명 | 타입 |\n| 기본 | addresses | 배송지목록 | Address[ ] |\n| Address | alias | 배송지별칭 | String |\n| Address | zipCode | 우편번호 | String |\n| Address | addr | 주소 | String |\n| Address | isDefault | 기본배송지여부 | Boolean |\n\n[Response 데이터]\n```xml\n<xml>\n  <addresses>\n    <address>\n      <alias>집<\/alias>\n      <zipCode>06236<\/zipCode>\n      <addr>서울 강남구 테헤란로 123<\/addr>\n      ⓐ\n    <\/address>\n    <address>\n      <alias>회사<\/alias>\n      <zipCode>04323<\/zipCode>\n      <addr>서울 용산구 한강대로 372<\/addr>\n      <isDefault>false<\/isDefault>\n    <\/address>\n  <\/addresses>\n<\/xml>\n```","blanks":[{"label":"ⓐ","answers":["<isDefault>true<\/isDefault>"]}],"id":"SD-002"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"인터페이스 응답 데이터 작성 Ⅲ","prompt":"아래 [화면정의서]의 두 번째 상품에는 '품절' 배지가 표시되어 있다. [인터페이스 정의서]를 참고하여 [Response 데이터]의 ⓐ, ⓑ에 들어갈 코드를 각각 작성하시오.","explanation":"품절 상품은 재고(stock, Number)가 0이고 품절여부(isSoldOut, Boolean)가 true이다. Boolean 값은 따옴표 없이 true/false로 작성한다.","context":"[화면정의서] 상품 목록 화면\n```\n┌──────────────────┬──────────────────┐\n│ 수분크림          │ 립밤      [품절] │\n│ 25,000원          │ 9,000원          │\n│ 재고 12           │ 재고 0           │\n└──────────────────┴──────────────────┘\n```\n\n[인터페이스 정의서]\n| 구분 | 속성 | 속성명 | 타입 |\n| Product | code | 상품코드 | String |\n| Product | name | 상품명 | String |\n| Product | price | 판매가 | Number |\n| Product | stock | 재고 | Number |\n| Product | isSoldOut | 품절여부 | Boolean |\n\n[Response 데이터]\n```json\n{\n  \"products\": [\n    { \"code\": \"P001\", \"name\": \"수분크림\", \"price\": 25000, \"stock\": 12, \"isSoldOut\": false },\n    { \"code\": \"P002\", \"name\": \"립밤\", \"price\": 9000, ⓐ, ⓑ }\n  ]\n}\n```","blanks":[{"label":"ⓐ","answers":["\"stock\": 0","stock:0","\"stock\":0,"]},{"label":"ⓑ","answers":["\"isSoldOut\": true","isSoldOut:true","\"isSoldOut\":true"]}],"id":"SD-003"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"인터페이스 명세 준수 여부","prompt":"아래 [인터페이스 정의서]를 기준으로 할 때, [Response 데이터]에서 명세를 위반한 부분을 고르시오.","explanation":"price는 Number 타입으로 정의되어 있으므로 따옴표 없이 25000으로 전달해야 한다. 문자열로 전달하면 수신 측에서 숫자 연산·정렬 시 오류가 발생할 수 있다.","context":"[인터페이스 정의서]\n| 속성 | 속성명 | 타입 |\n| code | 상품코드 | String |\n| name | 상품명 | String |\n| price | 판매가 | Number |\n| tags | 태그목록 | String[ ] |\n| isNew | 신상품여부 | Boolean |\n\n[Response 데이터]\n```json\n{ \"code\": \"P001\", \"name\": \"수분크림\", \"price\": \"25000\", \"tags\": [\"보습\", \"건성\"], \"isNew\": false }\n```","choices":["\"isNew\": false","\"name\": \"수분크림\"","\"price\": \"25000\"","\"tags\": [\"보습\", \"건성\"]","\"code\": \"P001\""],"answer":[3],"id":"SD-004"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"하","title":"목록 데이터의 표현","prompt":"인터페이스 정의서에 'products: Product[ ] (상품목록)'로 정의되어 있고 상품이 2건일 때, JSON 응답으로 가장 올바른 것을 고르시오.","explanation":"배열 타입(Product[ ])은 JSON 배열 [ ] 안에 각 요소를 객체 { }로 나열한다. 객체 안에 같은 키를 반복하거나 문자열로 합치거나 키 이름에 번호를 붙이는 것은 명세와 맞지 않는다.","choices":["\"product1\": { \"code\": \"P001\" }, \"product2\": { \"code\": \"P002\" }","\"products\": \"P001, P002\"","\"products\": [ \"code\": \"P001\", \"code\": \"P002\" ]","\"products\": { \"code\": \"P001\", \"code\": \"P002\" }","\"products\": [ { \"code\": \"P001\" }, { \"code\": \"P002\" } ]"],"answer":[5],"id":"SD-005"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"화면 동작 규칙 설계 Ⅰ","prompt":"아래 [화면 설명]을 참고하여 [화면 동작 규칙]에 표시된 ⓐ, ⓑ에 들어갈 화면 항목 ID를 각각 작성하시오.","explanation":"지점을 선택하면 해당 지점의 예약 가능 날짜를 날짜 선택(DATE_PICK)에, 날짜를 선택하면 잔여석이 있는 시간대를 시간 선택(TIME_SLOT)에 표시하는 종속 관계이다.","context":"[화면 설명] 매장 체험 예약 화면\n| 항목 ID | 컴포넌트 유형 | 레이블 | 기본값 | 설명 |\n| BRANCH_SEL | Select | 지점 | 지점 선택 | 체험 가능한 매장 지점을 선택하는 드롭다운 |\n| DATE_PICK | DatePicker | 날짜 | - | 예약 날짜를 선택하는 달력 |\n| TIME_SLOT | Radio | 시간 | - | 예약 시간대를 선택하는 버튼 그룹 |\n| PAX_INPUT | Input | 인원 | 1 | 예약 인원을 입력하는 필드 |\n| RSV_BTN | Button | 예약하기 | - | 입력한 조건으로 예약을 요청하는 버튼 |\n\n[화면 동작 규칙]\n| 항목 ID | 동작 규칙 |\n| BRANCH_SEL | ◼ 지점 선택 시 해당 지점의 예약 가능한 날짜만 ⓐ에 활성화 |\n| DATE_PICK | ◼ 지점이 선택되지 않으면 비활성화 ◼ 날짜 선택 시 잔여석이 있는 시간대만 ⓑ에 표시 |\n| TIME_SLOT | ◼ 날짜가 선택되지 않으면 빈 목록 상태 |\n| PAX_INPUT | ◼ 1 ~ 4 사이의 숫자만 입력 가능 |\n| RSV_BTN | ◼ 지점·날짜·시간·인원이 모두 입력되어야 활성화 |","blanks":[{"label":"ⓐ","answers":["DATE_PICK"]},{"label":"ⓑ","answers":["TIME_SLOT"]}],"id":"SD-006"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"화면 동작 규칙 설계 Ⅱ","prompt":"아래 [화면 설명]의 조회 기간 입력 항목에 대한 [화면 동작 규칙]으로 옳지 않은 것을 고르시오.","explanation":"종료일은 시작일보다 같거나 이후여야 한다. 종료일이 시작일보다 이전이어야 한다는 규칙은 기간 조회의 논리와 맞지 않는다.","context":"[화면 설명] 주문 조회 화면 검색 영역\n| 항목 ID | 컴포넌트 유형 | 레이블 | 기본값 | 설명 |\n| START_DT | DatePicker | 시작일 | 오늘-1개월 | 조회 기간의 시작일 |\n| END_DT | DatePicker | 종료일 | 오늘 | 조회 기간의 종료일 |\n| STATUS_SEL | Select | 주문상태 | 전체 | 주문 상태 필터 |\n| SEARCH_BTN | Button | 조회 | - | 조건으로 주문 목록을 조회 |","choices":["START_DT: 날짜 형식(YYYY-MM-DD)만 입력 가능하다.","SEARCH_BTN: 클릭 시 START_DT, END_DT, STATUS_SEL 값을 수집하여 조회를 요청한다.","START_DT: 오늘 이후의 날짜는 선택할 수 없다.","END_DT: 입력된 값은 START_DT보다 이전 날짜여야 한다.","END_DT: 조회 기간(START_DT ~ END_DT)은 최대 3개월을 넘을 수 없다."],"answer":[4],"id":"SD-007"},{"category":"화면설계/인터페이스","type":"short","difficulty":"하","title":"화면 흐름 설계","prompt":"아래 [화면 흐름 규칙]을 참고하여, 상품 수정 화면에서 '저장' 버튼을 눌러 저장이 완료되었을 때 이동해야 하는 화면 ID ⓐ를 작성하시오.","explanation":"저장 완료 시 '수정하기 전에 보던 화면'인 상품 상세(SCR-011)로 복귀하도록 정의되어 있다.","context":"[화면 목록]\n| 화면 ID | 화면명 |\n| SCR-010 | 상품 목록 |\n| SCR-011 | 상품 상세 |\n| SCR-012 | 상품 수정 |\n\n[화면 흐름 규칙]\n• 상품 목록에서 상품을 클릭하면 상품 상세로 이동한다.\n• 상품 상세에서 '수정' 버튼을 누르면 상품 수정 화면으로 이동한다.\n• 상품 수정 화면에서 '취소'를 누르면 변경 내용을 버리고 상품 상세로 돌아간다.\n• 상품 수정 화면에서 저장이 완료되면 변경된 내용을 확인할 수 있도록, 수정하기 전에 보던 화면으로 이동한다.","blanks":[{"label":"ⓐ","answers":["SCR-011","SCR011"]}],"id":"SD-008"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"하","title":"화면정의서의 구성","prompt":"화면정의서(화면설계서)에 일반적으로 포함되는 항목으로 보기 어려운 것을 고르시오.","explanation":"화면정의서는 화면의 구성·항목·동작·흐름을 정의한다. 테이블스페이스와 데이터 파일 경로는 물리 DB 설계 산출물의 내용이다.","choices":["화면 ID와 화면명","화면 레이아웃(와이어프레임)","화면 항목 정의(항목 ID, 유형, 기본값, 필수 여부)","이벤트 및 화면 동작 규칙","DB 테이블스페이스 크기와 데이터 파일 경로"],"answer":[5],"id":"SD-009"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"UI 컴포넌트 선택","prompt":"화면 항목에 대한 UI 컴포넌트 선택으로 가장 적절하지 않은 것을 고르시오.","explanation":"여러 항목 중 반드시 하나만 선택하는 경우에는 라디오 버튼(Radio)이 적합하다. 체크박스는 다중 선택에 사용한다.","choices":["관심 카테고리를 여러 개 동시에 선택한다. – 체크박스(Checkbox)","결제 수단(카드/계좌이체/간편결제) 중 반드시 하나만 선택한다. – 체크박스(Checkbox)","생년월일을 입력한다. – 날짜 선택기(DatePicker)","수십 개의 시·도 중 하나를 선택한다. – 드롭다운(Select)","알림 수신 여부를 켜고 끈다. – 토글 스위치(Toggle)"],"answer":[2],"id":"SD-010"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"UI 설계 원칙","prompt":"UI 설계 원칙과 설명의 연결이 옳지 않은 것을 고르시오.","explanation":"일관성은 화면 간 버튼 위치·용어·동작 방식을 통일하여 사용자가 예측 가능하게 사용하도록 하는 원칙이다.","choices":["일관성: 화면마다 버튼 위치와 용어를 다르게 하여 사용자의 주의를 끌어야 한다.","학습성: 누구나 쉽게 배우고 익힐 수 있어야 한다.","유효성: 사용자의 목적을 정확하고 완벽하게 달성할 수 있어야 한다.","유연성: 사용자의 요구를 최대한 수용하고 실수를 최소화해야 한다.","직관성: 누구나 쉽게 이해하고 사용할 수 있어야 한다."],"answer":[1],"id":"SD-011"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"입력값 검증 위치","prompt":"회원가입 화면의 입력값 검증에 대한 설명으로 가장 적절한 것을 고르시오.","explanation":"클라이언트 검증은 우회(개발자 도구, API 직접 호출)가 가능하므로 보안·무결성을 위해 서버 검증이 반드시 필요하다. 클라이언트 검증은 즉각적인 피드백으로 사용성을 높이는 보조 수단이다.","choices":["입력값 검증은 DB의 NOT NULL·CHECK 제약 조건에만 맡기고, 애플리케이션 계층에서는 검증하지 않는다.","보안을 위해 서버에서만 검증하고, 화면에서는 사용자에게 입력 형식이나 오류에 대한 어떤 안내도 하지 않는다.","화면(클라이언트)에서 즉시 검증해 사용성을 높이고, 서버에서도 동일한 규칙을 반드시 다시 검증한다.","검증 규칙은 화면 특성에 따라 다르므로 개발자마다 화면별로 자유롭게 정하고, 별도로 문서화하지 않는다.","화면(클라이언트)에서 이미 같은 규칙으로 검증했다면, 서버 검증은 중복 처리이므로 성능을 위해 생략하는 것이 바람직하다."],"answer":[3],"id":"SD-012"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"업무 기능 분해도 작성 Ⅰ","prompt":"아래 [업무 시나리오]를 참고하여 [업무 기능 분해도]의 ⓐ ~ ⓒ를 각각 작성하시오.","explanation":"시나리오의 각 단계에서 '누가 무엇을 하는지'를 순서대로 단위 프로세스로 정리한다. 고객이 사유를 선택(ⓐ), 기간 확인 후 시스템이 회수 요청 생성(ⓑ), 검수자가 상품 검수(ⓒ).","context":"[업무 시나리오]\n[반품 신청]\n◼ 고객은 주문 내역에서 반품할 상품을 선택한다.\n◼ 고객은 반품 사유를 선택하고 상품 사진을 첨부한다.\n◼ 시스템은 수령 후 7일 이내인지 반품 가능 기간을 확인하여, 기간이 지난 경우 반품 불가를 안내하고, 가능한 경우 택배사에 회수 요청을 생성한다.\n[회수/환불]\n◼ 택배 기사가 고객에게서 상품을 회수하여 물류센터로 입고한다.\n◼ 물류센터 검수자는 회수된 상품의 상태를 검수한다.\n◼ 검수를 통과하면 시스템은 환불을 처리한다.\n\n[업무 기능 분해도]\n| 업무 | 단위 프로세스명 | 역할자 |\n| 반품 신청 | 반품 상품 선택 | 고객 |\n| 반품 신청 | ⓐ | 고객 |\n| 반품 신청 | 사진 첨부 | 고객 |\n| 반품 신청 | 반품 가능 기간 확인 | 시스템 |\n| 반품 신청 | ⓑ | 시스템 |\n| 회수/환불 | 상품 회수 | 택배 기사 |\n| 회수/환불 | ⓒ | 검수자 |\n| 회수/환불 | 환불 처리 | 시스템 |","blanks":[{"label":"ⓐ","answers":["반품 사유 선택","반품사유선택","사유 선택","사유선택","반품사유 선택"]},{"label":"ⓑ","answers":["회수 요청 생성","회수요청생성","회수 요청","회수요청"]},{"label":"ⓒ","answers":["상품 검수","상품검수","검수","상품 상태 검수","상품상태검수"]}],"id":"SD-013"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"업무 기능 분해도 작성 Ⅱ","prompt":"아래 [업무 시나리오]를 참고하여 [업무 기능 분해도]의 ⓐ ~ ⓒ에 들어갈 역할자를 각각 작성하시오.","explanation":"각 단위 프로세스를 실제로 수행하는 주체를 역할자로 적는다. 비품을 선택하는 것은 직원, 재고를 확인하는 것은 시스템, 결재는 팀장이 수행한다.","context":"[업무 시나리오]\n[비품 신청]\n◼ 직원은 비품 신청 화면에서 필요한 비품과 수량을 선택하고 신청서를 제출한다.\n◼ 시스템은 해당 비품의 재고를 확인하여 부족하면 구매 요청 대상으로 표시한다.\n[결재]\n◼ 신청서는 신청자의 팀장에게 결재 요청되며, 팀장은 승인 또는 반려한다.\n◼ 승인되면 총무 담당자가 비품을 출고하고, 시스템은 재고를 차감한다.\n\n[업무 기능 분해도]\n| 업무 | 단위 프로세스명 | 역할자 |\n| 비품 신청 | 비품 선택 | ⓐ |\n| 비품 신청 | 신청서 제출 | 직원 |\n| 비품 신청 | 재고 확인 | ⓑ |\n| 결재 | 결재 승인/반려 | ⓒ |\n| 결재 | 비품 출고 | 총무 담당자 |\n| 결재 | 재고 차감 | 시스템 |","blanks":[{"label":"ⓐ","answers":["직원","신청 직원","신청직원","사원"]},{"label":"ⓑ","answers":["시스템"]},{"label":"ⓒ","answers":["팀장","결재자","부서장"]}],"id":"SD-014"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"업무 기능 분해도 검토","prompt":"아래 [업무 시나리오]를 바탕으로 작성한 [업무 기능 분해도]를 검토한 결과로 옳은 것을 고르시오.","explanation":"시나리오에서 좌석을 고르는 주체는 고객이다. 키오스크가 수행하는 것은 잔여 좌석 표시와 티켓 출력이다.","context":"[업무 시나리오]\n[예매]\n◼ 고객은 키오스크에서 영화를 선택하고, 상영 시간을 선택한다.\n◼ 키오스크는 선택한 상영 회차의 잔여 좌석을 표시하고, 고객은 원하는 좌석을 선택한다.\n[결제]\n◼ 고객은 결제 수단을 선택하고 결제를 수행한다.\n◼ 결제가 완료되면 키오스크는 티켓을 출력한다.\n\n[업무 기능 분해도]\n| 업무 | 단위 프로세스명 | 역할자 |\n| 예매 | 영화 선택 | 고객 |\n| 예매 | 상영 시간 선택 | 고객 |\n| 예매 | 잔여 좌석 표시 | 키오스크 |\n| 예매 | 좌석 선택 | 키오스크 |\n| 결제 | 결제 수단 선택 | 고객 |\n| 결제 | 결제 수행 | 고객 |\n| 결제 | 티켓 출력 | 키오스크 |","choices":["'티켓 출력'의 역할자는 고객이어야 한다.","'영화 선택'의 역할자가 고객인 것은 잘못이다.","잘못 작성된 항목이 없다.","'좌석 선택'의 역할자는 고객이어야 하는데 키오스크로 잘못 작성되었다.","'결제 수행'은 결제 업무가 아니라 예매 업무에 속해야 한다."],"answer":[4],"id":"SD-015"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"할인 규칙 적용","prompt":"아래 [할인 정책 결정 테이블]에 따를 때, 'GOLD 등급 회원이 첫 구매가 아니고 주문금액이 80,000원인 경우'의 결제 금액을 고르시오.","explanation":"GOLD 등급이고 50,000원 이상 100,000원 미만이므로 할인율 5%가 적용된다. 첫 구매 추가 할인은 해당되지 않는다. 80,000 × 0.95 = 76,000원.","context":"[할인 정책 결정 테이블]\n| 회원 등급 | 주문금액 조건 | 할인율 |\n| VIP | 금액 무관 | 10% |\n| GOLD | 100,000원 이상 | 8% |\n| GOLD | 50,000원 이상 100,000원 미만 | 5% |\n| GOLD | 50,000원 미만 | 0% |\n| 일반 | 금액 무관 | 0% |\n\n※ 첫 구매 회원은 위 할인율에 추가로 3%p를 더한다.","choices":["74,000원","80,000원","72,000원","68,000원","76,000원"],"answer":[5],"id":"SD-016"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"배송비 계산 규칙","prompt":"아래 [배송비 정책]에 따를 때, 주문금액 25,000원인 고객이 도서산간 지역으로 배송을 요청한 경우의 배송비 ⓐ를 숫자로 작성하시오.","explanation":"주문금액이 30,000원 미만이므로 기본 배송비 3,000원이 부과되고, 도서산간 추가 배송비 3,000원이 더해져 6,000원이다.","context":"[배송비 정책]\n• 기본 배송비는 3,000원이다.\n• 주문금액이 30,000원 이상이면 기본 배송비는 무료이다.\n• 도서산간 지역은 주문금액과 관계없이 추가 배송비 3,000원이 부과된다.","blanks":[{"label":"ⓐ","answers":["6000","6,000","6000원","6,000원"]}],"id":"SD-017"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"상태 전이 규칙","prompt":"아래 [주문 상태 전이 규칙]에서 허용되지 않는 상태 전이를 고르시오.","explanation":"주문 취소는 배송이 시작되기 전(배송준비까지)만 가능하다. 배송중 상태에서는 취소가 아닌 반품 절차를 거쳐야 한다.","context":"[주문 상태 전이 규칙]\n• 주문 상태는 주문접수 → 결제완료 → 배송준비 → 배송중 → 배송완료 순서로 진행된다.\n• 고객은 상품이 출고되기 전, 즉 배송준비 상태까지만 주문을 취소할 수 있으며 취소 시 '주문취소' 상태가 된다.\n• 배송중 이후에는 취소할 수 없으며, 배송완료 후 반품 신청만 가능하다.","choices":["주문접수 → 결제완료","결제완료 → 주문취소","배송준비 → 주문취소","배송중 → 주문취소","배송중 → 배송완료"],"answer":[4],"id":"SD-018"},{"category":"화면설계/인터페이스","type":"short","difficulty":"상","title":"도메인 모델의 일관성 경계","prompt":"도메인 주도 설계(DDD)에서 주문(Order)과 주문항목(OrderLine)처럼 데이터 변경 시 일관성을 함께 유지해야 하는 객체들을 하나의 단위로 묶고, 외부에서는 대표 객체인 Order를 통해서만 내부 객체를 변경하도록 하는 설계 단위를 ⓐ라고 한다. ⓐ를 작성하시오.","explanation":"Aggregate(애그리거트)는 일관성 경계를 이루는 객체 묶음이며, 대표 객체를 Aggregate Root라 한다.","blanks":[{"label":"ⓐ","answers":["Aggregate","애그리거트","애그리게이트","어그리게이트","애그리게잇","집합체"]}],"id":"SD-019"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"하","title":"RESTful API 설계","prompt":"RESTful API 설계로 가장 적절하지 않은 것을 고르시오.","explanation":"REST는 URI로 자원(명사)을 표현하고 행위는 HTTP 메서드로 표현한다. 삭제는 DELETE /orders/{orderId}로 설계하며, URI에 동사를 넣고 GET으로 상태를 변경하면 안 된다.","choices":["주문 목록 조회: GET /orders","특정 주문 조회: GET /orders/{orderId}","주문 생성: POST /orders","주문 삭제: GET /deleteOrder?orderId=1001","주문 상태 변경: PATCH /orders/{orderId}"],"answer":[4],"id":"SD-020"},{"category":"화면설계/인터페이스","type":"short","difficulty":"하","title":"HTTP 응답 상태 코드","prompt":"REST API 응답 상태 코드로 ⓐ 새 자원이 정상적으로 생성되었을 때, ⓑ 인증 정보(로그인 토큰)가 없거나 유효하지 않을 때, ⓒ 요청한 자원이 존재하지 않을 때 사용하는 코드를 각각 숫자로 작성하시오.","explanation":"201 Created, 401 Unauthorized(인증 실패), 404 Not Found. 참고로 인증은 되었으나 권한이 없으면 403 Forbidden이다.","blanks":[{"label":"ⓐ","answers":["201"]},{"label":"ⓑ","answers":["401"]},{"label":"ⓒ","answers":["404"]}],"id":"SD-021"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"HTTP 메서드의 멱등성","prompt":"같은 요청을 여러 번 보내도 서버 상태가 한 번 보낸 것과 같은 결과가 되는 성질을 멱등성이라 한다. 일반적인 REST 설계에서 멱등하지 않은 메서드를 고르시오.","explanation":"POST는 요청할 때마다 새 자원을 생성할 수 있어 멱등하지 않다. 결제처럼 중복 요청이 위험한 경우 멱등키(Idempotency-Key)를 함께 설계한다.","choices":["GET","PUT","DELETE","POST","HEAD"],"answer":[4],"id":"SD-022"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"API 요청 명세 검증","prompt":"아래 [회원가입 API 요청 명세]를 기준으로 할 때, 서버가 정상 처리할 수 있는 요청을 고르시오.","explanation":"필수 항목(email, password, name)이 모두 있고 형식 규칙을 만족하는 요청만 정상이다. name 누락, 비밀번호 길이 미달, 이메일 형식 오류, Boolean 항목에 문자열 \"Y\" 전달은 명세 위반이다.","context":"[회원가입 API 요청 명세] POST /members\n| 속성 | 타입 | 필수 | 규칙 |\n| email | String | Y | 이메일 형식 |\n| password | String | Y | 8자 이상, 영문·숫자·특수문자 포함 |\n| name | String | Y | 2 ~ 20자 |\n| marketingAgree | Boolean | N | 미입력 시 false |","choices":["{ \"email\": \"a@cj.net\", \"password\": \"Abcd1234!\", \"name\": \"김하늘\" }","{ \"email\": \"a@cj.net\", \"password\": \"Abcd1234!\", \"name\": \"김하늘\", \"marketingAgree\": \"Y\" }","{ \"email\": \"a@cj.net\", \"password\": \"abc\", \"name\": \"김하늘\" }","{ \"email\": \"a@cj.net\", \"password\": \"Abcd1234!\" }","{ \"email\": \"a.cj.net\", \"password\": \"Abcd1234!\", \"name\": \"김하늘\" }"],"answer":[1],"id":"SD-023"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"상","title":"대용량 목록 조회 방식","prompt":"초당 수천 건의 새 글이 등록되는 피드 화면에서 OFFSET/LIMIT 방식의 페이지 조회를 사용할 때 발생하는 문제와 개선 방안으로 가장 적절한 것을 고르시오.","explanation":"OFFSET은 앞쪽 행을 읽고 버리므로 깊은 페이지일수록 비용이 커지고, 데이터가 계속 추가되면 페이지 경계가 밀려 중복·누락이 생긴다. 'WHERE id < 마지막ID ORDER BY id DESC LIMIT n' 형태의 커서 방식이 적합하다.","choices":["목록 조회 시 전체 데이터를 한 번에 내려받아 화면에서 나누어 보여주면, 서버 부하와 중복 문제가 모두 해결된다.","뒤쪽 페이지로 갈수록 건너뛰는 행이 많아져 느려지고, 조회 중 새 글이 추가되면 중복·누락이 생기므로 마지막으로 본 항목의 키를 기준으로 조회하는 커서(Keyset) 방식을 사용한다.","ORDER BY 없이 조회하면 정렬 비용이 사라지므로 조회 성능과 페이지 간 결과의 정확성이 모두 개선된다.","페이지 크기를 충분히 크게 늘리면 조회 중 새 글이 추가되더라도 페이지 경계의 중복·누락 문제가 완전히 사라진다.","OFFSET 방식은 앞쪽 데이터를 건너뛰는 비용이 들지 않으므로, 페이지 번호와 관계없이 항상 일정한 조회 속도를 보장한다."],"answer":[2],"id":"SD-024"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"하","title":"테스트 단계의 구분","prompt":"단위 테스트와 통합 테스트에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"단위 테스트는 결함을 가장 작은 범위에서 빠르고 저렴하게 찾게 해 준다. 통합 테스트만으로는 결함 위치를 특정하기 어렵고 수정 비용도 커진다.","choices":["통합 테스트는 모듈 간 인터페이스와 데이터 흐름, 연동 기능을 검증한다.","통합 테스트를 충분히 수행하면 단위 테스트는 생략해도 결함을 더 빠르게 찾을 수 있다.","단위 테스트는 개별 모듈(함수, 클래스)이 명세대로 동작하는지 검증한다.","단위 테스트에서는 외부 의존성을 스텁이나 목 객체로 대체할 수 있다.","통합 테스트에서 발견되는 대표적인 결함은 모듈 간 데이터 형식 불일치, 호출 순서 오류 등이다."],"answer":[2],"id":"SD-025"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"경계값 분석","prompt":"주문수량 입력 필드는 1 이상 100 이하의 정수만 허용한다. 경계값 분석 기법으로 테스트할 때, 유효 범위 바로 바깥의 두 값 ⓐ(하한 바깥), ⓑ(상한 바깥)를 각각 작성하시오.","explanation":"경계값 분석은 오류가 많이 발생하는 경계 부근(0, 1, 2 / 99, 100, 101)을 테스트한다. 유효 범위 바로 바깥 값은 0과 101이다.","blanks":[{"label":"ⓐ","answers":["0"]},{"label":"ⓑ","answers":["101"]}],"id":"SD-026"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"동등 분할 테스트","prompt":"회원 등급은 누적 구매액에 따라 0원 이상 100만 원 미만은 일반, 100만 원 이상 500만 원 미만은 GOLD, 500만 원 이상은 VIP로 정한다. 동등 분할(Equivalence Partitioning) 기법으로 유효 입력의 대표값을 고를 때 가장 적절한 조합을 고르시오.","explanation":"동등 분할은 같은 결과를 내는 입력 구간(일반/GOLD/VIP)마다 대표값을 하나씩 선택한다. 한 구간에서만 여러 값을 고르면 다른 구간을 검증하지 못한다.","choices":["50만 원, 300만 원, 700만 원","300만 원, 400만 원, 450만 원","10만 원, 20만 원, 30만 원","600만 원, 700만 원, 800만 원","100만 원, 100만 원, 100만 원"],"answer":[1],"id":"SD-027"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"테스트 대역의 종류","prompt":"외부 결제 API를 호출하는 주문 서비스를 테스트할 때 사용하는 테스트 대역(Test Double)에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"Dummy는 메서드 인자를 채우기 위해 전달만 하고 실제로 사용되지 않는 객체이다. 테스트 대역은 실제 외부 시스템을 대신하는 것이므로 실제 결제를 발생시키지 않는다.","choices":["Mock: 결제 API가 기대한 인자로 정확히 1번 호출되었는지 등 상호작용을 검증한다.","Fake: 실제처럼 동작하지만 단순화된 구현(예: 메모리 기반 저장소)이다.","Dummy: 실제 운영 결제 API를 그대로 호출하여 실제 결제를 발생시킨다.","Spy: 실제 객체처럼 동작하면서 호출 내역을 기록하여 나중에 확인할 수 있다.","Stub: 결제 API 대신 미리 정해 둔 고정 응답(예: 승인 성공)을 반환한다."],"answer":[3],"id":"SD-028"},{"category":"화면설계/인터페이스","type":"short","difficulty":"중","title":"통합 테스트 방식","prompt":"통합 테스트 시 최상위 모듈(예: 주문 컨트롤러)부터 시작하여 아래 방향으로 모듈을 하나씩 결합하며 테스트하고, 아직 개발되지 않은 하위 모듈은 임시 모듈(스텁)로 대체하는 통합 방식을 ⓐ에 작성하시오.","explanation":"하향식(Top-down) 통합은 상위 모듈부터 결합하며 하위 모듈은 스텁으로 대체한다. 상향식(Bottom-up)은 하위 모듈부터 결합하며 상위 호출부를 드라이버로 대체한다.","blanks":[{"label":"ⓐ","answers":["하향식","하향식통합","TopDown","Top-down","탑다운","하향식 통합","하향식통합테스트"]}],"id":"SD-029"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"하","title":"변경 후 테스트","prompt":"운영 중인 쇼핑몰에서 할인 계산 로직을 수정하여 배포하려 한다. 수정된 부분 때문에 기존에 정상 동작하던 다른 기능(장바구니, 쿠폰, 포인트 결제 등)에 문제가 생기지 않았는지 확인하는 테스트를 고르시오.","explanation":"변경 사항이 기존 기능에 부작용을 일으키지 않았는지 반복 확인하는 것은 회귀 테스트이며, 자동화하여 CI에서 실행하는 것이 효과적이다.","choices":["회귀 테스트(Regression Test)","인수 테스트(Acceptance Test)","성능 테스트(Performance Test)","탐색적 테스트(Exploratory Test)","알파 테스트(Alpha Test)"],"answer":[1],"id":"SD-030"},{"category":"화면설계/인터페이스","type":"mcq","difficulty":"중","title":"단위 테스트 케이스 검토","prompt":"아래 [함수 명세]에 대해 작성한 단위 테스트 케이스 중 기대 결과가 잘못된 것을 고르시오.","explanation":"주문금액이 30,000원 '이상'이면 기본 배송비가 무료이므로 calcShipping(30000, false)의 기대 결과는 0이다. 경계값에서 '이상/초과'를 혼동하기 쉽다.","context":"[함수 명세] calcShipping(orderAmount: number, isRemote: boolean): number\n• 기본 배송비는 3,000원이다.\n• orderAmount가 30,000 이상이면 기본 배송비는 0원이다.\n• isRemote가 true이면 3,000원을 추가한다.","choices":["calcShipping(25000, false) → 3000","calcShipping(30000, false) → 3000","calcShipping(30000, true) → 3000","calcShipping(25000, true) → 6000","calcShipping(50000, false) → 0"],"answer":[2],"id":"SD-031"},{"category":"화면설계/인터페이스","type":"essay","difficulty":"중","title":"화면 동작 규칙 작성","prompt":"아래 [화면 설명]의 회원가입 화면에서 PW_CONFIRM과 EMAIL_CHK_BTN 항목에 대한 화면 동작 규칙을 각각 2가지 이상 작성하시오.","explanation":"항목 간 의존 관계(다른 항목 값과 비교, 버튼 활성화 조건, 서버 요청)를 구체적으로 작성하면 정답.","context":"[화면 설명] 회원가입 화면\n| 항목 ID | 컴포넌트 유형 | 레이블 | 설명 |\n| EMAIL_INPUT | Input | 이메일 | 로그인 ID로 사용할 이메일 |\n| EMAIL_CHK_BTN | Button | 중복확인 | 이메일 사용 가능 여부 확인 |\n| PW_INPUT | Password | 비밀번호 | 8자 이상, 영문·숫자·특수문자 |\n| PW_CONFIRM | Password | 비밀번호 확인 | 비밀번호 재입력 |\n| JOIN_BTN | Button | 가입하기 | 회원가입 요청 |","answer_text":"PW_CONFIRM (비밀번호 확인)\n  ◼ 필수 입력\n  ◼ 입력값이 PW_INPUT 값과 일치하지 않으면 '비밀번호가 일치하지 않습니다' 오류 메시지를 표시\n  ◼ PW_INPUT 값이 변경되면 일치 여부를 다시 검사\n  ◼ 입력 내용은 마스킹(●) 처리\nEMAIL_CHK_BTN (이메일 중복 확인)\n  ◼ EMAIL_INPUT이 비어 있거나 이메일 형식이 아니면 비활성화\n  ◼ 클릭 시 EMAIL_INPUT 값으로 서버에 중복 확인을 요청하고 결과 메시지(사용 가능/이미 사용 중)를 표시\n  ◼ 중복 확인을 완료한 뒤 EMAIL_INPUT 값이 바뀌면 확인 상태를 초기화\n  ◼ 중복 확인이 완료되지 않으면 JOIN_BTN 비활성화","id":"SD-032"},{"category":"화면설계/인터페이스","type":"essay","difficulty":"중","title":"테스트 케이스 설계","prompt":"아래 [할인 쿠폰 적용 규칙]을 검증하기 위한 테스트 케이스를 경계값 분석 관점에서 3개 이상 작성하시오. (입력값과 기대 결과를 포함)","explanation":"경계값(최소 주문금액의 바로 아래·같음·바로 위, 유효기간 경계)을 포함하고 기대 결과가 규칙과 일치하면 정답.","context":"[할인 쿠폰 적용 규칙]\n• 5,000원 할인 쿠폰은 주문금액이 20,000원 이상일 때만 적용할 수 있다.\n• 쿠폰은 만료일 당일 23:59:59까지 사용할 수 있다.\n• 할인 적용 후 결제금액 = 주문금액 - 5,000원","answer_text":"(예시)\n| TC | 주문금액 | 쿠폰 | 기대 결과 |\n| TC-01 | 19,999원 | 5,000원 쿠폰 | 적용 불가(최소 주문금액 미달) 안내 |\n| TC-02 | 20,000원 | 5,000원 쿠폰 | 적용 가능, 결제금액 15,000원 |\n| TC-03 | 20,001원 | 5,000원 쿠폰 | 적용 가능, 결제금액 15,001원 |\n| TC-04 | 20,000원 | 만료일이 어제인 쿠폰 | 적용 불가(기간 만료) |\n| TC-05 | 20,000원 | 만료일이 오늘인 쿠폰 | 적용 가능 |\n핵심: 최소 주문금액 경계(19,999 / 20,000 / 20,001)와 유효기간 경계(만료일 당일 / 다음 날)를 포함해야 한다.","id":"SD-033"},{"category":"화면설계/인터페이스","type":"essay","difficulty":"상","title":"비즈니스 로직 처리 위치","prompt":"아래 [상황]에서 재고 차감 로직을 어디에(화면/서버/DB) 어떻게 구현해야 하는지 제시하고, 그 이유를 서술하시오.","explanation":"서버 측 트랜잭션 처리 + 동시성 제어(조건부 UPDATE, 비관적/낙관적 잠금) + 클라이언트 처리의 위험을 제시하면 정답.","context":"[상황]\n• 한정 수량(100개) 상품의 판매 이벤트에서 1초에 수천 건의 주문 요청이 몰린다.\n• 현재 화면(JavaScript)에서 재고 수량을 조회하여 0보다 크면 주문 버튼을 활성화하고, 주문 API 호출 시 서버는 재고를 조회한 뒤 별도로 '재고 - 1' 값을 저장한다.\n• 이벤트 후 실제 판매 수량이 100개를 넘는 초과 판매가 발생하였다.","answer_text":"구현 위치: 서버(서비스 계층)의 트랜잭션 안에서 처리하고, DB 수준의 동시성 제어를 함께 적용한다.\n방법(예시):\n  - 결제 승인 후 서버 트랜잭션 안에서 'UPDATE 재고 SET 수량 = 수량 - :주문수량 WHERE 상품코드 = :상품코드 AND 수량 >= :주문수량' 처럼 조건부 갱신을 수행하고, 갱신 건수가 0이면 재고 부족으로 처리(롤백)\n  - 또는 SELECT … FOR UPDATE 로 행 잠금 후 차감, 혹은 버전 컬럼을 이용한 낙관적 잠금\n이유:\n  - 화면(클라이언트)에서 차감하면 조작·우회가 가능하고, 여러 사용자의 동시 요청을 제어할 수 없다.\n  - 동시 주문 시 '조회 후 차감'을 잠금 없이 하면 두 요청이 같은 재고를 읽어 초과 판매가 발생한다.\n  - 따라서 업무 규칙은 서버에 두고, 동시성은 DB 잠금/조건부 UPDATE로 보장해야 한다.","id":"SD-034"},{"category":"SQL","type":"mcq","difficulty":"상","title":"SQL 실행 결과 이해 Ⅰ","prompt":"다음 [직원], [부서] 테이블 데이터를 참조하여 ⓐ, ⓑ SQL의 실행 결과를 올바르게 나열한 것을 고르시오.","explanation":"ⓐ LEFT OUTER JOIN은 왼쪽(EMP) 행을 모두 남기므로 매칭되지 않는 E4, E5도 포함되어 5건이다. ⓑ 서브쿼리 결과에 NULL이 있으면 'dept_id NOT IN (10, 10, 20, NULL, 40)'은 어떤 행에 대해서도 TRUE가 될 수 없어(UNKNOWN) 0건이다. NOT EXISTS를 쓰면 30(품질) 1건이 나온다.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |\n\n[SQL 구문]\n```sql\n-- ⓐ\nSELECT COUNT(*)\n  FROM EMP e\n  LEFT OUTER JOIN DEPT d ON e.dept_id = d.dept_id;\n\n-- ⓑ\nSELECT COUNT(*)\n  FROM DEPT d\n WHERE d.dept_id NOT IN (SELECT e.dept_id FROM EMP e);\n```","choices":["ⓐ 3  ⓑ 0","ⓐ 4  ⓑ 1","ⓐ 5  ⓑ 1","ⓐ 5  ⓑ 0","ⓐ 4  ⓑ 0"],"answer":[4],"id":"SQ-001"},{"category":"SQL","type":"short","difficulty":"중","title":"집계 함수와 NULL Ⅰ","prompt":"위와 동일한 [직원] 테이블에 대해 아래 SQL을 실행했을 때 ⓐ, ⓑ, ⓒ 값을 각각 작성하시오.","explanation":"COUNT(*)는 NULL 여부와 관계없이 모든 행(5), COUNT(컬럼)은 NULL을 제외(4), COUNT(DISTINCT 컬럼)은 NULL 제외 후 중복 제거(10, 20, 40 → 3)한다.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |\n\n```sql\nSELECT COUNT(*)                AS ⓐ,\n       COUNT(dept_id)          AS ⓑ,\n       COUNT(DISTINCT dept_id) AS ⓒ\n  FROM EMP;\n```","blanks":[{"label":"ⓐ","answers":["5"]},{"label":"ⓑ","answers":["4"]},{"label":"ⓒ","answers":["3"]}],"id":"SQ-002"},{"category":"SQL","type":"mcq","difficulty":"중","title":"SQL 실행 결과 이해 Ⅱ","prompt":"다음 [직원], [부서] 테이블 데이터를 참조할 때 아래 SQL의 실행 결과를 고르시오.","explanation":"FULL OUTER JOIN = 매칭 행 3건(E1, E2, E3) + EMP 쪽 미매칭 2건(E4, E5) + DEPT 쪽 미매칭 1건(30 품질) = 6건.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |\n\n```sql\nSELECT COUNT(*)\n  FROM EMP e\n  FULL OUTER JOIN DEPT d ON e.dept_id = d.dept_id;\n```","choices":["3","4","5","6","8"],"answer":[4],"id":"SQ-003"},{"category":"SQL","type":"mcq","difficulty":"중","title":"그룹 함수와 HAVING","prompt":"다음 [매출] 테이블에 아래 SQL을 실행한 결과로 옳은 것을 고르시오.","explanation":"SUM과 COUNT(amt)는 NULL을 제외하고 계산한다. 부산은 SUM 150, COUNT(amt) 1이다. HAVING SUM(amt) >= 110 조건에 대구(110)도 포함되고, 합계 내림차순이므로 서울 → 부산 → 대구 순이다.","context":"[매출] SALES\n| region | amt |\n| 서울 | 100 |\n| 서울 | 200 |\n| 부산 | 150 |\n| 부산 | NULL |\n| 대구 | 50 |\n| 대구 | 60 |\n\n```sql\nSELECT region, SUM(amt) AS s, COUNT(amt) AS c\n  FROM SALES\n GROUP BY region\nHAVING SUM(amt) >= 110\n ORDER BY s DESC;\n```","choices":["(서울, 300, 2), (부산, 150, 1)","(서울, 300, 2), (부산, 150, 2), (대구, 110, 2)","(서울, 300, 2), (부산, NULL, 2), (대구, 110, 2)","(서울, 300, 2), (대구, 110, 2), (부산, 150, 1)","(서울, 300, 2), (부산, 150, 1), (대구, 110, 2)"],"answer":[5],"id":"SQ-004"},{"category":"SQL","type":"short","difficulty":"중","title":"집계 함수와 NULL Ⅱ","prompt":"위 [매출] 테이블과 같은 데이터에 대해 아래 ⓐ, ⓑ SQL의 실행 결과를 각각 숫자로 작성하시오.","explanation":"ⓐ AVG는 NULL을 제외한 값의 평균이므로 150 / 1 = 150. ⓑ COALESCE로 NULL을 0으로 바꾸면 (150 + 0) / 2 = 75.","context":"[매출] SALES\n| region | amt |\n| 서울 | 100 |\n| 서울 | 200 |\n| 부산 | 150 |\n| 부산 | NULL |\n| 대구 | 50 |\n| 대구 | 60 |\n\n```sql\n-- ⓐ\nSELECT AVG(amt) FROM SALES WHERE region = '부산';\n-- ⓑ\nSELECT AVG(COALESCE(amt, 0)) FROM SALES WHERE region = '부산';\n```","blanks":[{"label":"ⓐ","answers":["150","150.0"]},{"label":"ⓑ","answers":["75","75.0"]}],"id":"SQ-005"},{"category":"SQL","type":"short","difficulty":"하","title":"SQL 명령어의 선택","prompt":"아래 [데이터 처리 방식]에 따라 ⓐ, ⓑ, ⓒ에 들어갈 SQL 명령어를 각각 작성하시오.","explanation":"테이블 구조 변경(컬럼 추가)은 ALTER, 구조는 유지하고 전체 행을 빠르게 비우는 것은 TRUNCATE, 조건에 맞는 행만 삭제하는 것은 DELETE(DML)이다.","context":"[데이터 처리]\n| 데이터 처리 방식 | SQL 명령 |\n| 신규 회원등급 테이블 T210_GRADE를 만든다. | CREATE |\n| 운영 중인 주문 테이블 T100_ORD에 비고(REMARK) 컬럼을 새로 추가한다. | ⓐ |\n| 매일 새로 적재하는 임시 집계 테이블 T900_TMP의 모든 행을 아주 빠르게 비우되, 테이블 구조는 그대로 유지한다. | ⓑ |\n| 회원 테이블 T200_MBR에서 탈퇴 후 5년이 지난 회원의 행만 삭제한다. | ⓒ |","blanks":[{"label":"ⓐ","answers":["ALTER","ALTER TABLE"]},{"label":"ⓑ","answers":["TRUNCATE","TRUNCATE TABLE"]},{"label":"ⓒ","answers":["DELETE","DELETE FROM"]}],"id":"SQ-006"},{"category":"SQL","type":"mcq","difficulty":"하","title":"SQL 명령어의 분류","prompt":"SQL 명령어와 그 분류를 짝지은 것으로 옳지 않은 것을 고르시오.","explanation":"REVOKE는 권한을 회수하는 DCL(Data Control Language)이다. DML은 SELECT, INSERT, UPDATE, DELETE, MERGE 등이다.","choices":["GRANT – DCL","REVOKE – DML","MERGE – DML","TRUNCATE – DDL","COMMIT – TCL"],"answer":[2],"id":"SQ-007"},{"category":"SQL","type":"short","difficulty":"중","title":"트랜잭션 제어","prompt":"빈 테이블 T에 대해 아래 SQL을 순서대로 실행하였다. 마지막 SELECT의 결과 ⓐ를 작성하시오.","explanation":"ROLLBACK TO A는 SAVEPOINT A 이후의 작업(INSERT 2)만 취소한다. 이후 INSERT 3을 하고 COMMIT하므로 1, 3 두 행이 남는다.","context":"```sql\nINSERT INTO T VALUES (1);\nSAVEPOINT A;\nINSERT INTO T VALUES (2);\nROLLBACK TO A;\nINSERT INTO T VALUES (3);\nCOMMIT;\n\nSELECT COUNT(*) FROM T;   -- 결과: ⓐ\n```","blanks":[{"label":"ⓐ","answers":["2","2건","2개"]}],"id":"SQ-008"},{"category":"SQL","type":"mcq","difficulty":"중","title":"서브쿼리 실행 결과","prompt":"다음 [직원] 테이블에 아래 SQL을 실행했을 때의 결과를 고르시오.","explanation":"AVG(salary)는 NULL을 제외하고 (300+400+500+600)/4 = 450이다. 450보다 큰 급여는 500, 600으로 2명이다. NULL은 비교 결과가 UNKNOWN이므로 제외된다.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |\n\n```sql\nSELECT COUNT(*)\n  FROM EMP\n WHERE salary > (SELECT AVG(salary) FROM EMP);\n```","choices":["1","2","3","4","0"],"answer":[2],"id":"SQ-009"},{"category":"SQL","type":"short","difficulty":"중","title":"순위 함수","prompt":"다음 [성적] 테이블에 아래 SQL을 실행했을 때, 학생 D의 ⓐ r1 값과 ⓑ r2 값을 각각 작성하시오.","explanation":"RANK는 동점(85점 2명)이 있으면 다음 순위를 건너뛰어 1, 2, 2, 4가 되고, DENSE_RANK는 건너뛰지 않아 1, 2, 2, 3이 된다.","context":"[성적] SCORE\n| student | score |\n| A | 90 |\n| B | 85 |\n| C | 85 |\n| D | 80 |\n\n```sql\nSELECT student,\n       RANK()       OVER (ORDER BY score DESC) AS r1,\n       DENSE_RANK() OVER (ORDER BY score DESC) AS r2\n  FROM SCORE;\n```","blanks":[{"label":"ⓐ","answers":["4"]},{"label":"ⓑ","answers":["3"]}],"id":"SQ-010"},{"category":"SQL","type":"mcq","difficulty":"하","title":"집합 연산자","prompt":"테이블 A의 값이 (1, 2, 2, 3), 테이블 B의 값이 (2, 3, 4)일 때, 'SELECT v FROM A UNION SELECT v FROM B'와 'SELECT v FROM A UNION ALL SELECT v FROM B'의 결과 행 수를 순서대로 나열한 것을 고르시오.","explanation":"UNION은 중복을 제거하므로 {1, 2, 3, 4} 4행, UNION ALL은 중복을 그대로 포함하여 4 + 3 = 7행이다.","choices":["4, 7","7, 4","3, 7","4, 6","5, 7"],"answer":[1],"id":"SQ-011"},{"category":"SQL","type":"mcq","difficulty":"하","title":"NULL 비교","prompt":"위 [직원] 테이블에서 부서가 지정되지 않은 직원(E4)을 조회하는 SQL로 옳은 것을 고르시오.","explanation":"NULL과의 비교 연산(=, <>, IN)은 결과가 UNKNOWN이 되어 어떤 행도 반환하지 않는다. NULL 여부는 IS NULL / IS NOT NULL로 확인한다.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |","choices":["SELECT * FROM EMP WHERE dept_id = 'NULL';","SELECT * FROM EMP WHERE dept_id = NULL;","SELECT * FROM EMP WHERE dept_id IN (NULL);","SELECT * FROM EMP WHERE dept_id <> NULL;","SELECT * FROM EMP WHERE dept_id IS NULL;"],"answer":[5],"id":"SQ-012"},{"category":"SQL","type":"short","difficulty":"중","title":"외부 조인과 COUNT","prompt":"다음 SQL은 부서별 직원 수를 조회한다. [직원], [부서] 테이블 데이터를 기준으로 '품질' 부서 행의 ⓐ cnt1, ⓑ cnt2 값을 각각 작성하시오.","explanation":"품질 부서는 직원이 없어 LEFT JOIN 결과에 EMP 쪽 컬럼이 모두 NULL인 행이 1개 생긴다. COUNT(e.emp_id)는 NULL을 세지 않아 0, COUNT(*)는 행 자체를 세므로 1이 된다. 직원 수를 구할 때는 COUNT(e.emp_id)를 써야 한다.","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |\n\n```sql\nSELECT d.dept_nm,\n       COUNT(e.emp_id) AS cnt1,\n       COUNT(*)        AS cnt2\n  FROM DEPT d\n  LEFT OUTER JOIN EMP e ON d.dept_id = e.dept_id\n GROUP BY d.dept_nm;\n```","blanks":[{"label":"ⓐ","answers":["0"]},{"label":"ⓑ","answers":["1"]}],"id":"SQ-013"},{"category":"SQL","type":"mcq","difficulty":"중","title":"셀프 조인","prompt":"다음 [사원] 테이블에서 아래 SQL의 실행 결과 행 수를 고르시오.","explanation":"INNER JOIN이므로 관리자(mgr_id)가 있고 그 관리자가 테이블에 존재하는 사원만 결과에 포함된다. 102(→101), 103(→101), 104(→102)가 해당되어 3행이다. 101은 mgr_id가 NULL이라 제외된다.","context":"[사원] STAFF\n| staff_id | staff_nm | mgr_id |\n| 101 | 대표 | NULL |\n| 102 | 팀장A | 101 |\n| 103 | 팀장B | 101 |\n| 104 | 사원C | 102 |\n\n```sql\nSELECT s.staff_nm, m.staff_nm AS mgr_nm\n  FROM STAFF s\n  JOIN STAFF m ON s.mgr_id = m.staff_id;\n```","choices":["2","3","4","1","0"],"answer":[2],"id":"SQ-014"},{"category":"SQL","type":"mcq","difficulty":"중","title":"GROUP BY 문법","prompt":"다음 SQL 중 실행 시 오류가 발생하는 것을 고르시오.","explanation":"GROUP BY를 사용하면 SELECT 절에는 GROUP BY 컬럼 또는 집계 함수만 올 수 있다. emp_nm은 그룹마다 값이 여러 개일 수 있어 오류가 발생한다(표준 SQL, Oracle 기준).","choices":["SELECT dept_id, MAX(salary) FROM EMP GROUP BY dept_id HAVING MAX(salary) > 300;","SELECT dept_id, COUNT(*) FROM EMP GROUP BY dept_id;","SELECT dept_id, SUM(salary) FROM EMP WHERE salary IS NOT NULL GROUP BY dept_id;","SELECT dept_id, emp_nm, COUNT(*) FROM EMP GROUP BY dept_id;","SELECT COUNT(*) FROM EMP;"],"answer":[4],"id":"SQ-015"},{"category":"SQL","type":"mcq","difficulty":"중","title":"EXISTS와 IN","prompt":"'직원이 1명 이상 소속된 부서'의 부서명을 조회하는 SQL로 옳지 않은 것을 고르시오.","explanation":"NOT EXISTS는 소속 직원이 '없는' 부서를 조회한다. 나머지는 모두 직원이 있는 부서(개발, 운영)를 반환한다.","choices":["SELECT d.dept_nm FROM DEPT d WHERE EXISTS (SELECT 1 FROM EMP e WHERE e.dept_id = d.dept_id);","SELECT d.dept_nm FROM DEPT d WHERE d.dept_id IN (SELECT e.dept_id FROM EMP e);","SELECT d.dept_nm FROM DEPT d WHERE NOT EXISTS (SELECT 1 FROM EMP e WHERE e.dept_id = d.dept_id);","SELECT DISTINCT d.dept_nm FROM DEPT d JOIN EMP e ON e.dept_id = d.dept_id;","SELECT d.dept_nm FROM DEPT d WHERE (SELECT COUNT(*) FROM EMP e WHERE e.dept_id = d.dept_id) >= 1;"],"answer":[3],"id":"SQ-016"},{"category":"SQL","type":"short","difficulty":"하","title":"패턴 검색","prompt":"다음 [회원] 테이블에서 아래 SQL의 실행 결과 ⓐ를 작성하시오.","explanation":"'_'는 정확히 한 글자를 의미하므로 '김_'은 '김'으로 시작하는 두 글자 이름이다. 김구, 김란이 해당하여 2건이다. 김하늘(3글자), 김(1글자)은 제외된다.","context":"[회원] MBR\n| mbr_nm |\n| 김구 |\n| 김하늘 |\n| 이김 |\n| 김란 |\n| 김 |\n\n```sql\nSELECT COUNT(*) FROM MBR WHERE mbr_nm LIKE '김_';\n```","blanks":[{"label":"ⓐ","answers":["2","2건","2명"]}],"id":"SQ-017"},{"category":"SQL","type":"mcq","difficulty":"중","title":"CASE 표현식","prompt":"다음 [주문] 테이블에 아래 SQL을 실행한 결과로 옳은 것을 고르시오.","explanation":"CASE는 위에서부터 처음 만족하는 조건의 값을 반환한다. 120 → 대량, 50·99 → 일반(50 이상), 10 → 소량. 따라서 대량 1, 일반 2, 소량 1.","context":"[주문] ORD\n| ord_no | qty |\n| 1 | 120 |\n| 2 | 50 |\n| 3 | 99 |\n| 4 | 10 |\n\n```sql\nSELECT CASE WHEN qty >= 100 THEN '대량'\n            WHEN qty >= 50  THEN '일반'\n            ELSE '소량' END AS grp,\n       COUNT(*)\n  FROM ORD\n GROUP BY CASE WHEN qty >= 100 THEN '대량'\n               WHEN qty >= 50  THEN '일반'\n               ELSE '소량' END;\n```","choices":["대량 2, 소량 2","대량 1, 일반 3","대량 1, 일반 2, 소량 1","대량 2, 일반 1, 소량 1","대량 1, 일반 1, 소량 2"],"answer":[3],"id":"SQ-018"},{"category":"SQL","type":"mcq","difficulty":"중","title":"3개 테이블 조인","prompt":"다음 테이블 데이터를 참조하여 아래 SQL의 실행 결과 행 수를 고르시오.","explanation":"주문상품 4행 중 상품 테이블에 존재하는 상품(P1, P2)을 가진 행만 INNER JOIN 결과에 남는다. (O1, P1), (O1, P2), (O2, P1) 3행이며 P9는 상품 테이블에 없어 제외된다.","context":"[주문] ORD\n| ord_no | cust_id |\n| O1 | C1 |\n| O2 | C2 |\n\n[주문상품] ORD_ITEM\n| ord_no | prd_cd | qty |\n| O1 | P1 | 1 |\n| O1 | P2 | 2 |\n| O2 | P1 | 1 |\n| O2 | P9 | 3 |\n\n[상품] PRD\n| prd_cd | prd_nm |\n| P1 | 수분크림 |\n| P2 | 선크림 |\n\n```sql\nSELECT o.ord_no, p.prd_nm, i.qty\n  FROM ORD o\n  JOIN ORD_ITEM i ON o.ord_no = i.ord_no\n  JOIN PRD p      ON i.prd_cd = p.prd_cd;\n```","choices":["2","3","4","5","1"],"answer":[2],"id":"SQ-019"},{"category":"SQL","type":"short","difficulty":"중","title":"UPDATE 결과 예측","prompt":"다음 [상품] 테이블에 아래 UPDATE를 실행한 후, 상품 P3의 price 값 ⓐ를 작성하시오.","explanation":"WHERE 조건(category = 'B')을 만족하는 P2, P3만 10% 인상된다. P3은 10000 × 1.1 = 11000.","context":"[상품] PRD\n| prd_cd | category | price |\n| P1 | A | 20000 |\n| P2 | B | 5000 |\n| P3 | B | 10000 |\n\n```sql\nUPDATE PRD\n   SET price = price * 1.1\n WHERE category = 'B';\n```","blanks":[{"label":"ⓐ","answers":["11000","11,000"]}],"id":"SQ-020"},{"category":"SQL","type":"mcq","difficulty":"하","title":"인덱스 생성 구문","prompt":"[주문] 테이블의 (고객번호, 주문일자) 컬럼에 결합 인덱스를 생성하는 SQL로 옳은 것을 고르시오.","explanation":"인덱스 생성 구문은 CREATE INDEX 인덱스명 ON 테이블명 (컬럼1, 컬럼2 …)이다.","choices":["ALTER INDEX IX_ORD_01 ADD ORD (CUST_NO, ORD_DT);","CREATE INDEX ORD (CUST_NO, ORD_DT) AS IX_ORD_01;","CREATE TABLE IX_ORD_01 INDEX ON ORD (CUST_NO, ORD_DT);","CREATE INDEX IX_ORD_01 ON ORD (CUST_NO, ORD_DT);","INSERT INDEX IX_ORD_01 INTO ORD (CUST_NO, ORD_DT);"],"answer":[4],"id":"SQ-021"},{"category":"SQL","type":"mcq","difficulty":"중","title":"DISTINCT와 집계","prompt":"다음 [방문] 테이블에 아래 SQL을 실행한 결과를 고르시오.","explanation":"COUNT(DISTINCT mbr_id)는 중복을 제거한 회원 수를 센다. M1, M2, M3 → 3.","context":"[방문] VISIT\n| visit_dt | mbr_id |\n| 2025-03-01 | M1 |\n| 2025-03-01 | M2 |\n| 2025-03-02 | M1 |\n| 2025-03-02 | M3 |\n| 2025-03-03 | M1 |\n| 2025-03-03 | M2 |\n\n```sql\nSELECT COUNT(DISTINCT mbr_id) FROM VISIT;\n```","choices":["3","5","6","4","2"],"answer":[1],"id":"SQ-022"},{"category":"SQL","type":"mcq","difficulty":"상","title":"윈도우 함수를 이용한 누적합","prompt":"다음 [일매출] 테이블에 아래 SQL을 실행했을 때, 2025-03-03 행의 cum 값을 고르시오.","explanation":"SUM() OVER (ORDER BY sale_dt)는 정렬 순서대로 현재 행까지의 누적합을 구한다. 100 + 200 + 300 = 600.","context":"[일매출] DAILY_SALES\n| sale_dt | amt |\n| 2025-03-01 | 100 |\n| 2025-03-02 | 200 |\n| 2025-03-03 | 300 |\n| 2025-03-04 | 400 |\n\n```sql\nSELECT sale_dt,\n       SUM(amt) OVER (ORDER BY sale_dt) AS cum\n  FROM DAILY_SALES;\n```","choices":["600","300","450","1000","150"],"answer":[1],"id":"SQ-023"},{"category":"SQL","type":"essay","difficulty":"중","title":"조인과 집계 SQL 작성","prompt":"[직원], [부서] 테이블을 이용하여 '소속 직원이 2명 이상인 부서'의 부서명과 직원 수를 조회하는 SQL을 작성하시오. (결과는 직원 수 내림차순)","explanation":"INNER JOIN, GROUP BY, HAVING COUNT(*) >= 2, ORDER BY … DESC가 포함되면 정답(별칭·대소문자 무관).","context":"[직원] EMP\n| emp_id | emp_nm | dept_id | salary |\n| E1 | 김하늘 | 10 | 300 |\n| E2 | 이바다 | 10 | 400 |\n| E3 | 박나무 | 20 | 500 |\n| E4 | 최구름 | NULL | NULL |\n| E5 | 정바람 | 40 | 600 |\n\n[부서] DEPT\n| dept_id | dept_nm |\n| 10 | 개발 |\n| 20 | 운영 |\n| 30 | 품질 |","answer_text":"SELECT d.dept_nm, COUNT(*) AS emp_cnt\n  FROM DEPT d\n  JOIN EMP e ON e.dept_id = d.dept_id\n GROUP BY d.dept_nm\nHAVING COUNT(*) >= 2\n ORDER BY emp_cnt DESC;\n\n실행 결과: (개발, 2)\n핵심: 조인 → GROUP BY → 그룹 조건은 WHERE가 아닌 HAVING → ORDER BY","id":"SQ-024"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"LLM 답변 신뢰성 확보","prompt":"사내 규정 문의 챗봇에 LLM을 적용했더니, 학습되지 않은 최신 사내 규정에 대해 그럴듯하지만 사실과 다른 답변을 생성하는 문제가 발생했다. 이를 줄이기 위한 방법으로 가장 적절한 것을 고르시오.","explanation":"환각(Hallucination)을 줄이려면 검색 증강 생성(RAG)으로 신뢰할 수 있는 근거 문서를 제공하고, 근거가 없으면 '모른다'고 답하게 하며, 출처를 함께 제시하도록 하는 것이 효과적이다.","choices":["답변 길이를 최대한 늘리도록 지시하여 더 많은 정보를 포함시키면, 사실과 다른 내용의 비중이 자연스럽게 줄어든다.","모델의 temperature를 최대로 높여 다양한 표현의 답변을 생성하게 하면, 그중 사실에 가까운 답변이 나올 확률이 높아진다.","사용자 질문을 가공 없이 그대로 모델에 전달하고, 모델 출력은 별도 검토 없이 바로 사용자에게 제공한다.","모델이 항상 확신에 찬 어조로 답하도록 프롬프트를 작성하여, 사용자가 답변을 더 신뢰하고 활용할 수 있게 한다.","질문과 관련된 최신 규정 문서를 검색하여 프롬프트에 근거로 함께 제공하고, 근거 내에서만 답하도록 하는 RAG를 적용한다."],"answer":[5],"id":"AX-001"},{"category":"AX역량","type":"short","difficulty":"하","title":"프롬프트 엔지니어링 기법","prompt":"LLM에 분류 작업을 시킬 때, 지시문만 주는 대신 '입력 → 기대 출력' 예시를 2~3개 프롬프트에 함께 넣어 원하는 형식과 기준을 학습시키는 기법을 ⓐ에 작성하시오.","explanation":"예시 몇 개를 함께 제공하는 것을 Few-shot 프롬프팅이라 한다. 예시 없이 지시만 주는 것은 Zero-shot이다.","blanks":[{"label":"ⓐ","answers":["FewShot","Few-shot","퓨샷","few-shotprompting","fewshotprompting","퓨샷프롬프팅","퓨 샷","few shot"]}],"id":"AX-002"},{"category":"AX역량","type":"mcq","difficulty":"중","title":"상황별 모델 선택","prompt":"다음 중 LLM 모델 선택이 가장 적절한 것을 고르시오.","explanation":"모델은 작업 난이도, 정확도 요구, 비용, 지연 시간을 함께 고려해 선택한다. 대량·단순 작업에는 경량 모델, 복잡한 추론·설계 검토에는 고성능 모델이 적합하다.","choices":["하루 수백만 건의 고객 문의를 10개 카테고리로 단순 분류하며 비용과 응답 속도가 중요하다. – 빠르고 저렴한 경량 모델을 사용하고, 정확도를 샘플링으로 검증한다.","하루 수백만 건의 단순 문의 분류라도 정확도가 가장 중요하다. – 비용·속도와 관계없이 항상 최상위 대형 모델만 사용한다.","업무 특성이 바뀌어 요구 정확도와 처리량이 달라졌다. – 일관성을 위해 한 번 선택한 모델은 바꾸지 않고 계속 사용한다.","신규 업무에 적용할 모델을 고른다. – 모델 크기·비용·응답 속도는 서로 관련이 없으므로 출시 시점이 가장 최근인지만 확인한다.","여러 시스템 간 복잡한 아키텍처 설계를 검토해야 한다. – 비용 절감을 위해 가장 작은 경량 모델로 처리하고 결과는 그대로 사용한다."],"answer":[1],"id":"AX-003"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"AI 생성 코드의 활용","prompt":"AI 코딩 도구로 생성한 코드를 업무에 활용하는 방법으로 옳지 않은 것을 고르시오.","explanation":"AI 생성 코드도 오류·보안 취약점·컨벤션 위반이 있을 수 있으므로 리뷰와 테스트를 거쳐야 한다.","choices":["팀의 코딩 컨벤션과 아키텍처 규칙에 맞는지 확인한다.","AI가 생성한 코드는 이미 검증된 것이므로 테스트 없이 바로 운영에 반영한다.","단위 테스트를 작성·실행하여 동작을 검증한다.","라이선스·보안 취약점(하드코딩된 비밀번호, SQL 인젝션 등)을 점검한다.","생성된 코드를 코드 리뷰 절차에 포함하여 사람이 검토한다."],"answer":[2],"id":"AX-004"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"생성형 AI 사용 시 보안","prompt":"외부 생성형 AI 서비스를 업무에 사용할 때의 보안 수칙으로 가장 적절한 것을 고르시오.","explanation":"외부 AI 서비스에 입력한 데이터는 저장·학습에 활용되거나 유출될 수 있다. 민감 정보는 입력하지 않거나 마스킹하고, 회사가 승인한 도구와 정책을 따라야 한다.","choices":["운영 DB 접속 계정과 비밀번호를 함께 붙여 넣어야 AI가 실제 환경을 이해하여 더 정확한 SQL을 생성할 수 있다.","고객 개인정보는 이름이나 전화번호 중 일부만 잘라서 입력하면, 외부 AI 서비스에 입력해도 보안상 문제가 되지 않는다.","AI 서비스의 데이터 보관·학습 약관과 관계없이, 업무 효율을 위해 모든 사내 문서를 업로드하여 활용해도 된다.","고객 개인정보, 접속 비밀번호·API 키, 대외비 소스코드는 승인되지 않은 외부 AI 서비스에 입력하지 않는다.","보안 검토는 AI 답변을 받은 이후 결과물에 대해서만 하면 되며, 입력하는 내용은 별도로 확인하지 않아도 된다."],"answer":[4],"id":"AX-005"},{"category":"AX역량","type":"short","difficulty":"중","title":"개발 자동화 관행","prompt":"개발자들이 변경 사항을 공유 저장소의 메인 브랜치에 자주(하루 여러 번) 병합하고, 병합될 때마다 자동으로 빌드와 테스트를 실행하여 문제를 조기에 발견하는 개발 관행을 영문 약어 또는 우리말로 ⓐ에 작성하시오.","explanation":"CI(Continuous Integration, 지속적 통합)이다. 이후 배포까지 자동화하는 것을 CD(지속적 전달/배포)라 한다.","blanks":[{"label":"ⓐ","answers":["CI","지속적통합","ContinuousIntegration","지속적 통합","지속통합"]}],"id":"AX-006"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"Git 기반 협업","prompt":"Git 기반 협업 방식으로 옳지 않은 것을 고르시오.","explanation":"공유 브랜치에 강제 푸시하면 다른 사람의 커밋 이력이 사라질 수 있다. main 브랜치는 보호 규칙을 설정하고 리뷰를 거쳐 병합해야 한다.","choices":["Pull Request를 통해 코드 리뷰 후 병합한다.","다른 사람의 변경을 덮어쓰더라도 빠르게 반영하기 위해 공유 main 브랜치에 강제 푸시(force push)한다.","커밋 메시지는 변경 내용과 이유를 알 수 있도록 작성한다.","병합 전 CI의 빌드·테스트 결과를 확인한다.","기능 단위로 브랜치를 만들어 작업한다."],"answer":[2],"id":"AX-007"},{"category":"AX역량","type":"short","difficulty":"하","title":"Git 명령어","prompt":"원격 저장소(origin)의 최신 변경 사항을 가져와 현재 로컬 브랜치에 바로 병합하는 Git 명령어 ⓐ를 작성하시오. (git 명령 전체 또는 하위 명령만 작성)","explanation":"git pull은 git fetch(원격 변경 가져오기) + git merge(현재 브랜치에 병합)를 한 번에 수행한다.","blanks":[{"label":"ⓐ","answers":["git pull","pull","git pull origin","gitpullorigin main","git pull origin main"]}],"id":"AX-008"},{"category":"AX역량","type":"mcq","difficulty":"중","title":"AI를 활용한 테스트 자동화","prompt":"AI를 활용해 단위 테스트 코드를 자동 생성할 때의 올바른 활용 방법을 고르시오.","explanation":"구현 코드만으로 테스트를 생성하면 잘못된 구현을 그대로 '정답'으로 삼는 테스트가 만들어질 수 있다. 명세를 기준으로 케이스를 만들고, 기대값을 사람이 검증해야 한다.","choices":["테스트 코드는 운영 환경에 배포되지 않으므로 코드 리뷰 대상에서 제외하고, 생성된 그대로 저장소에 반영한다.","현재 구현 코드만 AI에 보여주고 테스트를 생성하게 한 뒤, 생성된 테스트가 모두 통과하면 구현이 올바르다고 판단한다.","테스트 커버리지 수치를 높이는 것이 목적이므로, 생성된 테스트의 기대값이 명세와 맞는지는 별도로 검증하지 않는다.","AI가 생성한 테스트 중 실패하는 것은 AI의 오류일 가능성이 높으므로, 원인을 확인하지 않고 바로 삭제한다.","요구사항과 함수 명세를 함께 제공하여 정상·경계·예외 케이스를 생성하게 하고, 생성된 기대값이 명세와 맞는지 사람이 확인한다."],"answer":[5],"id":"AX-009"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"LLM의 특성","prompt":"LLM(대규모 언어 모델)의 특성에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"LLM은 학습 시점 이후의 정보나 비공개 사내 정보를 알지 못한다. 최신·사내 정보는 RAG, 도구 호출 등으로 별도 제공해야 한다.","choices":["학습 이후에 발생한 최신 사건이나 사내 정보도 별도 제공 없이 항상 정확히 알고 있다.","한 번에 처리할 수 있는 입력·출력 길이(컨텍스트 윈도우)에 제한이 있다.","입력·출력 토큰 수에 따라 비용과 응답 시간이 달라진다.","같은 질문에도 설정(temperature 등)에 따라 다른 답변을 생성할 수 있다.","사실이 아닌 내용을 그럴듯하게 생성하는 환각이 발생할 수 있다."],"answer":[1],"id":"AX-010"},{"category":"AX역량","type":"mcq","difficulty":"중","title":"AI 기반 명세 추출과 검증","prompt":"레거시 소스코드를 AI에 분석시켜 API 명세서를 자동으로 추출하였다. 이후 수행할 활동으로 가장 적절한 것을 고르시오.","explanation":"AI가 추출한 명세(AI Driven Spec)는 누락·오해석이 있을 수 있으므로 실제 동작(코드·로그·테스트)과 대조해 검증해야 한다. 이후 코드 변경 시 명세도 함께 갱신한다.","choices":["명세를 추출한 이후에는 명세서가 원본 역할을 하므로, 레거시 소스코드는 더 이상 관리하지 않고 삭제한다.","추출된 명세와 실제 코드 동작이 다르면, 명세가 기준 문서이므로 원인 확인 없이 코드를 명세에 맞게 수정한다.","추출된 명세를 실제 코드, 호출 로그, 테스트 결과와 대조하여 누락·오류를 검증한 뒤 확정한다.","AI가 소스코드를 직접 분석하여 추출했으므로 정확도가 높다고 보고, 별도 검증 없이 대외 공개용 명세로 배포한다.","명세는 한 번 추출하면 충분하며, 이후 코드가 변경되더라도 명세서를 다시 갱신할 필요는 없다."],"answer":[3],"id":"AX-011"},{"category":"AX역량","type":"mcq","difficulty":"하","title":"계층 구조 설계","prompt":"Controller – Service – Repository 계층 구조로 백엔드를 설계할 때, 계층별 책임으로 옳지 않은 것을 고르시오.","explanation":"Controller에 SQL과 업무 로직을 섞으면 책임이 뒤섞여 재사용·테스트·변경이 어려워진다. 각 계층은 자신의 책임만 가져야 한다.","choices":["Repository(또는 Mapper)는 DB 접근(SQL 실행)을 담당한다.","Controller는 요청을 받아 입력값을 바인딩·기본 검증하고 Service를 호출한다.","Service는 업무 규칙과 트랜잭션 경계를 담당한다.","SQL을 Controller에 직접 작성하면 계층이 줄어 유지보수가 쉬워지므로 권장된다.","계층을 분리하면 각 계층을 독립적으로 테스트하고 재사용하기 쉬워진다."],"answer":[4],"id":"AX-012"}];

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newState(){ return { round:{no:1, order:shuffle(BANK.map(q=>q.id)), ans:{}}, history:[], stats:{} }; }
function order(){ return S.round.order.filter(id => BY_ID[id]); }
function rec(id){ return S.round.ans[id]; }
function isDone(id){ const r = rec(id); return !!r && r.correct !== undefined && r.correct !== null; }
function firstUndone(after){
  const o = order(); const start = after == null ? 0 : after + 1;
  for(let i=start;i<o.length;i++) if(!isDone(o[i])) return i;
  for(let i=0;i<start && i<o.length;i++) if(!isDone(o[i])) return i;
  return -1;
}

/* ---------- 채점 ---------- */
function norm(s){ return String(s||"").toLowerCase().replace(/[\s"'`,;.·]/g,"").replace(/원$/,""); }
function gradeShort(q, vals){
  const per = q.blanks.map((b,i) => b.answers.some(a => norm(a) === norm(vals[i])));
  return { per, correct: per.every(Boolean) };
}
function finish(id, correct){
  const r = S.round.ans[id]; r.correct = correct;
  const st = S.stats[id] || (S.stats[id] = {a:0, c:0});
  st.a++; if(correct) st.c++;
  save();
}

/* ---------- 렌더 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mark = s => s.replace(/([ⓐⓑⓒⓓⓔ])/g, '<span class="mk">$1</span>');
function rich(text){
  const lines = text.split("\n"); let out = ""; let i = 0;
  while(i < lines.length){
    const ln = lines[i];
    if(/^```/.test(ln.trim())){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())){ buf.push(lines[i]); i++; }
      i++; out += `<pre><code>${mark(esc(buf.join("\n")))}</code></pre>`; continue;
    }
    if(/^\s*\|/.test(ln)){
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); i++; }
      const [h, ...b] = rows;
      out += `<div class="tw"><table><thead><tr>${h.map(c=>`<th>${mark(esc(c))}</th>`).join("")}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${mark(esc(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(/^\[[^\]]+\]\s*$/.test(ln.trim())){ out += `<div class="lbl">${esc(ln.trim())}</div>`; i++; continue; }
    if(ln.trim() === ""){ out += `<div style="height:6px"></div>`; i++; continue; }
    out += `<div class="ln">${mark(esc(ln))}</div>`; i++;
  }
  return out;
}

function statusHtml(id){
  const r = rec(id);
  if(!r) return "";
  if(r.correct === true) return `<span class="status ok">정답</span>`;
  if(r.correct === false) return `<span class="status ng">오답</span>`;
  return `<span class="status wait">자가채점 대기</span>`;
}

function cardHtml(id, idx){
  const q = BY_ID[id]; const cat = CAT[q.category] || {c:"var(--muted)", s:q.category};
  const resume = (idx === resumeIdx) ? " resume" : "";
  return `<article class="card${resume}" id="q-${id}" data-id="${id}">
    <div class="card-top">
      <span class="qno">문제 ${idx+1}</span>
      <span class="chip cat" style="--c:${cat.c}">${esc(cat.s)}</span>
      <span class="chip">${TYPE[q.type]}</span>
      <span class="chip">난이도 ${esc(q.difficulty)}</span>
      ${statusHtml(id)}
    </div>
    <div class="card-body">
      <div class="qtitle">문제제목 <b>${esc(q.title)}</b></div>
      <div class="prompt">${mark(esc(q.prompt))}</div>
      ${q.context ? `<div class="ctx">${rich(q.context)}</div>` : ""}
      ${q.type === "mcq" ? mcqHtml(q) : q.type === "short" ? shortHtml(q) : essayHtml(q)}
    </div>
  </article>`;
}

function mcqHtml(q){
  const r = rec(q.id); const graded = r && r.correct !== undefined;
  const multi = q.answer.length > 1;
  const sel = graded ? r.sel : (drafts[q.id] || []);
  const btns = q.choices.map((c, i) => {
    const n = i + 1; let cls = "choice";
    if(graded){
      if(q.answer.includes(n)) cls += " right";
      else if(sel.includes(n)) cls += " wrong";
    } else if(sel.includes(n)) cls += " sel";
    return `<button type="button" class="${cls}" data-act="pick" data-n="${n}" ${graded?"disabled":""}><span class="n">${NUMS[i]}</span><span class="t">${mark(esc(c))}</span></button>`;
  }).join("");
  const hint = multi && !graded ? `<div class="multi-hint">정답 ${q.answer.length}개를 모두 고르면 채점됩니다 (${sel.length}/${q.answer.length})</div>` : "";
  return `${hint}<div class="choices">${btns}</div>${graded ? resultHtml(q, r) : ""}`;
}

function shortHtml(q){
  const r = rec(q.id); const graded = r && r.correct !== undefined;
  const vals = graded ? r.vals : (drafts[q.id] || q.blanks.map(()=>""));
  const rows = q.blanks.map((b, i) => {
    const cls = graded ? (r.per[i] ? " ok" : " ng") : "";
    return `<div class="brow">${b.label ? `<span class="bl">${esc(b.label)}</span>` : ""}<input class="blank${cls}" data-i="${i}" value="${esc(vals[i])}" ${graded?"disabled":""} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답 입력" enterkeyhint="${i===q.blanks.length-1?"done":"next"}"></div>`;
  }).join("");
  const act = graded ? "" : `<div class="actions"><button type="button" class="btn primary" data-act="submit-short">채점</button></div>`;
  return `<div class="blanks">${rows}</div>${act}${graded ? resultHtml(q, r) : ""}`;
}

function essayHtml(q){
  const r = rec(q.id); const revealed = !!r;
  const text = revealed ? r.text : (drafts[q.id] || "");
  const ta = `<textarea data-essay placeholder="답안을 작성해 보세요 (작성하지 않고 바로 모범답안을 봐도 됩니다)" ${revealed?"disabled":""}>${esc(text)}</textarea>`;
  const act = revealed ? "" : `<div class="actions"><button type="button" class="btn primary" data-act="reveal">모범답안 보기</button></div>`;
  return `${ta}${act}${revealed ? resultHtml(q, r) : ""}`;
}

function resultHtml(q, r){
  const exp = q.explanation ? `<div class="exp">${mark(esc(q.explanation))}</div>` : "";
  if(q.type === "mcq"){
    const ans = q.answer.map(n => NUMS[n-1]).join(", ");
    return `<div class="result ${r.correct?"ok":"ng"}"><div class="head">${r.correct?"정답입니다":"오답입니다"} · 정답 ${ans}</div>${exp}</div>`;
  }
  if(q.type === "short"){
    const ans = q.blanks.map(b => `${b.label ? b.label+" " : ""}${b.answers[0]}`).join("\n");
    const override = (!r.correct && !r.overridden) ? `<div class="actions"><button type="button" class="btn small good" data-act="override">표기만 달라요 · 정답으로 인정</button></div>` : "";
    const note = r.overridden ? `<div class="muted" style="font-size:12.5px">직접 정답으로 인정한 문항입니다.</div>` : "";
    return `<div class="result ${r.correct?"ok":"ng"}"><div class="head">${r.correct?"정답입니다":"오답입니다"}</div><div class="ans">${mark(esc(ans))}</div>${exp}${note}${override}</div>`;
  }
  const self = r.correct === undefined || r.correct === null
    ? `<div class="actions"><span class="muted" style="font-size:13px">모범답안과 비교해 스스로 채점하세요</span><button type="button" class="btn small good" data-act="self" data-v="1">맞음</button><button type="button" class="btn small bad" data-act="self" data-v="0">틀림</button></div>`
    : `<div class="head" style="margin-top:6px">${r.correct ? "맞음으로 채점" : "틀림으로 채점"}</div>`;
  const cls = r.correct === true ? "ok" : r.correct === false ? "ng" : "neutral";
  return `<div class="result ${cls}"><div class="head">모범답안</div><div class="ans">${mark(esc(q.answer_text))}</div>${exp}${self}</div>`;
}

let resumeIdx = -1;
function render(){
  const o = order();
  resumeIdx = firstUndone();
  const app = document.getElementById("app");
  app.innerHTML = bannerHtml() + o.map((id, i) => cardHtml(id, i)).join("");
  updateHeader();
}
function rerenderCard(id){
  const el = document.getElementById("q-" + id); if(!el) return;
  const idx = order().indexOf(id);
  const prevResume = resumeIdx; resumeIdx = firstUndone();
  el.outerHTML = cardHtml(id, idx);
  if(prevResume !== resumeIdx){
    document.querySelectorAll(".card.resume").forEach(c => c.classList.remove("resume"));
    if(resumeIdx >= 0){ const n = document.getElementById("q-" + order()[resumeIdx]); n && n.classList.add("resume"); }
  }
  const b = document.getElementById("round-banner"); if(b) b.outerHTML = bannerHtml(); else if(roundDone()) document.getElementById("app").insertAdjacentHTML("afterbegin", bannerHtml());
  updateHeader();
}
function counts(){
  const o = order(); let done = 0, ok = 0;
  for(const id of o){ if(isDone(id)){ done++; if(rec(id).correct) ok++; } }
  return { total:o.length, done, ok };
}
function roundDone(){ const c = counts(); return c.total > 0 && c.done === c.total; }
function bannerHtml(){
  if(!roundDone()) return "";
  const c = counts(); const wrong = c.total - c.ok;
  const btn = wrong > 0
    ? `<button type="button" class="btn primary" data-act="next-round">오답 ${wrong}문제로 ${S.round.no + 1}라운드 시작</button>`
    : `<button type="button" class="btn primary" data-act="fresh">전체 ${BANK.length}문제 다시 풀기</button>`;
  const msg = wrong > 0 ? "틀린 문제만 모아 다음 라운드를 진행합니다. 오답이 0개가 될 때까지 반복해요." : "이번 라운드를 모두 맞혔습니다. 전체 마스터!";
  return `<section class="banner done" id="round-banner"><h2>${S.round.no}라운드 완료 · ${c.ok}/${c.total} 정답</h2><p>${msg}</p>${btn}</section>`;
}
function updateHeader(){
  const c = counts();
  document.getElementById("sub").textContent = `${S.round.no}라운드 · ${c.done}/${c.total} 풀이 · 정답 ${c.ok}`;
  document.getElementById("barfill").style.width = (c.total ? (c.done / c.total * 100) : 0) + "%";
  const fab = document.getElementById("fab");
  const idx = firstUndone();
  fab.hidden = idx < 0;
  if(idx >= 0) fab.textContent = `이어풀기 ↓ ${idx + 1}번`;
}

/* ---------- 이동 ---------- */
function goTo(idx, flash){
  const id = order()[idx]; const el = id && document.getElementById("q-" + id);
  if(!el) return;
  el.scrollIntoView({behavior: flash ? "smooth" : "auto", block:"start"});
  if(flash){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
function nextUndoneFromView(){
  // 현재 화면 위치 이후의 첫 미풀이 문제(없으면 처음부터)
  const o = order(); const top = 90;
  let cur = -1;
  for(let i=0;i<o.length;i++){ const el = document.getElementById("q-" + o[i]); if(el && el.getBoundingClientRect().top > top - 5){ cur = i - 1; break; } }
  for(let i=Math.max(cur,0);i<o.length;i++){
    const el = document.getElementById("q-" + o[i]);
    if(!isDone(o[i]) && el && el.getBoundingClientRect().top > top + 5) return i;
  }
  return firstUndone();
}

/* ---------- 이벤트(위임) ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if(!t) return;
  const act = t.dataset.act; const card = t.closest(".card"); const id = card && card.dataset.id; const q = id && BY_ID[id];
  if(act === "pick"){
    if(isDone(id)) return;
    const n = +t.dataset.n;
    if(q.answer.length === 1){
      S.round.ans[id] = { sel:[n] }; finish(id, q.answer[0] === n); rerenderCard(id);
    } else {
      let sel = drafts[id] || [];
      sel = sel.includes(n) ? sel.filter(x => x !== n) : sel.concat(n);
      drafts[id] = sel;
      if(sel.length === q.answer.length){
        const ok = sel.every(x => q.answer.includes(x));
        S.round.ans[id] = { sel: sel.slice().sort() }; delete drafts[id]; finish(id, ok);
      }
      rerenderCard(id);
    }
  }
  else if(act === "submit-short") submitShort(card);
  else if(act === "override"){
    const r = rec(id); const st = S.stats[id];
    r.correct = true; r.overridden = true; if(st) st.c++; save(); rerenderCard(id);
  }
  else if(act === "reveal"){
    const ta = card.querySelector("textarea"); S.round.ans[id] = { text: ta ? ta.value : "", correct: null }; delete drafts[id]; save(); rerenderCard(id);
  }
  else if(act === "self"){ finish(id, t.dataset.v === "1"); rerenderCard(id); }
  else if(act === "resume"){ const i = nextUndoneFromView(); if(i >= 0) goTo(i, true); }
  else if(act === "next-round"){
    const wrong = order().filter(x => !rec(x).correct);
    S.history.push({ no:S.round.no, total:order().length, ok:counts().ok, at:Date.now() });
    S.round = { no:S.round.no + 1, order:wrong, ans:{} }; save(); render(); window.scrollTo(0,0);
  }
  else if(act === "fresh"){
    S.history.push({ no:S.round.no, total:order().length, ok:counts().ok, at:Date.now() });
    S.round = { no:S.round.no + 1, order:shuffle(BANK.map(q=>q.id)), ans:{} }; save(); render(); window.scrollTo(0,0);
  }
  else if(act === "stats") openStats();
  else if(act === "map") openMap();
  else if(act === "close" || (act === "backdrop" && e.target === t)) closeModal();
  else if(act === "jump"){ closeModal(); goTo(+t.dataset.i, true); }
  else if(act === "reset-ask"){ t.outerHTML = `<button type="button" class="btn small bad" data-act="reset">정말 초기화 (되돌릴 수 없음)</button>`; }
  else if(act === "reset"){ S = newState(); save(); closeModal(); render(); window.scrollTo(0,0); }
});
document.addEventListener("input", e => {
  const card = e.target.closest(".card"); if(!card) return; const id = card.dataset.id;
  if(e.target.matches("input.blank")){
    const vals = drafts[id] || BY_ID[id].blanks.map(()=>""); vals[+e.target.dataset.i] = e.target.value; drafts[id] = vals;
  } else if(e.target.matches("textarea[data-essay]")) drafts[id] = e.target.value;
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || !e.target.matches("input.blank") || e.isComposing) return;
  e.preventDefault();
  const card = e.target.closest(".card"); const inputs = [...card.querySelectorAll("input.blank")];
  const i = inputs.indexOf(e.target);
  if(i < inputs.length - 1) inputs[i+1].focus(); else submitShort(card);
});
function submitShort(card){
  const id = card.dataset.id; const q = BY_ID[id]; if(isDone(id)) return;
  const vals = [...card.querySelectorAll("input.blank")].map(x => x.value);
  if(vals.every(v => !v.trim())){ card.querySelector("input.blank").focus(); return; }
  const g = gradeShort(q, vals);
  S.round.ans[id] = { vals, per:g.per }; delete drafts[id]; finish(id, g.correct); rerenderCard(id);
}

/* ---------- 모달 ---------- */
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
function modal(html){
  document.getElementById("modal-root").innerHTML = `<div class="modal-bg" data-act="backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
}
function openMap(){
  const o = order();
  const cells = o.map((id, i) => {
    const r = rec(id); const cls = !r ? "" : r.correct === true ? "ok" : r.correct === false ? "ng" : "wait";
    return `<button type="button" class="${cls}" data-act="jump" data-i="${i}">${i+1}</button>`;
  }).join("");
  modal(`<h3>${S.round.no}라운드 번호판</h3><p class="muted" style="font-size:13px;margin:0 0 10px">번호를 누르면 해당 문제로 이동합니다. 초록 정답 · 빨강 오답 · 노랑 자가채점 대기</p><div class="grid">${cells}</div><div class="actions" style="margin-top:14px"><button type="button" class="btn" data-act="close">닫기</button></div>`);
}
function openStats(){
  const c = counts();
  const byCat = {};
  for(const q of BANK){ const k = q.category; byCat[k] = byCat[k] || {n:0, a:0, c:0}; byCat[k].n++; const st = S.stats[q.id]; if(st){ byCat[k].a += st.a; byCat[k].c += st.c; } }
  const catRows = Object.keys(CAT).filter(k => byCat[k]).map(k => {
    const v = byCat[k]; const pct = v.a ? Math.round(v.c / v.a * 100) : 0;
    return `<div class="statrow" style="--c:${CAT[k].c}"><span class="k">${CAT[k].s} <span class="muted">(${v.n})</span></span><span class="track"><i style="width:${pct}%"></i></span><span class="v">${v.a ? pct + "%" : "-"} · ${v.c}/${v.a}</span></div>`;
  }).join("");
  const hist = S.history.length ? S.history.map(h => `<div class="statrow"><span class="k">${h.no}라운드</span><span class="track"><i style="width:${Math.round(h.ok/h.total*100)}%"></i></span><span class="v">${h.ok}/${h.total}</span></div>`).join("") : `<p class="muted" style="font-size:13px;margin:0">아직 완료한 라운드가 없습니다.</p>`;
  modal(`<h3>학습 통계</h3>
    <div class="statrow"><span class="k">현재 ${S.round.no}라운드</span><span class="track"><i style="width:${c.total? c.done/c.total*100:0}%"></i></span><span class="v">${c.done}/${c.total}</span></div>
    <p class="muted" style="font-size:13px;margin:4px 0 0">문제은행 ${BANK.length}문항 · 이번 라운드 정답 ${c.ok}</p>
    <h4>영역별 누적 정답률 (전체 시도 기준)</h4>${catRows}
    <h4>라운드 기록</h4>${hist}
    <h4>기기 안내</h4><p class="muted" style="font-size:13px;margin:0">진행 기록은 이 기기의 브라우저에만 저장됩니다.</p>
    <div class="actions" style="margin-top:16px"><button type="button" class="btn" data-act="close">닫기</button><span style="flex:1"></span><button type="button" class="btn small" data-act="reset-ask">진행 초기화</button></div>`);
}

/* ---------- 시작: 안 푼 문제로 이동 ---------- */
let userScrolled = false;
["wheel","touchstart","keydown"].forEach(ev => addEventListener(ev, () => { userScrolled = true; }, {once:true, passive:true}));
render();
const startIdx = firstUndone();
if(startIdx > 0){
  requestAnimationFrame(() => goTo(startIdx, false));
  // 웹폰트 로딩으로 레이아웃이 밀리면 한 번 더 맞춘다
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(!userScrolled) goTo(startIdx, false); });
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SW-SE 랩 2">
<title>SW-SE 마스터 랩 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f8; --surface:#fff; --surface-2:#eceef5; --text:#1b2030; --muted:#636b7c; --border:#dde1eb;
  --accent:#2f4fd1; --accent-weak:#e7ebfb; --accent-ink:#2440b4;
  --good:#1d8a5b; --good-weak:#e3f5eb; --bad:#c43c3c; --bad-weak:#fbe9e9; --warn:#a46b07; --warn-weak:#f8eedb;
  --dm:#0f8a82; --mp:#a46b07; --sd:#7a3fd6; --sq:#2f4fd1; --ax:#c23874;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101319; --surface:#181c25; --surface-2:#1f2431; --text:#e6e8ee; --muted:#8c94a4; --border:#2b3242;
    --accent:#7d93ff; --accent-weak:#1c2342; --accent-ink:#a8b7ff;
    --good:#47cf8c; --good-weak:#12352a; --bad:#ff7d72; --bad-weak:#3b1d1d; --warn:#e6ad45; --warn-weak:#352812;
    --dm:#43d6ca; --mp:#e6ad45; --sd:#b48cff; --sq:#7d93ff; --ax:#ff8fbd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#181c25; --surface-2:#1f2431; --text:#e6e8ee; --muted:#8c94a4; --border:#2b3242;
  --accent:#7d93ff; --accent-weak:#1c2342; --accent-ink:#a8b7ff;
  --good:#47cf8c; --good-weak:#12352a; --bad:#ff7d72; --bad-weak:#3b1d1d; --warn:#e6ad45; --warn-weak:#352812;
  --dm:#43d6ca; --mp:#e6ad45; --sd:#b48cff; --sq:#7d93ff; --ax:#ff8fbd;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
code,pre,.mono,input.blank,textarea{font-family:"IBM Plex Mono","SF Mono",Menlo,monospace}
button{font-family:inherit}

.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 16px calc(10px) 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topbar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand .name{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden;max-width:780px;margin-left:auto;margin-right:auto}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 13px;border-radius:10px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:780px;margin:0 auto;padding:18px 16px 120px}
.banner{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.banner.done{border-color:var(--accent);background:var(--accent-weak)}
.banner h2{margin:0 0 6px;font-size:17px}
.banner p{margin:0 0 10px;color:var(--muted);font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;scroll-margin-top:84px}
.card.resume{box-shadow:0 0 0 2px var(--accent)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 2px var(--accent)}}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.qno{font-weight:700;font-size:14px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface)}
.chip.cat{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.status{margin-left:auto;font-size:12.5px;font-weight:700}
.status.ok{color:var(--good)} .status.ng{color:var(--bad)} .status.wait{color:var(--warn)}
.card-body{padding:14px 16px 16px}
.qtitle{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.qtitle b{color:var(--text);font-weight:600}
.prompt{font-size:15.5px;font-weight:600;margin:2px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}

.ctx{border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:14px;font-size:14px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.ctx .lbl{font-weight:700;color:var(--accent-ink);margin:10px 0 4px}
.ctx .lbl:first-child{margin-top:0}
.ctx .ln{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ctx .tw{overflow-x:auto;margin:6px 0 8px;-webkit-overflow-scrolling:touch}
.ctx table{border-collapse:collapse;font-size:13px;min-width:100%}
.ctx th,.ctx td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top;word-break:keep-all}
.ctx th{background:var(--surface-2);font-weight:600;white-space:nowrap}
.ctx pre{margin:6px 0 8px;padding:10px 12px;background:var(--surface-2);border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.5;-webkit-overflow-scrolling:touch}
.mk{color:var(--bad);font-weight:700}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14.5px;line-height:1.55;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .n{flex:none;font-weight:700;color:var(--muted);min-width:1.3em}
.choice .t{word-break:keep-all;overflow-wrap:anywhere}
.choice.sel{border-color:var(--accent);background:var(--accent-weak)}
.choice.right{border-color:var(--good);background:var(--good-weak)}
.choice.wrong{border-color:var(--bad);background:var(--bad-weak)}
.choice:disabled{cursor:default}
.multi-hint{font-size:12.5px;color:var(--warn);font-weight:600;margin-bottom:6px}

.blanks{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:8px}
.brow .bl{flex:none;font-weight:700;min-width:1.6em;color:var(--bad)}
input.blank{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 11px;font-size:16px}
input.blank.ok{border-color:var(--good);background:var(--good-weak)}
input.blank.ng{border-color:var(--bad);background:var(--bad-weak)}
textarea{width:100%;min-height:120px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 11px;font-size:15px;line-height:1.55;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

.result{margin-top:12px;border-radius:10px;padding:12px 13px;font-size:14px;border:1px solid var(--border)}
.result.ok{background:var(--good-weak);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.result.ng{background:var(--bad-weak);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.result.neutral{background:var(--surface-2)}
.result .head{font-weight:700;margin-bottom:4px}
.result .ans{white-space:pre-wrap;font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto}
.result .exp{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}

.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:999px;padding:11px 18px;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom))}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h3{margin:0 0 12px;font-size:17px}
.modal h4{margin:16px 0 8px;font-size:14px;color:var(--muted)}
.statrow{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:6px 0}
.statrow .k{width:118px;flex:none}
.statrow .track{flex:1;height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.statrow .track i{display:block;height:100%;background:var(--c,var(--accent))}
.statrow .v{width:88px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:7px;padding:5px 0;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--good-weak);color:var(--good);border-color:transparent}
.grid button.ng{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.grid button.wait{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.muted{color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="name">SW-SE 마스터 랩 2</div>
      <div class="sub" id="sub">불러오는 중…</div>
    </div>
    <button class="btn small" data-act="map" type="button">번호판</button>
    <button class="btn small" data-act="stats" type="button">통계</button>
  </div>
  <div class="bar"><i id="barfill"></i></div>
</header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<button class="btn primary fab" id="fab" data-act="resume" type="button" hidden>이어풀기 ↓</button>
<div id="modal-root"></div>

<script>
const BANK = [{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"데이터 모델링 단계별 활동","prompt":"물리 데이터 모델링 단계에서 수행하는 활동으로 보기 어려운 것을 모두 고르시오. (2개)","explanation":"관계의 카디널리티·선택도 정의와 함수 종속성 기반 정규화는 DBMS와 무관하게 업무 관점에서 구조를 정의하는 논리 모델링 활동이다. 파티션·테이블스페이스, 인덱스, DBMS별 데이터 타입·길이 확정은 물리 모델링 활동이다.","choices":["대용량 테이블의 파티션 및 테이블스페이스 구성을 설계한다.","적용할 DBMS의 특성을 고려하여 컬럼의 데이터 타입과 길이를 확정한다.","속성 간 함수 종속성을 분석하여 엔터티를 분해(정규화)한다.","업무 규칙에 따라 엔터티 간 관계의 카디널리티와 선택도(Optionality)를 정의한다.","주요 조회 조건을 분석하여 인덱스를 설계한다."],"answer":[3,4],"id":"DM-001"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 모델링 단계의 이해","prompt":"데이터 모델링의 단계(개념 → 논리 → 물리)에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"반정규화와 인덱스는 데이터량·접근 패턴·DBMS 특성을 고려하는 물리 모델링 단계의 결정이다. 논리 모델 단계에서 DBMS와 무관하게 확정한다는 설명은 틀리다.","choices":["논리 모델링 단계에서 성능을 위한 반정규화와 인덱스를 확정하며, 이 결정은 DBMS 종류와 무관하게 그대로 적용된다.","업무 규칙이 변경되면 상위 단계 모델부터 반영하여 하위 모델과의 정합성을 유지하는 것이 바람직하다.","물리 모델링은 특정 DBMS의 특성을 반영하여 테이블·컬럼·인덱스 등 구현 구조를 정의한다.","개념 모델링은 핵심 엔터티와 그 관계를 중심으로 업무 전체를 포괄적으로 표현한다.","논리 모델링은 특정 DBMS에 독립적으로 식별자·속성·관계를 상세화하고 정규화를 수행한다."],"answer":[1],"id":"DM-002"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"엔터티 도출","prompt":"아래 [업무 설명]을 분석하여 엔터티를 도출하려고 한다. 엔터티로 도출하기에 가장 적절하지 않은 것을 고르시오.","explanation":"매장·상품·협력사·발주는 식별자로 구분되는 인스턴스 집합으로 업무에서 관리 대상이므로 엔터티이다. 발주수량은 발주 엔터티를 설명하는 값으로 속성에 해당한다.","context":"[업무 설명]\nC사의 각 매장은 본사에 상품을 발주한다. 발주할 때에는 발주일자와 상품별 발주수량을 기록한다.\n상품은 여러 협력사로부터 공급받으며, 협력사마다 공급단가가 다를 수 있다.\n본사는 매장별·협력사별 발주 현황을 월 단위로 집계하여 관리한다.","choices":["협력사","발주수량","매장","상품","발주"],"answer":[2],"id":"DM-003"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"엔터티의 조건","prompt":"엔터티(Entity)가 되기 위한 조건에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"엔터티는 원칙적으로 다른 엔터티와 최소 1개 이상의 관계를 가져야 한다(통계성·코드성·내부 처리용 엔터티 등은 예외적으로 관계가 생략될 수 있음). 관계 없이 단독으로 존재하는 것이 원칙이라는 설명은 틀리다.","choices":["엔터티를 설명하는 속성을 반드시 가져야 한다.","유일한 식별자에 의해 인스턴스를 식별할 수 있어야 한다.","업무에서 관리가 필요한 정보여야 한다.","영속적으로 존재하는 두 개 이상의 인스턴스 집합이어야 한다.","다른 엔터티와 관계를 갖지 않고 단독으로 존재하는 것이 원칙이다."],"answer":[5],"id":"DM-004"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"속성의 분류","prompt":"아래 [주문상품 속성 정의]의 분류 항목 ⓐ, ⓑ에 들어갈 속성 분류를 각각 작성하시오.","explanation":"다른 속성 값을 계산·가공하여 만들어지는 속성은 파생속성, 업무에 원래 존재하지 않지만 시스템 설계 과정에서 코드화·채번 등을 위해 새로 정의한 속성은 설계속성이다. 업무로부터 바로 도출되는 속성은 기본속성이다.","context":"[주문상품 속성 정의]\n| 속성명 | 설명 | 분류 |\n| 주문수량 | 고객이 주문 시 입력한 수량 | 기본속성 |\n| 주문금액 | 판매단가 × 주문수량으로 계산한 값 | ⓐ |\n| 주문상태코드 | '접수/배송중/완료' 상태를 시스템에서 관리하기 위해 코드로 새로 정의한 값 | ⓑ |","blanks":[{"label":"ⓐ","answers":["파생속성","파생","파생 속성","derived"]},{"label":"ⓑ","answers":["설계속성","설계","설계 속성"]}],"id":"DM-005"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"주식별자의 특성","prompt":"주식별자의 특성에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"주식별자의 4가지 특성은 유일성·최소성·불변성·존재성이다. 업무 편의나 성능을 위해 인조식별자(대리키)를 주식별자로 사용할 수 있으므로, 본질식별자로만 구성해야 한다는 설명은 틀리다.","choices":["존재성: 주식별자로 지정되면 반드시 값이 들어와야 하며 NULL이 허용되지 않는다.","유일성: 주식별자에 의해 엔터티 내의 모든 인스턴스를 유일하게 구분할 수 있어야 한다.","업무적 의미가 중요하므로, 주식별자는 반드시 업무에서 쓰이는 본질식별자(자연키)로만 구성해야 한다.","최소성: 주식별자를 구성하는 속성의 수는 유일성을 만족하는 최소의 수가 되어야 한다.","불변성: 주식별자가 한 번 지정되면 그 값은 변하지 않아야 한다."],"answer":[3],"id":"DM-006"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"주식별자 특성 판단","prompt":"C사는 [회원] 엔터티의 주식별자를 아래와 같이 정의하였다. 회원번호만으로도 모든 회원을 유일하게 구분할 수 있다고 할 때, 이 주식별자 정의가 위반한 주식별자의 특성 ⓐ를 작성하시오.","explanation":"회원번호만으로 유일성이 확보되는데 이메일을 추가로 포함시켰으므로, 유일성을 만족하는 최소한의 속성으로 구성해야 한다는 최소성을 위반한다.","context":"[회원]\n| 속성명 | 식별자 여부 |\n| 회원번호 | PK |\n| 이메일 | PK |\n| 회원명 | |\n| 가입일자 | |","blanks":[{"label":"ⓐ","answers":["최소성"]}],"id":"DM-007"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"식별관계와 비식별관계","prompt":"엔터티 간 관계에 대한 설명으로 가장 옳은 것을 고르시오.","explanation":"부모 없이 존재할 수 없고 부모의 식별자를 자신의 식별자에 포함하는 것은 식별관계이다. 소속이 바뀌는 사원을 식별관계로 하면 부서 변경 시 PK가 바뀌는 문제가 생긴다. 식별관계가 이어지면 하위 PK가 길어져 조인이 복잡해진다. 비식별관계에서도 부모 PK는 자식의 일반 속성(FK)으로 상속되며, 필수 관계로도 정의할 수 있다.","choices":["식별관계를 하위 엔터티로 계속 연결하면 하위 엔터티의 PK 속성 수가 줄어들어 SQL 조인 조건이 단순해진다.","비식별관계는 항상 자식 쪽에서 부모가 없어도 되는 선택(Optional) 관계로만 정의할 수 있다.","사원은 부서 이동이 잦지만 소속 부서는 항상 존재하므로, 부서와 사원은 부서코드를 사원의 PK에 포함하는 식별관계로 정의해야 한다.","주문상세는 주문 없이 존재할 수 없고 (주문번호, 순번)으로 식별되므로, 주문과 주문상세는 식별관계로 정의하는 것이 적절하다.","비식별관계에서는 부모 엔터티의 주식별자가 자식 엔터티에 상속되지 않는다."],"answer":[4],"id":"DM-008"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"관계의 카디널리티와 선택도","prompt":"아래 [업무 규칙]을 바탕으로 [강사]와 [강좌]의 관계를 정의하려고 한다. 가장 적절한 것을 고르시오.","explanation":"한 강사는 여러 강좌를 담당하고 각 강좌의 담당 강사는 1명이므로 1:M이다. 담당 강좌가 없는 강사도 등록할 수 있으므로 강사 쪽 참여는 선택, 강좌는 반드시 강사가 지정되어야 하므로 강좌 쪽 참여는 필수이다.","context":"[업무 규칙]\n• 강사는 여러 개의 강좌를 담당할 수 있다.\n• 신규 강사는 담당 강좌가 정해지지 않은 상태로도 먼저 등록할 수 있다.\n• 모든 강좌는 개설 시점에 반드시 1명의 담당 강사가 지정되어야 한다.","choices":["카디널리티는 강사:강좌 = 1:M이며, 모든 강사는 반드시 강좌를 담당해야 하므로 강사 입장에서는 필수, 강좌는 강사 없이도 개설될 수 있으므로 강좌 입장에서는 선택 관계이다.","한 강사가 여러 강좌를 담당하고 한 강좌도 여러 강사가 함께 담당할 수 있으므로 M:N 관계이며, 이를 해소하기 위한 교차 엔터티가 필요하다.","강좌마다 담당 강사가 1명이고 강사도 강좌를 하나만 담당하므로 1:1 관계이며, 두 엔터티 모두 상대가 반드시 존재해야 하는 필수 관계이다.","카디널리티는 강사:강좌 = 1:M이며, 강사는 강좌 없이 등록될 수 있고 강좌도 강사 없이 개설될 수 있으므로 양쪽 모두 선택 관계이다.","카디널리티는 강사:강좌 = 1:M이며, 강사는 담당 강좌가 없을 수 있으므로 강사 입장에서는 선택, 강좌는 반드시 담당 강사가 있어야 하므로 강좌 입장에서는 필수 관계이다."],"answer":[5],"id":"DM-009"},{"category":"데이터모델링","type":"essay","difficulty":"상","title":"도서 대출 데이터 모델링","prompt":"아래 [업무 규칙]을 기준으로 작성한 [논리 ERD]를 [답안 작성 기준]에 따라 해석하여 빈칸 ⓑ, ⓒ에 들어갈 관계를 각각 작성하시오.","explanation":"식별/비식별은 자식의 식별자에 부모 식별자가 포함되는지로, 선택도는 각 엔터티가 상대 없이 존재할 수 있는지로 판단한다.","context":"[업무 규칙]\n• 회원은 회원번호로 식별하며, 대출을 한 번도 하지 않은 회원도 있을 수 있고 여러 번 대출할 수도 있다.\n• 도서는 ISBN으로 식별한다. 도서관은 하나의 도서에 대해 여러 권의 사본을 보유하며, 사본은 해당 도서 정보 없이 존재할 수 없고 (ISBN, 사본순번)으로 식별한다.\n• 도서는 등록 시점에 최소 1권 이상의 사본과 함께 등록된다.\n• 대출은 대출번호로 식별되며, 한 건의 대출은 정확히 1권의 사본에 대한 것이다. 한 번도 대출되지 않은 사본도 있을 수 있다.\n\n[논리 ERD]\n```\n[회원]      ──ⓐ──  [대출]\n[도서]      ──ⓑ──  [도서사본]\n[도서사본]  ──ⓒ──  [대출]\n\n회원(회원번호 PK, 회원명, 연락처)\n도서(ISBN PK, 도서명, 저자)\n도서사본(ISBN PK·FK, 사본순번 PK, 입고일자)\n대출(대출번호 PK, 회원번호 FK, ISBN FK, 사본순번 FK, 대출일자, 반납예정일자)\n```\n\n[답안 작성 기준]\n| 식별관계/비식별관계 | 관계 카디널리티 | 관계선택도(Optionality) |\n| 식별관계 / 비식별관계 | 1:1, 1:M, M:1, M:N | 필수 / 선택 |\n\n예시) ⓐ: 회원과 대출은 비식별관계로 카디널리티는 1:M이며, 관계선택도는 필수:선택이다.","answer_text":"ⓑ (도서 – 도서사본): 식별관계, 카디널리티 1:M, 관계선택도 필수:필수\n  - 도서사본은 도서 없이 존재할 수 없고 (ISBN, 사본순번)으로 식별되므로 식별관계\n  - 하나의 도서는 여러 권의 사본을 가지므로 1:M\n  - 사본은 반드시 도서를 가지며(필수), 등록된 도서는 최소 1권 이상의 사본을 가지므로(필수) 필수:필수\nⓒ (도서사본 – 대출): 비식별관계, 카디널리티 1:M, 관계선택도 필수:선택\n  - 대출은 독립적인 대출번호로 식별되므로 비식별관계(사본의 PK는 대출의 일반 FK 속성)\n  - 하나의 사본은 시간에 따라 여러 번 대출될 수 있으므로 1:M\n  - 대출은 반드시 1권의 사본을 대상으로 하고(필수), 사본은 대출 이력이 없을 수 있으므로(선택) 필수:선택","id":"DM-010"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"다대다 관계의 해소","prompt":"논리 데이터 모델에서 [학생]과 [과목]의 M:N 관계를 해소하는 방법으로 가장 적절한 것을 고르시오.","explanation":"M:N 관계는 관계형 테이블에서 FK 하나로 표현할 수 없으므로 교차(연관) 엔터티를 두어 1:M 관계 두 개로 해소한다. 반복 속성이나 다중값 저장은 1차 정규형 위반이다.","choices":["논리 모델에서는 M:N을 그대로 두고, 물리 모델에서 FK 컬럼 하나로 구현한다.","[수강] 교차 엔터티를 생성하고 [학생]–[수강], [과목]–[수강]을 각각 1:M 관계로 연결한다.","[학생] 엔터티에 과목코드1 ~ 과목코드5 속성을 반복하여 추가한다.","[과목] 엔터티에 수강 학생의 학번 목록을 쉼표로 구분하여 하나의 속성에 저장한다.","[학생]과 [과목]을 하나의 엔터티로 통합하여 관계 자체를 없앤다."],"answer":[2],"id":"DM-011"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"계층 구조의 관계 표현","prompt":"아래 [카테고리] 엔터티에서 상위카테고리코드는 같은 [카테고리] 엔터티의 카테고리코드를 참조한다. 이처럼 하나의 엔터티가 자기 자신과 맺는 관계를 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"엔터티가 자기 자신을 참조하는 관계를 순환관계(재귀관계, 자기참조관계, Recursive Relationship)라 하며, 조직도·카테고리·메뉴처럼 계층 구조를 표현할 때 사용한다.","context":"[카테고리]\n| 속성명 | 키 |\n| 카테고리코드 | PK |\n| 카테고리명 | |\n| 단계구분코드 | |\n| 상위카테고리코드 | FK |","blanks":[{"label":"ⓐ","answers":["순환관계","순환","재귀관계","재귀","자기참조관계","자기참조","recursive","self-referencing","selfreferencing","순환참조"]}],"id":"DM-012"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"관계 유형 판별 Ⅰ","prompt":"아래 [업무 규칙]에서 [주문결제]와 [카드결제], [계좌이체] 사이의 관계를 표현하는 관계 유형으로 가장 적절한 것을 고르시오.","explanation":"하나의 주문결제가 여러 대상 중 정확히 하나와만 관계를 맺는 경우는 배타관계(Arc)로 표현한다. 병렬관계는 두 엔터티 사이에 의미가 다른 관계가 둘 이상 동시에 존재하는 경우이다.","context":"[업무 규칙]\n• 주문결제 1건은 카드결제 또는 계좌이체 중 정확히 한 가지 방식으로만 처리된다.\n• 하나의 주문결제가 카드결제와 계좌이체를 동시에 갖는 경우는 없다.","choices":["병렬관계","M:N 관계","배타관계(Arc)","순환관계","1:1 식별관계 2개(포괄 관계)"],"answer":[3],"id":"DM-013"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"정규형 판단 Ⅰ","prompt":"아래 [주문] 테이블에 대한 설명으로 가장 적절한 것을 고르시오.","explanation":"상품코드목록처럼 하나의 속성에 여러 값(다중값)이 저장되면 원자값 조건을 위반하여 제1정규형을 만족하지 않는다. 주문–주문상품으로 분리하여 상품별 한 행으로 저장해야 한다.","context":"[주문]\n| 주문번호(PK) | 주문일자 | 고객번호 | 상품코드목록 |\n| 1001 | 2025-03-02 | C01 | A01, B03, C07 |\n| 1002 | 2025-03-02 | C05 | B03 |\n| 1003 | 2025-03-03 | C01 | A01, C07 |","choices":["결정자인 고객번호가 후보키가 아니므로 BCNF를 위반하며, 제1 ~ 제3정규형은 모두 만족하고 있다.","주문번호 → 고객번호 → 상품코드목록의 이행 함수 종속이 있어 제3정규형을 위반하므로, 고객 엔터티를 분리해야 한다.","주문일자와 상품코드목록 사이에 다치 종속이 있어 제4정규형만 위반하며, 그 외 정규형은 모두 만족한다.","하나의 속성에 여러 값이 들어 있어 제1정규형을 위반하므로, 주문상품을 별도 엔터티로 분리해야 한다.","상품코드목록이 PK의 일부에만 종속되는 부분 함수 종속이 있어 제2정규형을 위반하므로, 상품 엔터티를 분리해야 한다."],"answer":[4],"id":"DM-014"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"함수 종속과 정규형","prompt":"아래 [수강] 테이블의 PK는 (학번, 과목코드)이다. 이 테이블에 존재하는 함수 종속의 유형 ⓐ와, 이를 제거하였을 때 만족하게 되는 정규형 ⓑ를 작성하시오.","explanation":"과목명·학점수는 PK 전체가 아닌 과목코드에만 종속되므로 부분 함수 종속이다. 이를 [과목] 테이블로 분리하면 제2정규형을 만족한다.","context":"[수강]\n| 학번(PK) | 과목코드(PK) | 성적 | 과목명 | 학점수 |\n| 2301 | DB101 | A | 데이터베이스 | 3 |\n| 2301 | SE201 | B+ | 소프트웨어공학 | 3 |\n| 2302 | DB101 | B | 데이터베이스 | 3 |\n\n[함수 종속]\n(학번, 과목코드) → 성적\n과목코드 → 과목명, 학점수","blanks":[{"label":"ⓐ","answers":["부분함수종속","부분종속","부분 함수 종속","부분적함수종속","부분적종속"]},{"label":"ⓑ","answers":["제2정규형","2정규형","2NF","제2 정규형","2차정규형","제2정규화"]}],"id":"DM-015"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"정규형 판단 Ⅱ","prompt":"아래 [사원] 테이블에 대한 정규화 관점의 설명으로 가장 옳은 것을 고르시오.","explanation":"PK가 단일 속성이라 부분 함수 종속은 없지만, 일반 속성인 부서코드가 부서명·부서위치를 결정하는 이행 함수 종속이 있어 제3정규형을 위반한다. 값이 반복되는 것 자체는 1NF 위반이 아니다.","context":"[사원]\n| 사원번호(PK) | 사원명 | 부서코드 | 부서명 | 부서위치 |\n| 1001 | 김하늘 | D10 | 개발팀 | 본관 5층 |\n| 1002 | 이바다 | D10 | 개발팀 | 본관 5층 |\n| 1003 | 박나무 | D20 | 운영팀 | 별관 2층 |","choices":["사원번호 → 부서코드 → 부서명·부서위치의 이행 함수 종속이 있어 제3정규형을 위반하므로, [부서] 테이블을 분리해야 한다.","PK가 단일 속성이므로 부분·이행 함수 종속이 생길 수 없어, BCNF까지 자동으로 만족한다.","같은 부서명이 여러 행에 반복 저장되어 원자값 조건을 위반하므로, 제1정규형을 만족하지 못한다.","부서명이 PK의 일부에만 종속되는 부분 함수 종속이 있어 제2정규형을 위반하므로, [부서] 테이블을 분리해야 한다.","조회 성능을 위해 의도적으로 반정규화된 구조이므로, 이상현상이 발생하더라도 그대로 유지해야 한다."],"answer":[1],"id":"DM-016"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"이상현상의 구분","prompt":"아래 [수강신청] 테이블(PK: 학번, 과목코드)에서 발생한 사례 ⓐ, ⓑ, ⓒ를 이상현상의 종류와 올바르게 연결한 것을 고르시오.","explanation":"필요한 정보를 PK 값이 없어 저장하지 못하는 것은 삽입 이상, 중복 데이터 중 일부만 수정되어 불일치가 생기는 것은 갱신 이상, 행 삭제 시 의도치 않은 정보까지 사라지는 것은 삭제 이상이다.","context":"[수강신청]\n| 학번(PK) | 과목코드(PK) | 과목명 | 강의실 | 담당강사 |\n\n[사례]\nⓐ 아직 수강생이 없는 신규 과목은 학번 값이 없어 과목 정보를 저장할 수 없다.\nⓑ 과목의 강의실이 바뀌어 여러 행 중 일부만 수정했더니, 같은 과목의 강의실 정보가 행마다 달라졌다.\nⓒ 어떤 과목의 유일한 수강생이 수강을 취소하여 해당 행을 지웠더니 과목의 담당강사 정보까지 사라졌다.","choices":["ⓐ 삭제 이상, ⓑ 갱신 이상, ⓒ 삽입 이상","ⓐ 삽입 이상, ⓑ 갱신 이상, ⓒ 삭제 이상","ⓐ 삽입 이상, ⓑ 삭제 이상, ⓒ 갱신 이상","ⓐ 갱신 이상, ⓑ 삽입 이상, ⓒ 삭제 이상","ⓐ 갱신 이상, ⓑ 삭제 이상, ⓒ 삽입 이상"],"answer":[2],"id":"DM-017"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"정규화의 특징","prompt":"정규화에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"정규화를 진행하면 테이블이 분해되어 테이블 수가 늘어나며, 조회 시 조인이 증가하여 조회 성능이 저하될 수 있다.","choices":["데이터 중복을 최소화하여 저장 공간을 효율적으로 사용할 수 있다.","삽입·갱신·삭제 시 발생하는 이상현상을 제거할 수 있다.","정규화 수준이 높아질수록 테이블 수가 줄어들어 조회 시 필요한 조인이 감소한다.","속성 간 함수 종속성을 분석하여 테이블을 분해하는 과정이다.","분해된 테이블을 다시 조인했을 때 원래 정보가 정확히 복원되도록 분해해야 한다."],"answer":[3],"id":"DM-018"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"정규형 판단 Ⅲ","prompt":"아래 [수강지도] 테이블은 각 교수가 한 과목만 담당한다는 규칙을 가진다. 이 테이블이 만족하지 못하는 가장 낮은 단계의 정규형을 고르시오.","explanation":"PK (학번, 과목) 외에 교수 → 과목 함수 종속이 있는데, 결정자인 교수는 후보키가 아니다. 이행·부분 종속은 없어 3NF는 만족하지만 '모든 결정자가 후보키여야 한다'는 BCNF는 만족하지 못한다. (학번, 교수)와 (교수, 과목)으로 분해한다.","context":"[수강지도]\n| 학번(PK) | 과목(PK) | 교수 |\n| 2301 | 데이터베이스 | 김교수 |\n| 2302 | 데이터베이스 | 이교수 |\n| 2301 | 자료구조 | 박교수 |\n\n[함수 종속]\n(학번, 과목) → 교수\n교수 → 과목","choices":["제1정규형","제2정규형","제3정규형","BCNF(보이스-코드 정규형)","제4정규형"],"answer":[4],"id":"DM-019"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"함수 종속 용어","prompt":"함수 종속 X → Y에서 X의 값에 따라 Y의 값이 유일하게 정해진다. 이때 X를 ⓐ, Y를 ⓑ라고 한다. ⓐ, ⓑ를 각각 작성하시오.","explanation":"X → Y에서 X는 결정자(Determinant), Y는 종속자(Dependent)이다.","blanks":[{"label":"ⓐ","answers":["결정자","determinant"]},{"label":"ⓑ","answers":["종속자","dependent","피결정자"]}],"id":"DM-020"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"정규형 판별","prompt":"아래 [상품] 테이블이 만족하는 가장 높은 단계의 정규형 ⓐ를 작성하시오. (제1정규형 ~ 제3정규형 중에서 판단)","explanation":"PK가 단일 속성이므로 부분 함수 종속이 없어 2NF를 만족한다. 그러나 상품코드 → 분류코드 → 분류명의 이행 함수 종속이 있어 3NF는 만족하지 못한다.","context":"[상품]\n| 상품코드(PK) | 상품명 | 분류코드 | 분류명 | 판매가 |\n| P001 | 수분크림 | C10 | 스킨케어 | 25000 |\n| P002 | 선크림 | C10 | 스킨케어 | 18000 |\n| P003 | 샴푸 | C20 | 헤어케어 | 12000 |","blanks":[{"label":"ⓐ","answers":["제2정규형","2정규형","2NF","제2 정규형","2차정규형"]}],"id":"DM-021"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"정규형 판단 Ⅳ","prompt":"아래 [교수활동] 테이블은 교수가 담당하는 과목과 교수의 연구 분야가 서로 독립적으로 관리된다. 이 테이블에 대한 설명으로 가장 적절한 것을 고르시오.","explanation":"서로 독립적인 두 다중값 속성이 하나의 테이블에 있으면 모든 조합을 저장해야 해서 중복과 이상현상이 생긴다. 이를 다치 종속이라 하며 분해하여 4NF를 만족시킨다. 모든 속성이 PK여도 이상현상은 발생할 수 있다.","context":"[교수활동] (PK: 교수번호, 담당과목, 연구분야)\n| 교수번호 | 담당과목 | 연구분야 |\n| P1 | 데이터베이스 | 빅데이터 |\n| P1 | 데이터베이스 | 보안 |\n| P1 | 운영체제 | 빅데이터 |\n| P1 | 운영체제 | 보안 |","choices":["교수번호 →→ 담당과목, 교수번호 →→ 연구분야의 다치 종속이 있어 제4정규형을 위반하므로, (교수번호, 담당과목)과 (교수번호, 연구분야)로 분해한다.","담당과목이 교수번호에만 종속되는 부분 함수 종속이 있어 제2정규형을 위반하므로, (교수번호, 담당과목)만 분리하면 된다.","모든 속성이 PK를 구성하므로 함수 종속이 존재하지 않으며, 어떤 삽입·삭제 이상현상도 발생하지 않는다.","세 속성이 서로 조인 종속 관계에 있으므로 제5정규형만 위반하며, 제4정규형까지는 만족한다.","교수번호 → 담당과목 → 연구분야의 이행 함수 종속이 있어 제3정규형을 위반하므로, (담당과목, 연구분야)를 분리한다."],"answer":[1],"id":"DM-022"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"함수 종속 검증","prompt":"아래 [프로젝트투입] 데이터를 기준으로 할 때, 성립하지 않는 함수 종속을 고르시오.","explanation":"프로젝트 P1에 대해 부서가 '개발'과 '운영' 두 값으로 나타나므로 프로젝트 → 부서는 성립하지 않는다. 나머지는 주어진 데이터에서 결정자 값이 같을 때 종속자 값도 항상 같다.","context":"[프로젝트투입]\n| 사번 | 프로젝트 | 부서 | 역할 |\n| 101 | P1 | 개발 | PM |\n| 101 | P2 | 개발 | 개발자 |\n| 102 | P1 | 운영 | 개발자 |\n| 103 | P2 | 개발 | PM |","choices":["(프로젝트, 역할) → 사번","(사번, 프로젝트) → 부서","사번 → 부서","(사번, 프로젝트) → 역할","프로젝트 → 부서"],"answer":[5],"id":"DM-023"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"분해의 원칙","prompt":"정규화로 분해된 테이블들을 자연 조인하면 분해 이전 테이블과 정확히 같은 행 집합이 복원되어야 하며, 원래 없던 가짜 행이 생겨서도 안 된다. 이러한 성질을 만족하는 분해를 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"분해 후 조인으로 원래 정보를 그대로 복원할 수 있는 분해를 무손실(Lossless) 분해라 한다. 정규화는 무손실 분해와 함수 종속성 보존을 목표로 한다.","blanks":[{"label":"ⓐ","answers":["무손실분해","무손실","무손실 분해","무손실조인분해","losslessjoin","lossless","losslessdecomposition","무손실조인"]}],"id":"DM-024"},{"category":"데이터모델링","type":"essay","difficulty":"상","title":"주문 데이터 정규화","prompt":"아래 [주문내역] 테이블(PK: 주문번호, 상품코드)을 제3정규형까지 정규화한 결과를 테이블명, PK, FK, 속성으로 작성하시오.","explanation":"부분 종속(2NF) → 이행 종속(3NF) 순서로 제거한다. 주문단가는 업무 요건에 따라 주문상품에 두는 것이 일반적이다.","context":"[주문내역]\n| 주문번호 | 주문일자 | 고객번호 | 고객명 | 고객등급 | 상품코드 | 상품명 | 판매단가 | 주문수량 |\n\n[함수 종속]\n주문번호 → 주문일자, 고객번호\n고객번호 → 고객명, 고객등급\n상품코드 → 상품명, 판매단가\n(주문번호, 상품코드) → 주문수량","answer_text":"• 고객(고객번호 PK, 고객명, 고객등급)\n• 상품(상품코드 PK, 상품명, 판매단가)\n• 주문(주문번호 PK, 주문일자, 고객번호 FK→고객)\n• 주문상품(주문번호 PK·FK→주문, 상품코드 PK·FK→상품, 주문수량, 주문단가)\n\n근거\n- 2NF: 주문일자·고객번호는 주문번호에만, 상품명·판매단가는 상품코드에만 부분 종속 → 주문, 상품으로 분리\n- 3NF: 주문번호 → 고객번호 → 고객명·고객등급 이행 종속 → 고객 분리\n- 주문 시점 가격을 보존해야 하면 주문단가는 주문상품에 별도로 둔다(판매단가 변경과 무관하게 이력 유지)","id":"DM-025"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"반정규화 검토 대상","prompt":"다음 중 반정규화를 검토하는 것이 가장 타당한 경우를 고르시오.","explanation":"반정규화는 조회 빈도가 높고 대량 조인·집계로 성능 문제가 명확하며, 실시간 정합성 요구가 상대적으로 낮을 때 검토한다. 갱신이 빈번하고 정합성이 핵심인 데이터는 정규화를 유지하며, 반정규화 전에는 인덱스·SQL 튜닝·뷰 등 다른 대안을 먼저 검토한다.","choices":["여러 지점이 동시에 실시간으로 갱신하는 재고 수량을 여러 테이블에 중복 보관하려는 경우","인덱스 조정, SQL 튜닝, 뷰 활용 등의 대안을 아직 전혀 검토하지 않은 상태에서 조회가 다소 느린 경우","입력·수정이 매우 빈번하고 데이터 정합성이 핵심인 회계 원장 시스템의 경우","경영 대시보드가 조회될 때마다 5개 테이블을 조인하여 수천만 건을 집계하며, 조회가 매우 빈번하고 데이터는 전일 기준이면 충분한 경우","데이터 건수가 수십 건에 불과하고 조회도 거의 발생하지 않는 코드 테이블의 경우"],"answer":[4],"id":"DM-026"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"반정규화 검토 절차","prompt":"반정규화를 적용하기 전에 먼저 검토해야 할 대안으로 보기 어려운 것을 고르시오.","explanation":"반정규화는 '대상 조사 → 다른 대안 검토(뷰, 클러스터링, 인덱스, 응용 프로그램 처리 등) → 반정규화 적용' 순서로 진행한다. 중복 컬럼 추가·테이블 통합은 반정규화 그 자체이므로 사전 대안이 아니다.","choices":["중복 컬럼을 추가하여 관련 테이블을 즉시 통합한다.","애플리케이션에서 캐시를 활용해 반복 조회를 줄인다.","인덱스를 조정하여 조회 성능을 개선한다.","클러스터링 또는 파티셔닝을 적용하여 대량 데이터 접근 성능을 높인다.","뷰(View)를 활용하여 복잡한 조인을 단순화한다."],"answer":[1],"id":"DM-027"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"반정규화 기법","prompt":"아래 [성능 개선 사례]의 ⓐ, ⓑ에 해당하는 반정규화 기법을 각각 작성하시오.","explanation":"자주 조인되는 다른 테이블의 컬럼을 중복 저장하는 것은 컬럼 중복(중복 컬럼 추가), 미리 집계한 결과를 별도로 저장하는 것은 통계(집계·요약) 테이블 추가에 해당한다.","context":"[성능 개선 사례]\n| 기법 | 적용 내용 |\n| ⓐ | 주문 목록 화면에서 매번 고객 테이블을 조인하지 않도록 [주문] 테이블에 고객명을 함께 저장 |\n| ⓑ | 월 매출 리포트 조회 시 매번 주문상세를 합산하지 않도록 월별 매출합계를 미리 계산해 별도 테이블로 저장 |\n| 수평분할 | 연도별로 주문 행을 나누어 별도 테이블로 저장 |","blanks":[{"label":"ⓐ","answers":["컬럼중복","중복컬럼","중복컬럼추가","컬럼중복화","컬럼 중복","중복 컬럼"]},{"label":"ⓑ","answers":["통계테이블","통계테이블추가","집계테이블","요약테이블","통계 테이블","집계 테이블","요약 테이블"]}],"id":"DM-028"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"성능 개선 방안 선택","prompt":"아래 [상황]에서 적용할 반정규화 기법으로 가장 적절한 것을 고르시오.","explanation":"일부 대용량 컬럼은 드물게, 나머지 컬럼은 빈번하게 조회되는 경우 컬럼 단위로 테이블을 나누는 수직분할이 적합하다. 목록 조회 시 읽는 블록 수가 크게 줄어든다.","context":"[상황]\n• [상품] 테이블에는 상품명·판매가·재고 등 기본 컬럼과 상세설명(CLOB), 상세이미지 URL 목록 등 대용량 컬럼이 함께 있다.\n• 상품 목록 화면은 상품명·판매가만 사용하며 초당 수백 회 조회된다.\n• 대용량 컬럼은 상품 상세 화면에서만 가끔 조회된다.","choices":["[상품]과 [상품상세]를 하나의 테이블로 병합","카테고리명을 [상품] 테이블에 중복 저장하는 컬럼 중복","상세 정보 컬럼을 별도 테이블로 분리하는 수직분할","판매수량 합계를 저장하는 파생 컬럼 추가","등록연도를 기준으로 행을 나누는 수평분할"],"answer":[3],"id":"DM-029"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"파생 컬럼의 정합성","prompt":"[주문] 테이블에 조회 성능을 위해 주문상세 금액을 합산한 총주문금액(파생 컬럼)을 추가하였다. 정합성 유지 방안으로 가장 적절하지 않은 것을 고르시오.","explanation":"파생 컬럼은 원천 데이터가 바뀌면 함께 갱신하지 않으면 값이 불일치하여 무결성이 깨진다. 트리거, 트랜잭션 내 동시 갱신, 배치 대사 등으로 정합성을 유지해야 한다.","choices":["주문상세가 변경될 때 트리거로 총주문금액을 함께 갱신한다.","주기적으로 배치를 수행하여 총주문금액과 주문상세 합계를 대사(검증)한다.","주문상세를 변경하는 애플리케이션 트랜잭션 안에서 총주문금액을 함께 갱신한다.","총주문금액 갱신 규칙을 개발 표준으로 문서화하여 모든 변경 경로에서 동일하게 적용한다.","총주문금액은 조회용 컬럼이므로 주문상세가 변경되어도 갱신하지 않아도 무결성에 영향이 없다."],"answer":[5],"id":"DM-030"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"정규화 수준의 선택","prompt":"다음 중 성능 저하를 감수하더라도 정규화된 모델을 유지하는 것이 가장 적절한 시스템을 고르시오.","explanation":"쓰기가 빈번하고 데이터 일관성이 핵심인 OLTP 시스템은 정규화를 유지하는 것이 적절하다. DW·로그 분석·검색 전용 DB·OLAP 마트는 조회 성능을 위해 반정규화를 적극 검토하는 영역이다.","choices":["원천 시스템에서 하루 1회 복제되어 검색에만 사용되는 상품 카탈로그 조회 DB","계좌 간 이체가 초당 수천 건 발생하며 잔액의 정확성이 무엇보다 중요한 은행 계정계 시스템","경영진이 월 1회 조회하는 전사 매출 데이터웨어하우스","대량의 웹 로그를 적재한 후 분석 쿼리만 수행하는 로그 분석 시스템","연간 통계 리포트 생성을 위한 다차원 분석(OLAP) 마트"],"answer":[2],"id":"DM-031"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"반정규화 기법 분류","prompt":"반정규화 기법 중 '테이블 추가' 유형에 해당하지 않는 것을 고르시오.","explanation":"테이블 추가 유형에는 중복·통계·이력·부분 테이블 추가가 있다. 파생 컬럼 추가는 컬럼 단위 반정규화이다.","choices":["중복 테이블 추가","통계 테이블 추가","이력 테이블 추가","부분 테이블 추가","파생 컬럼 추가"],"answer":[5],"id":"DM-032"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"반정규화 사례 분석","prompt":"아래 [상황]에서 적용한 반정규화 기법으로 가장 적절한 것을 고르시오.","explanation":"이미 다른 경로(결제→주문→고객)로 연결되어 있는 관계를 조인 경로 단축을 위해 직접 추가하는 것은 관계 반정규화인 '중복 관계 추가'이다. 컬럼 중복은 속성 값을 복사해 두는 것이다.","context":"[상황]\n• 기존 모델: [결제] →(FK)→ [주문] →(FK)→ [고객]\n• 결제 내역 화면에서 고객 정보를 확인하려면 항상 결제–주문–고객 3개 테이블을 조인해야 했다.\n• 이를 개선하기 위해 [결제] 테이블에 고객번호 FK를 추가하여 [고객]과 직접 관계를 맺도록 하였다.","choices":["수평 분할","테이블 병합","통계 테이블 추가","중복 관계 추가","컬럼 중복"],"answer":[4],"id":"DM-033"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"1:1 관계 테이블 병합","prompt":"1:1 관계에 있는 두 테이블의 병합을 검토하는 것이 가장 적절한 경우를 고르시오.","explanation":"항상 함께 조회되어 조인 비용이 반복되고 데이터도 거의 함께 존재한다면 병합이 효과적이다. 따로 조회되거나 보안·갱신 패턴·생명주기가 다르면 분리를 유지하는 것이 낫다.","choices":["두 테이블의 데이터를 관리하는 조직과 생명주기가 서로 다른 경우","한쪽 테이블에만 대용량 컬럼이 있고 두 테이블이 함께 조회되는 경우가 거의 없는 경우","한쪽 테이블은 갱신이 매우 잦고, 다른 쪽은 거의 변경되지 않으며 따로 조회되는 경우","두 테이블이 대부분의 업무에서 항상 함께 조회되고, 한쪽 테이블에 대응하는 데이터가 거의 항상 존재하는 경우","두 테이블의 데이터 보안 등급이 달라 접근 권한을 분리해야 하는 경우"],"answer":[4],"id":"DM-034"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"반정규화의 영향","prompt":"반정규화 적용 시 발생할 수 있는 영향으로 옳지 않은 것을 고르시오.","explanation":"반정규화는 조회 성능을 얻는 대신 무결성 유지 부담이 커지는 기법이다. 무결성이 자동으로 강화되는 효과는 없다.","choices":["정규화 모델보다 데이터 무결성이 DBMS에 의해 자동으로 더 강하게 보장된다.","중복 저장으로 저장 공간 사용량이 증가한다.","중복 데이터로 인해 정합성이 깨질 위험이 커진다.","중복 데이터를 함께 갱신해야 하므로 입력·수정·삭제 처리 비용이 늘어날 수 있다.","정합성 유지를 위한 트리거나 배치 등 추가 관리 요소가 생긴다."],"answer":[1],"id":"DM-035"},{"category":"데이터모델링","type":"essay","difficulty":"상","title":"주문 목록 조회 성능 개선","prompt":"아래 [상황]을 해결하기 위한 반정규화 방안을 1가지 제시하고, 그 방안 적용 시 데이터 정합성을 유지하기 위한 방법을 함께 서술하시오.","explanation":"반정규화 방안 + 정합성 확보 방법(트랜잭션/트리거/배치 대사)이 함께 제시되면 정답으로 본다.","context":"[상황]\n• 주문 목록 화면은 주문번호, 주문일자, 고객명, 대표상품명, 총주문금액을 20건씩 보여준다.\n• 현재는 조회 시마다 [주문]–[고객]–[주문상품]–[상품]을 조인하고 주문상품 금액을 합산한다.\n• 하루 수백만 건이 조회되어 DB 부하가 크며, 주문 데이터는 생성 이후 거의 변경되지 않는다.","answer_text":"방안(예시): [주문] 테이블에 고객명, 대표상품명(또는 상품명), 총주문금액 등 목록 화면에 필요한 컬럼을 중복(파생) 컬럼으로 추가하여 목록 조회 시 고객·주문상품·상품 조인과 합계 계산을 제거한다.\n  - 대안: 일 단위로 갱신되는 주문목록 요약(통계) 테이블을 추가할 수도 있음\n정합성 유지:\n  - 주문 생성/변경 트랜잭션 안에서 중복 컬럼을 함께 갱신(또는 트리거 적용)\n  - 고객명·상품명 변경 시 관련 주문 행을 갱신하는 처리 정의, 또는 '주문 당시 값'으로 업무 정의하여 변경 대상에서 제외\n  - 주기적 배치로 원천 테이블과 대사하여 불일치 검출·보정","id":"DM-036"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"논리 모델의 파생 속성","prompt":"논리 데이터 모델에서 파생 속성을 다루는 원칙으로 가장 적절한 것을 고르시오.","explanation":"파생 속성은 원천 데이터와 불일치 위험이 있으므로 논리 모델에서는 최소화하고, 물리 설계 시 성능 요구에 따라 반정규화로 추가 여부를 결정하는 것이 원칙이다.","choices":["파생 속성은 원천 속성과 독립적으로 관리되므로, 원천 데이터가 바뀌어도 정합성 문제가 발생하지 않는다.","논리 모델에서는 파생 속성을 최소화하고, 성능 요건이 확인되면 물리 모델에서 반정규화로 추가 여부를 결정한다.","파생 속성은 계산으로 값이 정해지므로, 엔터티의 주식별자(PK) 일부로 구성하는 것이 바람직하다.","파생 속성을 정의하면 해당 엔터티의 이행 함수 종속이 제거되어, 자동으로 제3정규형을 만족한다.","파생 속성은 조회 시 계산 비용을 줄여 주므로, 논리 모델 단계에서부터 가능한 한 많이 정의해 두는 것이 좋다."],"answer":[2],"id":"DM-037"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"슈퍼타입/서브타입 물리 변환 Ⅰ","prompt":"논리 모델에서 '회원'이라는 슈퍼타입이 '개인회원'과 '법인회원' 서브타입으로 나뉜다. 이를 물리 테이블로 변환하는 전략 중 아래 [조건]을 가장 잘 만족하는 것을 고르시오.","explanation":"서브타입을 함께 조회하는 경우가 대부분이고, 서브타입별 고유 속성이 적으며 데이터량도 많지 않으면 하나의 테이블로 통합(Roll-up)하는 것이 조인·UNION 없이 처리할 수 있어 유리하다.","context":"[조건]\n• 회원 목록·검색 화면은 개인회원과 법인회원을 구분하지 않고 함께 조회한다.\n• 서브타입별 고유 속성은 각각 2~3개에 불과하다.\n• 전체 회원 수는 수십만 건 수준으로 많지 않다.","choices":["개별 테이블로 변환(One-to-One Type): 슈퍼타입 테이블과 각 서브타입 테이블을 1:1 관계로 설계한다.","통합 테이블로 변환(Roll-up): 슈퍼타입 하나의 테이블에 공통·개별 속성을 모두 포함하고 구분코드로 식별한다.","서브타입별 테이블로 변환(Roll-down): 각 서브타입을 별도 테이블로 만들고 공통 속성을 각 테이블에 모두 포함한다.","이력 테이블로 변환: 모든 데이터를 하나의 통합 이력 테이블로 구성한다.","통합 뷰로 변환: 테이블은 만들지 않고 뷰(View)만으로 슈퍼타입/서브타입 관계를 표현한다."],"answer":[2],"id":"DM-038"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"슈퍼타입/서브타입 물리 변환 Ⅱ","prompt":"논리 모델에서 '상품'이라는 슈퍼타입이 '식품', '화장품', '의류' 서브타입으로 나뉜다. 이를 물리 테이블로 변환하는 전략 중 아래 [조건]을 가장 잘 만족하는 것을 고르시오.","explanation":"공통 속성 위주의 통합 처리가 많으면서 서브타입별 고유 속성도 많고 서브타입 단위 처리도 존재하는 경우, 슈퍼타입과 서브타입을 각각 테이블로 만들어 1:1로 연결하는 One-to-One 방식이 적합하다. 통합 조회는 슈퍼타입 테이블만으로, 고유 속성은 필요할 때만 조인한다.","context":"[조건]\n• 상품 검색·장바구니·주문 등 대부분의 업무는 상품명·판매가·재고 등 공통 속성만 사용하여 전체 상품을 통합 조회한다.\n• 각 서브타입은 유통기한·성분·사이즈 등 고유 속성을 10개 이상 가지며, 상품 상세 화면에서만 사용된다.\n• 하나의 테이블에 모두 넣으면 대부분의 컬럼이 NULL이 되는 문제가 있다.","choices":["개별 테이블로 변환(One-to-One Type): 슈퍼타입 테이블과 각 서브타입 테이블을 1:1 관계로 설계한다.","통합 테이블로 변환(Roll-up): 슈퍼타입 하나의 테이블에 공통·개별 속성을 모두 포함하고 구분코드로 식별한다.","서브타입별 테이블로 변환(Roll-down): 각 서브타입을 별도 테이블로 만들고 공통 속성을 각 테이블에 모두 포함한다.","이력 테이블로 변환: 모든 데이터를 하나의 통합 이력 테이블로 구성한다.","통합 뷰로 변환: 테이블은 만들지 않고 뷰(View)만으로 슈퍼타입/서브타입 관계를 표현한다."],"answer":[1],"id":"DM-039"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"슈퍼타입/서브타입 변환 방식","prompt":"슈퍼타입/서브타입을 물리 테이블로 변환하는 방식 중 아래 [설명]의 ⓐ, ⓑ에 해당하는 방식의 명칭을 각각 작성하시오.","explanation":"슈퍼타입 기준 하나의 테이블로 만드는 것은 Roll-up(Single type, 통합 테이블), 서브타입마다 공통 속성을 포함한 테이블을 만드는 것은 Roll-down(Plus type, 서브타입 테이블)이다. 슈퍼타입·서브타입을 모두 테이블로 만드는 것은 One-to-One(1:1 type)이다.","context":"[설명]\n| 방식 | 설명 |\n| ⓐ | 슈퍼타입과 모든 서브타입의 속성을 하나의 테이블로 통합하고, 구분 컬럼으로 서브타입을 식별한다. |\n| ⓑ | 서브타입마다 테이블을 만들고, 슈퍼타입의 공통 속성을 각 서브타입 테이블에 모두 포함한다. |\n| One-to-One | 슈퍼타입과 서브타입을 각각 테이블로 만들고 1:1 관계로 연결한다. |","blanks":[{"label":"ⓐ","answers":["rollup","roll-up","통합테이블","통합","singletype","single","단일테이블","슈퍼타입기준","롤업","allinone"]},{"label":"ⓑ","answers":["rolldown","roll-down","서브타입테이블","plustype","plus","서브타입기준","롤다운","서브타입별테이블","개별테이블"]}],"id":"DM-040"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"서브타입 정의","prompt":"아래 [업무 규칙]을 슈퍼타입/서브타입으로 모델링할 때 가장 적절한 설명을 고르시오.","explanation":"하나의 인스턴스가 여러 서브타입에 동시에 속할 수 있으면 포괄적(Inclusive) 서브타입이다. 하나에만 속해야 하면 배타적(Exclusive) 서브타입이다. 변환 방식은 배타성과 별개로 조회 패턴 등을 고려해 선택한다.","context":"[업무 규칙]\n• C사의 고객은 개인고객과 사업자고객으로 구분하여 관리한다.\n• 개인사업자는 개인고객이면서 동시에 사업자고객으로 등록될 수 있다.\n• 개인고객은 생년월일·본인인증정보를, 사업자고객은 사업자등록번호·대표자명을 추가로 관리한다.","choices":["한 고객은 반드시 하나의 서브타입에만 속하므로 배타적(Exclusive) 서브타입으로 정의한다.","서브타입이 2개뿐이므로 슈퍼타입 없이 두 엔터티를 각각 독립적으로 관리해야 한다.","동시에 속할 수 있는 경우에는 서브타입 대신 순환관계로 표현해야 한다.","포괄적 서브타입은 물리 모델에서 반드시 Roll-up으로만 변환할 수 있다.","한 고객이 두 서브타입에 동시에 속할 수 있으므로 포괄적(Inclusive, 중복 허용) 서브타입으로 정의한다."],"answer":[5],"id":"DM-041"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"통합 테이블 변환의 특징","prompt":"슈퍼타입/서브타입을 하나의 통합 테이블(Roll-up)로 변환했을 때의 특징으로 옳지 않은 것을 고르시오.","explanation":"통합 테이블에서는 다른 서브타입 행에서 고유 컬럼이 NULL이어야 하므로 고유 컬럼에 NOT NULL 제약을 걸기 어렵다. 서브타입별 필수 규칙은 CHECK 조건이나 애플리케이션에서 별도로 관리해야 한다.","choices":["테이블 하나로 관리하므로 테이블 수가 줄어 구조가 단순해진다.","해당 서브타입이 아닌 행에서는 서브타입 고유 컬럼이 NULL이 되어 NULL이 많아질 수 있다.","서브타입 고유 컬럼에도 NOT NULL 제약을 걸어 필수 입력을 DB 수준에서 쉽게 보장할 수 있다.","전체 데이터를 함께 조회할 때 조인이나 UNION이 필요 없다.","어떤 서브타입의 데이터인지 구분하기 위한 구분 컬럼이 필요하다."],"answer":[3],"id":"DM-042"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"서브타입별 테이블 변환의 특징","prompt":"슈퍼타입/서브타입을 서브타입별 개별 테이블(Roll-down)로 변환했을 때의 특징으로 옳지 않은 것을 고르시오.","explanation":"테이블이 분리되어 있으므로 서로 다른 테이블 간 PK 중복은 DB가 자동으로 막아주지 않는다. 공통 채번(시퀀스 공유) 등으로 별도 관리해야 한다.","choices":["서브타입별로 조회할 때 조인 없이 해당 테이블만 읽으면 된다.","서브타입별로 테이블스페이스·파티션 등을 독립적으로 관리하기 쉽다.","공통 속성이 변경되면 모든 서브타입 테이블을 함께 수정해야 한다.","모든 서브타입을 통합하여 조회하려면 UNION 처리가 필요하다.","서로 다른 서브타입 테이블 간에 PK 값이 중복되지 않는 것이 테이블 구조만으로 자동 보장된다."],"answer":[5],"id":"DM-043"},{"category":"데이터모델링","type":"essay","difficulty":"상","title":"보험계약 서브타입의 물리 설계","prompt":"아래 [보기]는 C사 보험계약에 대한 논리 데이터 모델이다. 계약구분코드에 따라 3개의 배타적 서브타입으로 설계되었다. 다음 물음에 답하시오.\n(1) 슈퍼타입/서브타입을 물리 테이블로 변환할 때의 판단 기준을 설명하시오.\n(2) 화면에서 세 서브타입을 구분하지 않고 통합 조회하는 업무가 대부분일 때, 물리 테이블을 몇 개로 설계해야 하는지 제시하고 그 이유를 설명하시오.","explanation":"변환 기준은 '트랜잭션(처리) 유형' 중심으로, 통합 조회가 많으면 하나의 테이블이 적합하다.","context":"[보기]\n```\n                [보험계약]\n                계약번호 (PK)\n                계약자명\n                계약일자\n                월보험료\n                계약구분코드\n                     │\n            ─────(X 배타)───── 계약구분코드\n           │         │         │\n   [자동차보험]   [화재보험]   [여행자보험]\n   계약번호(FK)   계약번호(FK)  계약번호(FK)\n   차량번호       건물주소      여행국가\n   운전자범위     건물구조      여행기간\n```","answer_text":"(1) 판단 기준: 업무에서 데이터를 처리(조회·입력)하는 단위와 데이터량, 서브타입 속성 수를 기준으로 결정한다.\n  - 슈퍼타입+서브타입 전체를 통합해서 처리하는 경우가 많으면 → 하나의 통합 테이블(Roll-up)\n  - 서브타입별로 독립적으로 처리하는 경우가 많으면 → 서브타입별 테이블(Roll-down)\n  - 공통 속성 위주 통합 처리와 서브타입 개별 처리가 모두 많으면 → 슈퍼타입/서브타입 각각 테이블(One-to-One)\n  - 그 외 데이터량(대용량이면 분리 유리), 서브타입 고유 속성 수(많으면 통합 시 NULL 증가)를 함께 고려\n(2) 1개의 테이블(통합 테이블, Roll-up)\n  - 이유: 통합 조회가 대부분이므로 하나의 테이블로 만들면 조인이나 UNION 없이 한 번에 조회할 수 있어 성능과 SQL 단순성이 유리하다. 서브타입은 계약구분코드로 구분한다.","id":"DM-044"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"결제 데이터 모델 해석","prompt":"다음은 공연 예매 시스템의 [예매·결제 데이터 모델]이다. 해당 모델에 대한 설명 중 옳지 않은 것을 모두 고르시오. (2개)","explanation":"포괄적 서브타입(카드+포인트 동시 사용 가능)이며 서브타입 PK가 결제번호(FK)이므로 같은 결제 건에서는 같은 값을 갖는다. 변환 방식은 조회 패턴 등에 따라 선택하며 서브타입 수로 강제되지 않는다. 서브타입은 슈퍼타입 없이 존재할 수 없다.","context":"[예매·결제 데이터 모델]\n```\n[공연예매] 예매번호(PK), 회원번호(FK), 공연회차번호(FK), 예매일시\n     │ 1 ─────────── 0..1\n[결제]     결제번호(PK), 예매번호(FK), 결제일시, 결제상태코드\n     │ (포괄적 서브타입: 카드와 포인트를 함께 사용할 수 있음)\n     ├─ [카드결제]    결제번호(PK, FK), 카드사코드, 승인번호, 카드결제금액\n     └─ [포인트결제]  결제번호(PK, FK), 사용포인트, 포인트결제금액\n```","choices":["서브타입이 2개이므로 물리 모델에서는 반드시 서브타입별 테이블(Roll-down)로만 변환해야 한다.","결제와 각 서브타입은 서브타입이 슈퍼타입의 PK를 상속하는 식별관계이다.","포인트결제는 결제 없이 단독으로 생성될 수 있다.","결제 1건에 대해 카드결제와 포인트결제가 동시에 존재할 수 있다.","같은 결제 건이라면 카드결제의 결제번호와 포인트결제의 결제번호는 같은 값을 가진다."],"answer":[1,3],"id":"DM-045"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"슈퍼타입/서브타입 도출 기준","prompt":"슈퍼타입/서브타입으로 모델링하는 것이 가장 적절한 경우를 고르시오.","explanation":"공통 부분과 유형별 고유 부분이 함께 존재할 때 슈퍼타입/서브타입으로 표현한다. 속성이 같고 값만 다르면 구분 코드(상태 코드) 속성으로 충분하다.","choices":["두 엔터티가 서로 여러 인스턴스와 관계를 맺는 M:N 관계를 해소해야 하는 경우","관리하는 속성은 모두 동일하고, 분류를 나타내는 코드 값의 종류만 여러 개로 나뉘는 경우","여러 유형이 공통 속성과 관계를 공유하면서, 일부 유형만 고유한 속성이나 관계를 갖는 경우","모든 유형의 속성과 관계가 완전히 같고, 처리 상태(접수/완료 등)를 나타내는 값만 서로 다른 경우","동일한 인스턴스의 속성 값이 시간에 따라 바뀌어, 변경 이력을 시점별로 관리해야 하는 경우"],"answer":[3],"id":"DM-046"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"One-to-One 변환의 키 구성","prompt":"슈퍼타입/서브타입을 One-to-One 방식으로 변환하면 서브타입 테이블의 PK는 슈퍼타입 테이블의 PK와 같은 컬럼으로 구성된다. 이때 서브타입 테이블의 PK 컬럼은 동시에 슈퍼타입 테이블을 참조하는 어떤 키(제약)의 역할을 하는지 ⓐ에 작성하시오.","explanation":"서브타입 PK는 슈퍼타입 PK를 그대로 받아 PK이면서 동시에 FK(외래키)가 된다(식별관계).","blanks":[{"label":"ⓐ","answers":["FK","외래키","외부키","foreignkey","참조키","외래 키"]}],"id":"DM-047"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"서브타입 관계 유형","prompt":"슈퍼타입 '계약'의 서브타입으로 '부동산계약'과 '임대차계약'이 있으며, 하나의 계약 인스턴스는 둘 중 정확히 하나의 서브타입에만 속한다. 이러한 서브타입 관계를 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"하나의 인스턴스가 하나의 서브타입에만 속하면 배타적(Exclusive) 관계, 동시에 여러 서브타입에 속할 수 있으면 포괄적(Inclusive) 관계이다.","blanks":[{"label":"ⓐ","answers":["배타적","배타","배타관계","배타적서브타입","exclusive","배타적관계"]}],"id":"DM-048"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"물리 컬럼 타입 정의","prompt":"아래 [표준 도메인], [논리 데이터 모델]을 참고하여 [물리 데이터 모델]의 ⓐ, ⓑ에 들어갈 데이터 타입을 각각 작성하시오.","explanation":"FK 컬럼은 참조하는 PK 컬럼과 같은 도메인(코드5 = VARCHAR2(5))을 사용하고, 주문일자는 일자 도메인(CHAR(8))을 사용해야 도메인 무결성과 조인 정합성이 보장된다.","context":"[표준 도메인]\n| 도메인명 | 데이터 타입 | 비고 |\n| 코드5 | VARCHAR2(5) | 영문/숫자 코드 |\n| 번호12 | VARCHAR2(12) | 채번 번호 |\n| 일자 | CHAR(8) | YYYYMMDD |\n| 명칭50 | VARCHAR2(50) | |\n\n[논리 데이터 모델]\n거래처(거래처코드[코드5], 거래처명[명칭50], 등록일자[일자])\n주문(주문번호[번호12], 거래처코드(FK), 주문일자[일자])\n\n[물리 데이터 모델] 주문 테이블\n| 컬럼명 | 데이터 타입 |\n| ORD_NO | VARCHAR2(12) |\n| VNDR_CD | ⓐ |\n| ORD_DT | ⓑ |","blanks":[{"label":"ⓐ","answers":["VARCHAR2(5)","varchar2(5)"]},{"label":"ⓑ","answers":["CHAR(8)","char(8)"]}],"id":"DM-049"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"무결성 제약의 종류","prompt":"다음 설명과 무결성 종류의 연결이 옳지 않은 것을 고르시오.","explanation":"주문수량 1 이상과 같은 값의 범위·업무 규칙은 도메인 무결성(또는 사용자 정의 무결성)에 해당한다. 개체 무결성은 PK의 NOT NULL·유일성에 관한 것이다.","choices":["PK 컬럼에는 NULL과 중복 값이 허용되지 않는다. – 개체 무결성","주문수량은 1 이상이어야 한다는 업무 규칙을 지켜야 한다. – 개체 무결성","회원의 이메일은 PK는 아니지만 중복될 수 없다. – 키(유일성) 무결성","성별 컬럼에는 'M', 'F' 값만 입력되어야 한다. – 도메인 무결성","FK 컬럼의 값은 참조하는 테이블의 PK 값으로 존재하거나 NULL이어야 한다. – 참조 무결성"],"answer":[2],"id":"DM-050"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"참조 동작 옵션","prompt":"부서–사원 관계에서 FK의 참조 동작 옵션을 정의하려고 한다. 부서 행이 삭제될 때 ⓐ 소속 사원 행도 함께 삭제되도록 하는 옵션, ⓑ 소속 사원의 부서코드를 NULL로 변경하도록 하는 옵션을 각각 작성하시오.","explanation":"ON DELETE CASCADE는 부모 삭제 시 자식도 함께 삭제, ON DELETE SET NULL은 자식 FK를 NULL로 변경한다. 기본(NO ACTION/RESTRICT)은 자식이 있으면 부모 삭제를 막는다.","blanks":[{"label":"ⓐ","answers":["ON DELETE CASCADE","CASCADE","ondeletecascade"]},{"label":"ⓑ","answers":["ON DELETE SET NULL","SET NULL","ondeletesetnull","setnull"]}],"id":"DM-051"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"인덱스 설계","prompt":"인덱스 설계에 대한 설명으로 가장 적절하지 않은 것을 고르시오.","explanation":"값의 종류가 매우 적고 고르게 분포된 컬럼은 인덱스로 걸러지는 비율이 낮아(선택도가 나빠) 효과가 거의 없고, 오히려 전체 스캔이 유리할 수 있다.","choices":["값의 종류가 2개뿐이고 고르게 분포된 성별 컬럼에 단독 B-Tree 인덱스를 만들면 조회 성능이 크게 향상된다.","결합 인덱스는 등치(=) 조건으로 자주 쓰이는 컬럼을 선두에 두는 것이 일반적으로 유리하다.","WHERE 조건에 자주 사용되고 선택도가 좋은(분포가 넓은) 컬럼은 인덱스 후보가 된다.","조인에 자주 사용되는 FK 컬럼에는 인덱스를 고려한다.","인덱스가 많을수록 INSERT·UPDATE·DELETE 시 인덱스 유지 비용이 증가한다."],"answer":[1],"id":"DM-052"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"결합 인덱스 활용","prompt":"[주문] 테이블에 (고객번호, 주문일자) 순서로 결합 인덱스가 생성되어 있다. 다음 중 이 인덱스를 범위 탐색에 가장 효율적으로 활용하기 어려운 조건을 고르시오.","explanation":"결합 인덱스는 선두 컬럼 조건이 있어야 인덱스 범위 탐색을 효율적으로 할 수 있다. 선두 컬럼(고객번호) 조건 없이 주문일자만 조건으로 주면 인덱스 범위 탐색이 어렵다(Index Skip Scan 등 예외 제외).","choices":["WHERE 고객번호 IN ('C001', 'C002') AND 주문일자 >= '20250301'","WHERE 고객번호 = 'C001' AND 주문일자 BETWEEN '20250301' AND '20250331'","WHERE 고객번호 = 'C001'","WHERE 주문일자 BETWEEN '20250301' AND '20250331'","WHERE 고객번호 = 'C001' AND 주문일자 = '20250301'"],"answer":[4],"id":"DM-053"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 타입 선택","prompt":"물리 모델에서 컬럼의 데이터 타입을 선택한 내용으로 가장 적절하지 않은 것을 고르시오.","explanation":"우편번호·전화번호처럼 계산에 쓰지 않고 앞자리 0이 의미 있는 값을 숫자 타입으로 저장하면 '01234'가 1234로 바뀌어 값이 훼손된다. 문자 타입을 사용해야 한다.","choices":["결제금액: 소수 둘째 자리까지 계산이 필요하여 NUMBER(15,2) 사용","상품 상세설명: 수만 자 이상의 긴 텍스트이므로 CLOB 사용","상품명: 길이가 가변적이므로 VARCHAR2(100) 사용","국가코드: 항상 2자리 고정 길이이므로 CHAR(2) 사용","우편번호: '01234'처럼 0으로 시작하는 값이 있지만 숫자로만 구성되므로 NUMBER(5) 사용"],"answer":[5],"id":"DM-054"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"대리키 사용 시 고려사항","prompt":"계약 테이블에서 복합 자연키(사업자번호+지점코드+계약일자+순번) 대신 계약ID라는 대리키(인조식별자)를 PK로 사용하려 한다. 이에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"대리키는 행마다 새 값이 부여되므로, 같은 자연키 조합이 중복 입력되어도 PK 위반이 발생하지 않는다. 자연키에 UNIQUE 제약을 별도로 걸어야 중복을 막을 수 있다.","choices":["자식 테이블의 FK가 단일 컬럼이 되어 조인 조건이 단순해진다.","대리키 값은 시퀀스나 IDENTITY 등을 이용해 생성할 수 있다.","자연키의 유일성을 보장하려면 자연키 컬럼 조합에 UNIQUE 제약을 별도로 정의해야 한다.","대리키를 PK로 사용하면 자연키 조합의 중복 입력도 DB가 자동으로 막아준다.","자연키를 구성하는 값이 업무상 변경되더라도 PK와 FK에 미치는 영향을 줄일 수 있다."],"answer":[4],"id":"DM-055"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"대용량 로그 테이블 설계","prompt":"아래 [상황]에 가장 적합한 물리 설계 방안을 고르시오.","explanation":"조회와 삭제가 모두 월 단위로 이루어지므로 날짜 기준 Range 파티션이 적합하다. 조회 시 해당 월 파티션만 읽고(Partition Pruning), 오래된 데이터는 파티션 DROP/TRUNCATE로 빠르게 삭제할 수 있다.","context":"[상황]\n• [접속로그] 테이블에 하루 1,000만 건, 누적 수십억 건이 적재된다.\n• 조회는 대부분 '특정 월'의 접속 현황 분석이다.\n• 보관 기간(13개월)이 지난 데이터는 매월 한 달치씩 삭제해야 하며, 현재 DELETE로 처리하여 수 시간이 걸린다.","choices":["접속일시 기준 월 단위 Range 파티셔닝","파티셔닝 없이 접속일시 단일 인덱스만 추가","접속 채널 코드 기준 List 파티셔닝","자주 조회되지 않는 컬럼을 분리하는 수직분할","회원번호 기준 Hash 파티셔닝"],"answer":[1],"id":"DM-056"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"이력 데이터 모델","prompt":"상품 판매가가 수시로 변경되며, '특정 일자에 적용된 판매가'를 조회하는 요건이 많다. 이를 위한 모델로 가장 적절한 것을 고르시오.","explanation":"시작·종료 일자를 함께 관리하는 선분 이력은 'BETWEEN 적용시작일자 AND 적용종료일자' 조건으로 특정 시점의 값을 바로 조회할 수 있다. 변경 시점만 저장하는 점 이력은 시점 조회 시 복잡한 처리가 필요하다.","choices":["[상품] 테이블의 판매가 컬럼을 새 값으로 덮어쓴다.","[상품가격이력](상품코드, 변경일시, 판매가)만 두고 특정 시점 조회 시 항상 전체 이력을 읽어 계산한다.","[상품가격이력](상품코드, 적용시작일자, 적용종료일자, 판매가)으로 기간을 함께 관리한다.","[상품] 테이블에 판매가1 ~ 판매가10 컬럼을 두고 순서대로 채운다.","가격 변경 내역을 애플리케이션 로그 파일에만 남긴다."],"answer":[3],"id":"DM-057"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"이력 관리 방식","prompt":"이력 데이터를 관리할 때 변경 시점만 기록하는 방식을 '점 이력'이라 한다. 이와 달리 '적용시작일자'와 '적용종료일자'를 함께 관리하여 유효 기간을 표현하는 방식을 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"시작·종료 시점을 함께 관리하는 이력 방식을 선분 이력이라 한다.","blanks":[{"label":"ⓐ","answers":["선분이력","선분","선분 이력","기간이력"]}],"id":"DM-058"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"논리 모델의 물리 변환","prompt":"논리 데이터 모델을 물리 데이터 모델로 변환하는 규칙으로 옳지 않은 것을 고르시오.","explanation":"M:N 관계는 FK 하나로 표현할 수 없으므로 반드시 교차(관계) 테이블을 만들어 1:M 관계 두 개로 구현해야 한다.","choices":["엔터티는 테이블로 변환한다.","M:N 관계는 물리 모델에서 별도 테이블 없이 한쪽 테이블에 FK 하나를 두어 그대로 구현할 수 있다.","속성은 컬럼으로 변환한다.","관계는 외래키(FK)로 변환한다.","주식별자는 기본키(PK)로 변환한다."],"answer":[2],"id":"DM-059"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"NOT NULL 제약 지정","prompt":"[주문] 및 [회원] 관련 컬럼 중 NOT NULL 제약을 지정하기에 가장 적절한 것을 고르시오.","explanation":"주문일시는 주문이 생성되는 시점에 항상 존재해야 하는 필수 값이다. 탈퇴일자·퇴사일자·취소사유·추천인은 해당 사건이 없으면 값이 없을 수 있으므로 NULL을 허용해야 한다.","choices":["회원.추천인회원번호","주문.주문일시","사원.퇴사일자","회원.탈퇴일자","주문.취소사유"],"answer":[2],"id":"DM-060"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"도메인 제약 정의","prompt":"[주문] 테이블의 주문수량 컬럼에 1 이상의 값만 입력되도록 제약조건을 추가하려 한다. 아래 SQL의 ⓐ에 들어갈 키워드를 작성하시오.","explanation":"컬럼 값의 범위·조건을 제한하는 제약은 CHECK 제약이다.","context":"```sql\nALTER TABLE 주문\n  ADD CONSTRAINT CK_주문_주문수량 ⓐ (주문수량 >= 1);\n```","blanks":[{"label":"ⓐ","answers":["CHECK"]}],"id":"DM-061"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"컬럼 제약 정의","prompt":"[회원] 테이블의 PK는 회원번호이다. 이메일 컬럼은 PK는 아니지만 회원마다 서로 다른 값을 가져야 하며 NULL은 허용하지 않는다. 이메일 컬럼에 NOT NULL과 함께 정의해야 할 제약조건 ⓐ를 작성하시오.","explanation":"PK가 아닌 후보키(대체키)의 중복을 막기 위해서는 UNIQUE 제약을 정의한다.","blanks":[{"label":"ⓐ","answers":["UNIQUE","유니크","UNIQUE KEY","uniquekey","UK","고유키","유일키"]}],"id":"DM-062"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"뷰(View)의 활용","prompt":"뷰(View)를 활용하는 이유로 옳지 않은 것을 고르시오.","explanation":"일반 뷰는 SQL 정의만 저장하는 가상 테이블로, 조회 시 원본 테이블을 읽는다. 데이터를 물리적으로 저장하는 것은 Materialized View이며, 뷰 자체가 항상 더 빠른 것은 아니다.","choices":["테이블 구조가 변경되어도 뷰를 통해 응용 프로그램의 영향을 줄일 수 있다.","복잡한 조인 SQL을 뷰로 정의하여 사용자의 SQL을 단순화한다.","뷰는 데이터를 물리적으로 별도 저장하므로 항상 원본 테이블보다 조회 속도가 빠르다.","서브타입별 테이블을 UNION ALL 하는 뷰로 슈퍼타입 형태의 통합 조회를 제공할 수 있다.","민감한 컬럼을 제외한 뷰만 권한을 부여하여 보안을 강화한다."],"answer":[3],"id":"DM-063"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 표준 구성요소","prompt":"데이터 표준화 구성요소에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"데이터 표준은 전사적으로 통일하여 공유하는 것이 목적이다. 시스템마다 자유롭게 정의하면 표준화의 의미가 없다.","choices":["표준 단어: 업무에서 사용하는 최소 단위의 단어를 정의하고 이음동의어·동음이의어를 정리한다.","표준 용어: 표준 단어를 조합하여 만든 용어로, 엔터티·속성명 등에 사용한다.","표준 도메인: 같은 성격의 속성을 그룹화하여 데이터 타입과 길이를 정의한다.","표준 용어는 시스템마다 자유롭게 정의하며, 전사적으로 공유할 대상은 아니다.","표준 코드: 코드 값과 코드명의 체계를 정의하여 일관되게 사용하도록 한다."],"answer":[4],"id":"DM-064"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"단어 표준화","prompt":"아래 [현행 시스템 분석 결과]처럼 서로 다른 단어가 같은 의미로 혼용되는 경우, 이러한 단어들을 무엇이라 하는지 ⓐ에 작성하시오. (데이터 표준화 시 하나의 표준 단어로 통일한다.)","explanation":"형태(표기)는 다르지만 같은 의미를 갖는 단어를 이음동의어라 한다. 반대로 표기는 같지만 의미가 다른 것은 동음이의어이다.","context":"[현행 시스템 분석 결과]\n| 시스템 | 사용 속성명 | 의미 |\n| 주문 시스템 | 고객번호 | 서비스에 가입한 사람을 식별하는 번호 |\n| CRM | 회원번호 | 서비스에 가입한 사람을 식별하는 번호 |\n| 정산 시스템 | 가입자번호 | 서비스에 가입한 사람을 식별하는 번호 |","blanks":[{"label":"ⓐ","answers":["이음동의어","이음동의","동의어","이음 동의어"]}],"id":"DM-065"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"표준 용어의 물리명","prompt":"아래 [표준 단어 사전]을 참고할 때, 표준 용어 '주문일자'의 물리명(컬럼명)으로 가장 적절한 것을 고르시오.","explanation":"표준 용어의 물리명은 표준 단어의 영문 약어를 정해진 순서와 구분자(_)로 조합한다. 주문(ORD) + 일자(DT) → ORD_DT.","context":"[표준 단어 사전]\n| 논리명 | 영문 약어 |\n| 고객 | CUST |\n| 주문 | ORD |\n| 번호 | NO |\n| 일자 | DT |\n| 금액 | AMT |\n| 명 | NM |\n\n※ 물리명 작성 규칙: 표준 단어의 영문 약어를 논리명 순서대로 '_'로 연결한다.","choices":["ORD_DT","ORDER_DATE","DT_ORD","ORDDT","ORD_DATE"],"answer":[1],"id":"DM-066"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"표준 용어 작성","prompt":"아래 [표준 단어 사전]과 작성 규칙에 따라 표준 용어 ⓐ '고객명', ⓑ '주문금액'의 물리명(컬럼명)을 각각 작성하시오.","explanation":"고객(CUST)+명(NM) → CUST_NM, 주문(ORD)+금액(AMT) → ORD_AMT.","context":"[표준 단어 사전]\n| 논리명 | 영문 약어 |\n| 고객 | CUST |\n| 주문 | ORD |\n| 번호 | NO |\n| 일자 | DT |\n| 금액 | AMT |\n| 명 | NM |\n\n※ 물리명 작성 규칙: 표준 단어의 영문 약어를 논리명 순서대로 '_'로 연결한다.","blanks":[{"label":"ⓐ","answers":["CUST_NM"]},{"label":"ⓑ","answers":["ORD_AMT"]}],"id":"DM-067"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"표준 도메인 준수","prompt":"아래 [표준 도메인]을 기준으로 할 때, 표준을 준수하지 않은 컬럼을 고르시오.","explanation":"정산금액(STLM_AMT)은 금액 도메인이므로 NUMBER(15)를 사용해야 한다. 금액을 문자 타입으로 저장하면 연산·정렬·검증에 문제가 생긴다.","context":"[표준 도메인]\n| 도메인 | 데이터 타입 | 적용 대상(접미어) |\n| 금액 | NUMBER(15) | _AMT |\n| 일자 | CHAR(8) | _DT |\n| 명칭 | VARCHAR2(50) | _NM |\n| 여부 | CHAR(1) | _YN |","choices":["JOIN_DT CHAR(8)","PAY_AMT NUMBER(15)","USE_YN CHAR(1)","CUST_NM VARCHAR2(50)","STLM_AMT VARCHAR2(15)"],"answer":[5],"id":"DM-068"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"데이터 품질 기준","prompt":"다음 [사례]와 데이터 품질 기준(차원)의 연결이 옳지 않은 것을 고르시오.","explanation":"데이터가 필요한 시점에 최신 상태로 제공되는지는 적시성(Timeliness)에 해당한다. 정확성은 실제 값과 데이터 값이 일치하는지에 대한 기준이다.","choices":["같은 고객의 주소가 CRM과 주문 시스템에서 서로 다르게 관리되고 있다. – 일관성","실시간 재고가 하루가 지나서야 시스템에 반영되어 판매 가능 여부 판단이 늦어진다. – 정확성","실제 1990년생 고객의 출생연도가 1909년으로 입력되어 있다. – 정확성","생년월일 컬럼에 '20251350'처럼 존재할 수 없는 날짜가 입력되어 있다. – 유효성","필수 항목인 고객 연락처의 30%가 비어 있다. – 완전성"],"answer":[2],"id":"DM-069"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 전환 절차","prompt":"아래 데이터 전환 활동을 수행 순서대로 바르게 나열한 것을 고르시오.","explanation":"현행 데이터 분석 → 매핑 정의 → 전환 프로그램 개발 → 리허설(모의 전환)·검증 → 본 전환 및 결과 검증 순으로 진행한다. 리허설을 통해 전환 시간과 오류를 사전에 확인한다.","context":"[데이터 전환 활동]\n(ㄱ) 전환 대상 범위 확정 및 현행(AS-IS) 데이터 분석\n(ㄴ) AS-IS ↔ TO-BE 데이터 매핑 정의서 작성\n(ㄷ) 전환 프로그램 개발\n(ㄹ) 리허설(모의 전환) 수행 및 검증\n(ㅁ) 본 전환 수행 및 결과 검증","choices":["(ㄱ) → (ㄷ) → (ㄴ) → (ㄹ) → (ㅁ)","(ㄷ) → (ㄱ) → (ㄴ) → (ㄹ) → (ㅁ)","(ㄱ) → (ㄴ) → (ㄷ) → (ㄹ) → (ㅁ)","(ㄱ) → (ㄴ) → (ㄷ) → (ㅁ) → (ㄹ)","(ㄴ) → (ㄱ) → (ㄷ) → (ㅁ) → (ㄹ)"],"answer":[3],"id":"DM-070"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 전환 검증","prompt":"데이터 전환 후 검증 방법으로 적절하지 않은 것을 고르시오.","explanation":"전환 프로그램이 정상 종료되었더라도 매핑 오류·누락·변환 오류가 있을 수 있으므로 건수·합계·샘플·무결성 검증을 반드시 수행해야 한다.","choices":["AS-IS와 TO-BE의 테이블별 건수를 비교(건수 대사)한다.","FK가 가리키는 부모 데이터가 없는 고아 레코드가 있는지 확인한다.","금액·수량 컬럼의 합계를 비교(합계 대사)한다.","주요 데이터를 샘플링하여 화면 및 값 단위로 비교한다.","전환 프로그램이 오류 없이 정상 종료되었으면 데이터 정합성 검증은 생략한다."],"answer":[5],"id":"DM-071"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"발급 데이터 모델 설계","prompt":"다음은 C사 쿠폰 발급에 대한 [운영 요구] 사항이다. 해당 요구를 가장 잘 만족하도록 정규화한 논리 데이터 모델을 고르시오.","explanation":"쿠폰과 회원은 M:N이므로 교차 엔터티가 필요하다. (쿠폰번호, 회원번호)를 PK로 하면 '같은 쿠폰은 한 회원에게 1회만 발급' 규칙을 PK로 보장한다. 발급순번만 PK로 두면 중복 발급을 막지 못하고, 쿠폰명·할인금액을 회원쿠폰에 두면 부분 종속(2NF 위반)이 생긴다.","context":"[운영 요구]\n• 쿠폰은 쿠폰번호로 식별하며 쿠폰명과 할인금액을 가진다.\n• 하나의 쿠폰은 여러 회원에게 발급될 수 있고, 한 회원은 여러 종류의 쿠폰을 받을 수 있다.\n• 같은 쿠폰은 한 회원에게 한 번만 발급된다.\n• 발급 건마다 발급일시, 사용여부, 사용일시를 관리한다.","choices":["쿠폰(쿠폰번호 PK, 쿠폰명, 할인금액) / 회원쿠폰(쿠폰번호 PK·FK, 회원번호 PK·FK, 발급일시, 사용여부, 사용일시)","회원(회원번호 PK, 회원명, 쿠폰번호1, 쿠폰번호2, 쿠폰번호3)","회원쿠폰(쿠폰번호 PK, 회원번호 PK, 쿠폰명, 할인금액, 발급일시, 사용여부, 사용일시)","쿠폰(쿠폰번호 PK, 쿠폰명, 할인금액, 회원번호, 사용여부, 사용일시)","쿠폰(쿠폰번호 PK, 쿠폰명, 할인금액) / 회원쿠폰(발급순번 PK, 쿠폰번호 FK, 회원번호 FK, 발급일시, 사용여부)"],"answer":[1],"id":"DM-072"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"공통코드 테이블","prompt":"여러 코드를 하나의 공통코드 테이블(코드그룹, 코드, 코드명, 정렬순서, 사용여부)로 통합 관리하는 방식에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"공통코드 테이블은 PK가 (코드그룹, 코드)이므로, 업무 테이블의 코드 컬럼 하나만으로는 특정 그룹 코드만 참조하도록 FK를 걸기 어렵다. 참조 무결성은 애플리케이션이나 CHECK 등으로 보완해야 한다.","choices":["화면의 콤보박스 등을 공통 로직으로 처리하기 쉽다.","새로운 코드 그룹을 추가할 때 테이블 구조를 변경하지 않아도 된다.","코드 그룹마다 관리해야 할 추가 속성이 다르면 표현하기 어렵다.","각 업무 테이블의 코드 컬럼에서 특정 코드 그룹만 참조하도록 FK 제약으로 강하게 보장하기 쉽다.","(코드그룹, 코드)를 복합 PK로 구성하는 것이 일반적이다."],"answer":[4],"id":"DM-073"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"데이터 관리 용어","prompt":"테이블명, 컬럼 정의, 데이터 타입, 표준 용어, 생성 이력처럼 '데이터를 설명하는 데이터'를 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"데이터의 구조·의미·속성을 설명하는 데이터를 메타데이터라 하며, 데이터 표준·데이터 사전 관리의 기반이 된다.","blanks":[{"label":"ⓐ","answers":["메타데이터","메타 데이터","metadata","메타정보"]}],"id":"DM-074"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"데이터 표준화의 효과","prompt":"데이터 표준화의 기대 효과로 옳지 않은 것을 고르시오.","explanation":"데이터 표준화는 명칭·형식·코드 등 데이터 정의를 통일하는 것이며, DBMS 제품을 통일하는 것과는 무관하다.","choices":["필요한 데이터를 찾고 이해하는 시간이 단축된다.","표준화를 수행하면 모든 시스템이 동일한 DBMS 제품으로 자동 통일된다.","명칭의 통일로 시스템 간 의사소통이 명확해진다.","데이터 품질과 정합성이 향상된다.","시스템 간 데이터 연계·통합 시 변환 비용이 줄어든다."],"answer":[2],"id":"DM-075"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"전환 매핑 규칙","prompt":"아래 [데이터 전환 매핑 정의서]와 [TO-BE 코드 정의]를 참고하여, AS-IS 회원상태 값이 ⓐ NULL인 경우와 ⓑ 'N'인 경우 TO-BE 회원상태코드로 전환될 값을 각각 작성하시오.","explanation":"AS-IS에서 NULL은 휴면, 'N'은 탈퇴 상태를 의미하므로 TO-BE 코드 정의에 따라 각각 '20', '30'으로 변환한다.","context":"[AS-IS 회원상태 값 정의]\n| AS-IS 값 | 의미 |\n| Y | 정상 이용 중 |\n| N | 탈퇴 처리됨 |\n| NULL | 1년 이상 미접속(휴면) |\n\n[TO-BE 코드 정의] 회원상태코드(MBR_STAT_CD)\n| 코드 | 코드명 |\n| 10 | 활성 |\n| 20 | 휴면 |\n| 30 | 탈퇴 |\n\n[데이터 전환 매핑 정의서]\n| AS-IS 컬럼 | AS-IS 값 | TO-BE 컬럼 | TO-BE 값 |\n| USE_YN | Y | MBR_STAT_CD | 10 |\n| USE_YN | NULL | MBR_STAT_CD | ⓐ |\n| USE_YN | N | MBR_STAT_CD | ⓑ |","blanks":[{"label":"ⓐ","answers":["20"]},{"label":"ⓑ","answers":["30"]}],"id":"DM-076"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"코드 체계 설계","prompt":"코드 체계 설계 원칙으로 옳지 않은 것을 고르시오.","explanation":"코드 값은 기존 데이터가 참조하고 있으므로 명칭이 바뀌어도 값은 유지하고 코드명만 수정해야 한다. 코드 값을 바꾸면 기존 데이터와의 정합성이 깨진다.","choices":["더 이상 사용하지 않는 코드는 삭제하지 않고 사용여부로 관리한다.","향후 확장을 고려하여 코드 자릿수에 여유를 둔다.","하나의 코드 값은 하나의 의미만 갖도록 정의한다.","코드 값 자체에 너무 많은 의미를 조합하여 넣는 것을 피한다.","코드명이 변경될 때마다 혼동을 막기 위해 코드 값도 새 값으로 함께 변경한다."],"answer":[5],"id":"DM-077"},{"category":"데이터모델링","type":"essay","difficulty":"중","title":"표준화 관점의 모델 개선","prompt":"아래 [현행 물리 모델]은 같은 의미의 '고객번호'를 테이블마다 다르게 정의하고 있다. 데이터 표준화 관점에서 문제점 2가지를 제시하고, 각각의 개선 방안을 서술하시오.","explanation":"명칭(용어) 표준과 도메인(타입·길이) 표준 두 관점의 문제와 개선이 제시되면 정답.","context":"[현행 물리 모델]\n| 테이블 | 컬럼명 | 데이터 타입 | 설명 |\n| CUSTOMER | CUST_NO | VARCHAR2(10) | 고객번호 |\n| ORDERS | CUST_ID | NUMBER(10) | 고객번호 |\n| DELIVERY | CUSTOMER_NO | VARCHAR2(12) | 고객번호 |","answer_text":"문제점 1) 명칭 불일치: 같은 의미의 속성이 CUST_NO, CUST_ID, CUSTOMER_NO로 서로 다르게 정의되어(이음동의어) 의미 파악과 연계가 어렵다.\n → 개선: 표준 단어·표준 용어(고객번호 = CUST_NO)를 정의하고 모든 테이블의 컬럼명을 표준 용어로 통일한다.\n문제점 2) 데이터 타입·길이 불일치: VARCHAR2(10), NUMBER(10), VARCHAR2(12)로 서로 달라 조인 시 묵시적 형변환이 발생하고 인덱스를 사용하지 못하거나, 값이 잘리거나(길이 차이) 앞자리 0이 사라지는 등 데이터 오류가 생길 수 있다.\n → 개선: 표준 도메인(예: 고객번호 = VARCHAR2(10))을 정의하여 동일 의미 컬럼의 타입·길이를 통일하고, 데이터 전환 시 형식을 맞춘다.","id":"DM-078"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"업무별 DBMS 유형 선택","prompt":"업무 요건과 DBMS 유형을 짝지은 것으로 가장 적절하지 않은 것을 고르시오.","explanation":"시간 순서로 대량 적재되는 측정값과 구간 집계에는 Time-series DBMS가 적합하다. Graph DBMS는 노드·엣지로 복잡한 연결 관계(친구 관계, 추천 경로 등)를 탐색하는 데 특화되어 있다.","choices":["상품 리뷰를 수치 배열로 변환해 저장하고 의미가 비슷한 리뷰를 찾아야 한다. – Vector DBMS","로그인 세션과 장바구니를 밀리초 단위로 읽고 써야 한다. – Key-value DBMS","IoT 센서가 초 단위로 보내는 온도 값을 시간 순으로 적재하고 구간 집계한다. – Graph DBMS","회계 전표처럼 스키마가 정해져 있고 트랜잭션 정합성이 중요하다. – RDBMS","상품 분류마다 관리 항목이 달라 JSON 형태로 유연하게 저장하려 한다. – Document DBMS"],"answer":[3],"id":"DM-079"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"DBMS 유형의 이해","prompt":"다음 <보기>의 DBMS 유형(ㄱ~ㅁ)과 대표 제품(A~E)을 짝지은 것으로 가장 적절하지 않은 것을 고르시오.","explanation":"Document DBMS의 대표 제품은 MongoDB·CouchDB(E)이다. Redis·DynamoDB(D)는 Key-value DBMS의 대표 제품이므로 (ㄹ)-(D)는 잘못된 연결이다.","context":"[DBMS 유형]\n(ㄱ) Graph DBMS\n(ㄴ) Vector DBMS\n(ㄷ) Key-value DBMS\n(ㄹ) Document DBMS\n(ㅁ) RDBMS(관계형 DBMS)\n\n[대표 제품]\n(A) Pinecone, Milvus\n(B) Neo4j, Amazon Neptune\n(C) Oracle, PostgreSQL, MariaDB\n(D) Redis, DynamoDB\n(E) MongoDB, CouchDB","choices":["(ㄱ) - (B)","(ㄴ) - (A)","(ㄷ) - (D)","(ㄹ) - (D)","(ㅁ) - (C)"],"answer":[4],"id":"DM-080"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"AI 검색을 위한 저장소","prompt":"C사는 사내 문서를 검색해 답변하는 생성형 AI 챗봇을 구축하려 한다. 문서를 고차원 수치 배열로 변환하여 저장하고, 질문과 의미적으로 가장 가까운 문서를 근사 최근접 이웃(ANN) 탐색으로 빠르게 찾아야 한다. 이 요건에 특화된 DBMS 유형 ⓐ를 작성하시오.","explanation":"임베딩(벡터) 저장과 유사도 검색에 특화된 것은 Vector DBMS(예: Pinecone, Milvus)이며, RAG 구성에서 주로 사용된다.","blanks":[{"label":"ⓐ","answers":["VectorDBMS","Vector","벡터DBMS","벡터","VectorDB","벡터DB","벡터데이터베이스","vectordatabase"]}],"id":"DM-081"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"트랜잭션의 특성","prompt":"트랜잭션의 ACID 특성 중 ⓐ 트랜잭션의 작업이 모두 반영되거나 전혀 반영되지 않아야 하는 특성과, ⓑ 커밋된 결과는 시스템 장애가 발생하더라도 영구적으로 보존되어야 하는 특성을 각각 작성하시오.","explanation":"ACID = 원자성(Atomicity), 일관성(Consistency), 고립성(Isolation), 지속성(Durability).","blanks":[{"label":"ⓐ","answers":["원자성","Atomicity"]},{"label":"ⓑ","answers":["지속성","영속성","Durability","내구성"]}],"id":"DM-082"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"트랜잭션 격리 수준","prompt":"트랜잭션 격리 수준(Isolation Level)에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"READ UNCOMMITTED는 다른 트랜잭션이 커밋하지 않은 데이터도 읽을 수 있어 Dirty Read가 발생하는 가장 낮은 격리 수준이다.","choices":["격리 수준을 높일수록 일반적으로 동시 처리 성능은 낮아진다.","REPEATABLE READ에서는 같은 행을 다시 읽을 때 값이 달라지는 Non-Repeatable Read가 방지된다.","SERIALIZABLE은 가장 엄격한 격리 수준이다.","READ UNCOMMITTED에서는 Dirty Read가 발생하지 않는다.","READ COMMITTED에서는 커밋되지 않은 데이터를 읽는 Dirty Read가 발생하지 않는다."],"answer":[4],"id":"DM-083"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"IE 표기법의 해석","prompt":"IE(Information Engineering, Crow's Foot) 표기법에서 관계선 끝에 '○<' 기호가 표시되어 있을 때의 의미로 옳은 것을 고르시오.","explanation":"○는 0(선택), <(까마귀발)은 다수(Many)를 뜻하므로 '○<'는 0개 이상이다. '|<'는 1개 이상, '||'는 정확히 1개, '○|'는 0 또는 1개이다.","choices":["0개 이상(선택적 다수)","1개 이상(필수적 다수)","정확히 1개","0개 또는 1개","정확히 2개"],"answer":[1],"id":"DM-084"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"ERD 관계 해석","prompt":"아래 [논리 ERD](IE 표기법)를 보고 ⓐ 주문 1건에 포함되어야 하는 주문상품의 최소 개수, ⓑ 상품 1개가 주문상품에 등장할 수 있는 최소 횟수를 각각 숫자로 작성하시오.","explanation":"주문 → 주문상품 쪽 끝이 '|<'(1 이상)이므로 주문은 최소 1개의 주문상품을 가진다. 상품 → 주문상품 쪽 끝이 '○<'(0 이상)이므로 한 번도 주문되지 않은 상품이 있을 수 있다.","context":"[논리 ERD]\n```\n[고객]  ||────────○<  [주문]\n[주문]  ||────────|<  [주문상품]\n[상품]  ||────────○<  [주문상품]\n\n※ '||' 정확히 1, '|<' 1 이상, '○<' 0 이상\n```","blanks":[{"label":"ⓐ","answers":["1","1개"]},{"label":"ⓑ","answers":["0","0개","0번","0회"]}],"id":"DM-085"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"엔터티의 분류","prompt":"발생 시점에 따른 엔터티 분류(기본/중심/행위 엔터티)로 연결이 옳지 않은 것을 고르시오.","explanation":"부서는 다른 엔터티로부터 파생되지 않고 독립적으로 생성되는 기본(키) 엔터티이다. 행위 엔터티는 업무 처리 과정에서 지속적으로 발생·증가하는 데이터(이력, 내역 등)이다.","choices":["부서 – 행위 엔터티","고객 – 기본 엔터티(키 엔터티)","계약변경이력 – 행위 엔터티","상품 – 기본 엔터티(키 엔터티)","계약 – 중심 엔터티(메인 엔터티)"],"answer":[1],"id":"DM-086"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"묶음상품 데이터 모델","prompt":"다음은 C유통사의 상품 구성에 대한 [운영 요구] 사항이다. 해당 요구를 가장 잘 만족하는 논리 데이터 모델을 고르시오.","explanation":"한 상품이 여러 묶음에 포함될 수 있고 묶음도 여러 상품을 포함하므로 상품–상품 간 M:N 순환 구조이다. 상품을 두 번 참조하는 [상품구성] 교차 엔터티(상위·하위상품번호)를 두어야 하며, 구성수량도 여기서 관리한다. 상위상품번호를 상품에 두면 한 상품이 여러 묶음에 속할 수 없다.","context":"[운영 요구]\n• 상품은 단품일 수도 있고, 여러 상품을 묶은 묶음상품일 수도 있다. 묶음상품도 자체 상품번호·상품명·판매가를 가진다.\n• 하나의 단품은 여러 묶음상품에 포함될 수 있다.\n• 묶음상품이 다른 묶음상품의 구성품이 될 수도 있다.\n• 구성마다 구성수량을 관리한다.","choices":["묶음상품(묶음상품번호 PK, 상품명, 판매가, 구성상품번호1, 구성상품번호2, 구성상품번호3)","상품(상품번호 PK, 상품명, 판매가, 상품유형코드) / 상품구성(상위상품번호 PK·FK, 하위상품번호 PK·FK, 구성수량)","상품(상품번호 PK, 상품명, 판매가, 구성상품목록) ※ 구성상품목록 예: 'A01:2,B03:1'","상품구성(구성순번 PK, 상품번호 FK, 구성수량)","상품(상품번호 PK, 상품명, 판매가, 상위상품번호 FK, 구성수량)"],"answer":[2],"id":"DM-087"},{"category":"데이터모델링","type":"essay","difficulty":"상","title":"M:N 관계의 교차 엔터티 설계","prompt":"아래 [업무 규칙]에 따라 [프로젝트]와 [사원] 사이의 교차 엔터티 [프로젝트투입]을 설계하려 한다. [프로젝트투입]의 주식별자(PK) 구성과 그 이유를 서술하시오.","explanation":"재투입이 가능하다는 규칙 때문에 두 부모 PK만으로는 유일성이 깨진다는 점을 짚으면 정답.","context":"[업무 규칙]\n• 한 프로젝트에는 여러 사원이 투입되고, 한 사원은 여러 프로젝트에 투입될 수 있다.\n• 투입 시 역할, 투입률(%), 투입시작일자, 투입종료일자를 관리한다.\n• 같은 사원이 같은 프로젝트에 철수 후 다른 기간에 다시 투입될 수 있다.","answer_text":"PK: (프로젝트번호, 사원번호, 투입시작일자)  ※ 또는 (프로젝트번호, 사원번호, 투입순번)\n이유:\n  - 프로젝트와 사원은 M:N 관계이므로 양쪽 PK(프로젝트번호, 사원번호)를 상속한다.\n  - 같은 사원이 같은 프로젝트에 기간을 달리하여 다시 투입될 수 있으므로 (프로젝트번호, 사원번호)만으로는 유일성이 보장되지 않는다.\n  - 따라서 투입시작일자(또는 투입순번)를 추가해야 인스턴스를 유일하게 식별할 수 있다.\n  - 역할·투입률·투입종료일자는 이 PK에 종속되는 일반 속성으로 둔다.\n  (대안) 투입ID 대리키를 PK로 사용할 경우, (프로젝트번호, 사원번호, 투입시작일자)에 UNIQUE 제약을 두어야 한다.","id":"DM-088"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"식별자의 분류","prompt":"식별자의 분류에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"본질식별자는 업무에 의해 만들어지는 식별자이다. 시스템이 생성한 일련번호처럼 업무와 무관하게 만든 것은 인조식별자이다.","choices":["본질식별자: 시스템이 자동으로 생성한 일련번호 형태의 식별자를 말한다.","인조식별자: 업무적으로 만들어지지는 않았지만 식별자가 복잡하여 인위적으로 만든 식별자이다.","외부식별자: 다른 엔터티와의 관계를 통해 상속받은 식별자(FK)이다.","복합식별자: 둘 이상의 속성으로 구성된 식별자이다.","보조식별자: 인스턴스를 유일하게 식별할 수 있지만 대표성을 갖지 못해 참조 관계 연결에는 사용하지 않는다."],"answer":[1],"id":"DM-089"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"속성 설계 개선","prompt":"아래 [상황]에 대한 데이터 모델 개선 방안으로 가장 적절한 것을 고르시오.","explanation":"업무에서 시군구 단위로 집계·검색해야 한다면 그 단위가 의미 있는 최소 단위이므로 속성을 원자 단위로 분리해야 한다. 문자열을 잘라 쓰면 형식 불일치로 정확성이 떨어지고 인덱스도 활용하기 어렵다.","context":"[상황]\n• [회원] 테이블의 주소 컬럼에 '06236 서울특별시 강남구 테헤란로 123, 5층' 형태로 한 번에 저장되어 있다.\n• 마케팅팀은 시도·시군구별 회원 수 통계와 지역별 검색을 자주 요청한다.","choices":["주소를 회원 테이블에서 삭제하고 배송 테이블에만 둔다.","주소 컬럼에 인덱스를 생성한다.","주소 컬럼의 길이를 늘려 더 많은 정보를 담도록 한다.","시군구별 통계는 매번 주소 문자열을 잘라서 계산하도록 SQL을 작성한다.","주소를 우편번호, 시도, 시군구, 상세주소 등 의미 있는 최소 단위 속성으로 분리한다."],"answer":[5],"id":"DM-090"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"비식별관계의 선택","prompt":"식별관계 대신 비식별관계를 선택하는 것이 적절한 경우로 옳지 않은 것을 고르시오.","explanation":"부모에 강하게 종속되어 부모 없이 존재할 수 없고 부모 PK로 함께 조회되는 엔터티는 식별관계로 정의하는 것이 적절하다.","choices":["자식 엔터티가 업무적으로 독립적인 식별자를 갖는 것이 자연스러운 경우","부모 엔터티 없이도 자식 엔터티가 생성될 수 있는 경우","식별관계가 계속 이어져 하위 엔터티의 PK 속성 수가 지나치게 많아지는 경우","자식 엔터티가 부모 없이는 존재할 수 없고, 항상 부모 PK를 기준으로 함께 조회되는 종속적 엔터티인 경우","부모와의 관계가 업무상 변경될 수 있어, 변경 시 자식의 PK까지 바뀌는 것을 피해야 하는 경우"],"answer":[4],"id":"DM-091"},{"category":"데이터모델링","type":"mcq","difficulty":"하","title":"관계 유형 판별 Ⅱ","prompt":"아래 [업무 규칙]과 같이 [사원]과 [부서] 사이에 의미가 다른 두 개의 관계가 동시에 존재할 때, 이를 무엇이라 하는지 고르시오.","explanation":"같은 두 엔터티 사이에 의미가 다른 관계가 둘 이상 존재하는 것을 병렬관계라 한다(소속 관계, 관리 관계).","context":"[업무 규칙]\n• 모든 사원은 하나의 부서에 소속된다. (소속 관계)\n• 각 부서에는 부서장 역할을 하는 사원이 1명 지정된다. (관리 관계)","choices":["병렬관계","배타관계","순환관계","슈퍼/서브타입 관계","M:N 관계"],"answer":[1],"id":"DM-092"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"카디널리티 판단","prompt":"아래 [업무 규칙]에서 [사원]과 [사원증]의 관계 카디널리티 ⓐ를 작성하시오. (예: 1:M 형식)","explanation":"사원 한 명은 사원증 하나만, 사원증 하나는 반드시 한 명의 사원에게만 발급되므로 1:1 관계이다.","context":"[업무 규칙]\n• 사원은 입사 시 사원증을 하나만 발급받는다. 분실 시 기존 사원증 정보를 갱신하며 새 행을 만들지 않는다.\n• 사원증은 반드시 한 명의 사원에게만 발급된다.","blanks":[{"label":"ⓐ","answers":["1:1","1대1","일대일","1 : 1"]}],"id":"DM-093"},{"category":"데이터모델링","type":"short","difficulty":"중","title":"DBMS 내부 정의 정보","prompt":"DBMS가 스스로 생성·관리하며, 테이블·컬럼·인덱스·제약조건·사용자 권한 등 데이터베이스 객체의 정의 정보를 담고 있는 시스템 테이블들의 집합을 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"DBMS가 관리하는 객체 정의 정보 집합을 데이터 사전(Data Dictionary) 또는 시스템 카탈로그라 한다.","blanks":[{"label":"ⓐ","answers":["데이터사전","데이터 사전","시스템카탈로그","카탈로그","datadictionary","시스템 카탈로그","system catalog","systemcatalog"]}],"id":"DM-094"},{"category":"데이터모델링","type":"short","difficulty":"하","title":"계층 구조의 최상위 값","prompt":"아래 [업무 규칙]에 따라 [카테고리] 테이블을 설계하였다. 1단계 카테고리 행의 상위카테고리코드 컬럼에 저장되는 값 ⓐ를 작성하시오.","explanation":"1단계(최상위) 카테고리는 참조할 상위 카테고리가 없으므로 상위카테고리코드가 NULL이다. 2단계는 반드시 상위 카테고리를 참조한다.","context":"[업무 규칙]\n• 카테고리는 카테고리코드로 식별하며 카테고리명, 단계구분코드(1·2단계)를 관리한다.\n• 2단계 카테고리는 반드시 하나의 1단계 카테고리를 상위 카테고리로 참조한다.\n\n[카테고리]\n| 카테고리코드(PK) | 카테고리명 | 단계구분코드 | 상위카테고리코드(FK) |\n| C100 | 스킨케어 | 1 | ⓐ |\n| C110 | 토너 | 2 | C100 |\n| C120 | 크림 | 2 | C100 |","blanks":[{"label":"ⓐ","answers":["NULL","널","null값","NULL값","없음"]}],"id":"DM-095"},{"category":"데이터모델링","type":"mcq","difficulty":"중","title":"번호 생성 방식","prompt":"여러 사용자가 동시에 주문을 생성하는 환경에서 주문번호를 유일하게 채번하는 방법으로 가장 적절하지 않은 것을 고르시오.","explanation":"잠금 없이 MAX+1을 조회하면 동시에 두 트랜잭션이 같은 값을 읽어 중복 번호가 생성되거나 PK 위반이 발생할 수 있다.","choices":["IDENTITY(AUTO_INCREMENT) 컬럼을 사용한다.","DBMS의 시퀀스(SEQUENCE) 객체를 사용한다.","애플리케이션에서 SELECT MAX(주문번호) + 1 값을 조회한 뒤 잠금 없이 INSERT 한다.","UUID처럼 충돌 가능성이 극히 낮은 값을 생성한다.","채번 테이블을 두고 행 잠금(SELECT … FOR UPDATE) 후 값을 증가시킨다."],"answer":[3],"id":"DM-096"},{"category":"데이터모델링","type":"essay","difficulty":"중","title":"물리 모델 리뷰","prompt":"아래 [물리 테이블 정의]를 리뷰한 결과, 무결성 측면에서 개선이 필요한 부분이 있다. 문제점 2가지 이상을 찾아 각각의 개선 방안을 서술하시오.","explanation":"참조 무결성(FK), 도메인 무결성(CHECK/타입), 필수값(NOT NULL) 관점 중 2가지 이상을 근거와 함께 제시하면 정답.","context":"[물리 테이블 정의]\nORDERS\n| 컬럼 | 타입 | NULL | 제약 |\n| ORD_NO | VARCHAR2(12) | N | PK |\n| ORD_DT | VARCHAR2(20) | Y | |\n| ORD_STAT_CD | VARCHAR2(2) | Y | |\n\nORDER_ITEM\n| 컬럼 | 타입 | NULL | 제약 |\n| ORD_NO | VARCHAR2(12) | N | PK |\n| ITEM_SEQ | NUMBER(3) | N | PK |\n| PRD_CD | VARCHAR2(10) | N | |\n| QTY | NUMBER(5) | Y | |\n\n※ 주문상태코드 정의: 10(접수), 20(결제완료), 30(배송), 90(취소)","answer_text":"문제점과 개선(예시)\n1) ORDER_ITEM.ORD_NO에 FK 제약이 없음 → 존재하지 않는 주문번호를 가진 고아 레코드가 생길 수 있음\n   → FK(ORD_NO) REFERENCES ORDERS(ORD_NO) 추가 (참조 무결성)\n2) ORDER_ITEM.QTY에 값 제약이 없음 → 0 또는 음수 수량 입력 가능\n   → CHECK (QTY >= 1), NOT NULL 지정 (도메인 무결성)\n3) ORDERS.ORD_STAT_CD에 허용 값 제약이 없고 NULL 허용 → 정의되지 않은 상태값 저장 가능\n   → NOT NULL + 공통코드 검증 또는 CHECK (ORD_STAT_CD IN ('10','20','30','90'))\n4) ORDERS.ORD_DT가 VARCHAR2(20)이고 NULL 허용 → 날짜 형식이 제각각일 수 있음\n   → 표준 일자 도메인(CHAR(8) 또는 DATE)으로 변경하고 NOT NULL 지정","id":"DM-097"},{"category":"데이터모델링","type":"mcq","difficulty":"상","title":"데이터 모델 해석","prompt":"다음은 C사 정기구독 서비스의 [논리 데이터 모델]이다. 이에 대한 설명으로 옳지 않은 것을 모두 고르시오. (2개)","explanation":"구독배송의 PK는 (구독번호, 배송회차)로 회원번호를 포함하지 않으며 회원과 직접 관계도 없다. FK 제약의 기본 동작은 자식이 있으면 부모 삭제를 막는 것이며, CASCADE 옵션이 지정되지 않는 한 자동 삭제되지 않는다.","context":"[논리 데이터 모델]\n```\n[회원]       회원번호(PK), 회원명\n   ||───────○<\n[구독]       구독번호(PK), 회원번호(FK), 구독상품코드(FK), 구독시작일자, 배송주기\n   ||───────○<\n[구독배송]   구독번호(PK·FK), 배송회차(PK), 배송예정일자, 배송상태코드\n\n[구독상품]   구독상품코드(PK), 상품명, 월요금\n   ||───────○< [구독]\n```","choices":["구독배송의 PK에 회원번호가 포함되어 있으므로, 회원과 구독배송은 식별관계로 직접 연결되어 있다.","구독상품을 삭제하면 해당 상품의 구독 정보는 FK 제약에 의해 항상 자동으로 함께 삭제된다.","구독은 반드시 하나의 구독상품을 대상으로 한다.","한 회원은 여러 개의 구독을 가질 수 있으며, 구독이 없는 회원도 존재할 수 있다.","구독배송은 구독번호와 배송회차로 식별되므로 구독과 식별관계이다."],"answer":[1,2],"id":"DM-098"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"요구사항의 유형 구분 Ⅰ","prompt":"C사는 그룹 계열 병원의 '모바일 진료 예약 앱'을 구축하기 위해 [고객 인터뷰]를 수행하고 [요구사항 정의 목록]을 도출하였다. ⓐ ~ ⓓ의 요구사항 유형을 올바르게 나열한 것을 고르시오.","explanation":"예약 가능 시간 조회, 변경 시 알림 발송은 시스템이 제공해야 할 기능이므로 기능 요구사항이다. 응답 시간(성능)과 진료기록 암호화·접근 이력(보안)은 시스템의 품질 속성을 규정하므로 비기능 요구사항이다.","context":"[고객 인터뷰]\n\"전화로만 예약하다 보니 어떤 의사 선생님이 언제 비어 있는지 알 수가 없어요. 앱에서 진료과와 의사별로 예약 가능한 시간을 바로 볼 수 있으면 좋겠어요.\"\n\"점심시간엔 접속자가 몰리는데, 그래도 예약 조회 화면은 2초 안에 떠야 해요.\"\n\"진료 기록은 민감한 정보라서 반드시 암호화해서 저장하고, 누가 언제 열람했는지 기록이 남아야 합니다.\"\n\"예약을 바꾸면 환자에게 알림톡이 자동으로 가면 좋겠어요.\"\n\n[요구사항 정의 목록]\n| 요구 ID | 요구사항명 | 요구사항 유형 | 구분 | 담당팀 |\n| REQ-01 | 진료과·의사별 예약 가능 시간 조회 | ⓐ | 신규 | 예약팀 |\n| REQ-02 | 예약 조회 화면 응답 시간 2초 이내 보장 | ⓑ | 신규 | 인프라팀 |\n| REQ-03 | 진료 기록 암호화 저장 및 열람 이력 관리 | ⓒ | 개선 | 보안팀 |\n| REQ-04 | 예약 변경 시 환자 알림톡 자동 발송 | ⓓ | 신규 | 예약팀 |","choices":["ⓐ: 기능, ⓑ: 비기능, ⓒ: 비기능, ⓓ: 기능","ⓐ: 기능, ⓑ: 비기능, ⓒ: 비기능, ⓓ: 비기능","ⓐ: 기능, ⓑ: 비기능, ⓒ: 기능, ⓓ: 기능","ⓐ: 비기능, ⓑ: 비기능, ⓒ: 비기능, ⓓ: 기능","ⓐ: 기능, ⓑ: 기능, ⓒ: 비기능, ⓓ: 기능"],"answer":[1],"id":"MP-001"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"비기능 요구사항의 분류","prompt":"비기능 요구사항과 품질 속성의 연결이 옳지 않은 것을 고르시오.","explanation":"장바구니 상품 일괄 주문은 시스템이 제공해야 할 동작이므로 기능 요구사항이다. 확장성은 사용자·데이터 증가에 대응해 자원을 늘릴 수 있는 능력에 관한 비기능 요구사항이다.","choices":["동시 접속자 5,000명 환경에서 주문 API의 95% 응답 시간이 1초 이내여야 한다. – 성능","처음 사용하는 매장 직원도 별도 교육 없이 10분 안에 판매 등록을 할 수 있어야 한다. – 사용성","서비스는 연간 99.9% 이상 중단 없이 운영되어야 한다. – 가용성","고객이 장바구니에 담은 상품을 한 번에 주문할 수 있어야 한다. – 확장성","개인정보는 AES-256으로 암호화하여 저장하고 관리자 접근 이력을 1년간 보관한다. – 보안"],"answer":[4],"id":"MP-002"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"요구사항 추적","prompt":"아래 [요구사항 추적표]를 통해 판단할 수 있는 내용으로 가장 옳은 것을 고르시오.","explanation":"추적표는 요구사항이 설계·구현·테스트까지 빠짐없이 연결되었는지 양방향으로 추적하는 도구이다. REQ-02는 테스트 케이스 ID가 없어 검증 누락 위험이 있고, REQ-03은 설계부터 누락되어 있다. 추적표는 프로젝트 진행 중 지속적으로 갱신한다.","context":"[요구사항 추적표]\n| 요구 ID | 설계 ID | 프로그램 ID | 테스트 케이스 ID |\n| REQ-01 | UI-010 | PGM-010 | TC-010 |\n| REQ-02 | UI-020 | PGM-020 | - |\n| REQ-03 | - | - | - |","choices":["요구사항 추적표는 프로젝트 종료 후 한 번만 작성하면 된다.","REQ-01은 설계 산출물이 없으므로 구현이 불가능하다.","REQ-03은 모든 단계가 완료되어 인수 테스트만 남았다.","추적표는 테스트 단계와 무관하며 요구사항과 설계 간의 관계만 관리한다.","REQ-02는 구현은 되었지만 테스트 케이스가 정의되지 않아 검증 누락 위험이 있다."],"answer":[5],"id":"MP-003"},{"category":"방법론/프로세스","type":"short","difficulty":"하","title":"요구사항 관리 산출물","prompt":"요구사항별로 관련 설계서, 프로그램, 테스트 케이스를 연결하여 요구사항이 누락 없이 구현·검증되었는지, 요구사항 변경 시 어떤 산출물이 영향을 받는지를 양방향으로 확인할 수 있도록 작성하는 문서를 ⓐ에 작성하시오.","explanation":"요구사항 추적 매트릭스(RTM, Requirements Traceability Matrix)는 요구사항 ↔ 설계 ↔ 구현 ↔ 테스트의 연결 관계를 관리하는 산출물이다.","blanks":[{"label":"ⓐ","answers":["요구사항추적매트릭스","추적매트릭스","RTM","요구사항추적표","requirementstraceabilitymatrix","추적표","요구사항 추적 매트릭스","traceabilitymatrix"]}],"id":"MP-004"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"요구사항 검토 기법","prompt":"아래 [상황]에서 수행한 요구사항 검토 기법으로 가장 적절한 것을 고르시오.","explanation":"작성자가 자료를 사전 배포하고 직접 설명하며 참여자들이 비교적 비공식적으로 오류를 찾는 방식은 워크스루이다. 인스펙션은 훈련된 검토자가 체크리스트 기반으로 공식적으로 검사하는 방식이다.","context":"[상황]\n요구사항 명세서 작성자가 회의 전에 자료를 미리 배포하고, 짧은 회의에서 명세서 내용을 직접 설명하였다.\n참석한 개발자와 현업 담당자들은 설명을 들으며 자유롭게 질문하고 누락·오류를 지적하였다.\n별도의 검토 체크리스트나 공식 검사 역할은 정하지 않았다.","choices":["인스펙션(Inspection)","요구사항 추적(Tracing)","워크스루(Walk-through)","프로토타이핑(Prototyping)","설문 조사(Survey)"],"answer":[3],"id":"MP-005"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"검증 가능한 요구사항","prompt":"다음 중 검증 가능성(Testability) 측면에서 가장 잘 작성된 요구사항을 고르시오.","explanation":"좋은 요구사항은 측정 가능한 조건과 기준(사용자 수, 비율, 시간)을 포함해 테스트로 충족 여부를 판단할 수 있어야 한다. '빠르게', '친화적', '가능한 한'은 측정 기준이 없어 검증할 수 없다.","choices":["주문 조회 시스템은 가능한 한 장애가 발생하지 않도록 안정적으로 운영되어야 하며, 장애 시 신속히 복구해야 한다.","주문 조회 API는 동시 사용자 500명 환경에서 전체 요청의 95%를 1초 이내에 응답해야 한다.","주문 조회 화면은 사용자가 불편함을 느끼지 않을 정도로 충분히 빠르게 응답해야 하며, 피크 시간에도 쾌적해야 한다.","주문 조회 화면은 최신 디자인 트렌드를 반영하여 사용자 친화적이고 보기 좋게 구성되어야 한다.","주문 조회 API는 최신 기술 스택을 적용하여 기존 시스템보다 성능이 향상되도록 개발해야 한다."],"answer":[2],"id":"MP-006"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"요구사항 도출 기법","prompt":"아래 [상황]에 가장 적합한 요구사항 도출 기법을 고르시오.","explanation":"사용자가 말로 표현하지 못하거나 인식하지 못하는 실제 업무 절차와 예외를 파악하려면 현장에서 업무 수행 과정을 직접 지켜보는 관찰 기법이 적합하다.","context":"[상황]\n물류센터 작업자들은 인터뷰에서 '특별한 어려움은 없다'고 답했다.\n그러나 실제로는 바코드가 인식되지 않을 때 수기 메모를 붙여 두었다가 나중에 일괄 입력하는 등, 매뉴얼에 없는 우회 작업을 습관적으로 하고 있다는 소문이 있다.\n분석가는 이러한 실제 작업 방식을 파악하고자 한다.","choices":["관찰(Observation)","JAD 워크숍(Joint Application Design)","문서 분석(Document Analysis)","브레인스토밍(Brainstorming)","설문 조사(Survey)"],"answer":[1],"id":"MP-007"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"인터뷰 기반 요구사항 분류","prompt":"아래 [고객 인터뷰] 내용을 요구사항으로 정의하려 한다. 이 요구사항의 ⓐ 유형(기능/비기능)과, ⓑ 이 요구사항이 다루는 품질 속성을 각각 작성하시오.","explanation":"새로운 동작을 요구하는 것이 아니라 서비스가 중단 없이 이용 가능해야 한다는 품질 수준을 요구하므로 비기능 요구사항이며, 품질 속성은 가용성이다.","context":"[고객 인터뷰]\n\"매일 새벽 정산 배치나 시스템 점검을 할 때마다 온라인 주문이 30분씩 막혀요.\n24시간 주문이 들어오니까 연간 기준으로 99.9% 이상은 주문을 받을 수 있는 상태여야 합니다.\" ","blanks":[{"label":"ⓐ","answers":["비기능","비기능요구사항","비기능 요구사항"]},{"label":"ⓑ","answers":["가용성","availability"]}],"id":"MP-008"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"Scrum 이벤트 판단 Ⅰ","prompt":"아래 [프로젝트 진행 상황]에서 Scrum 팀이 지금 수행하려는 이벤트에 대한 설명으로 가장 적절한 것을 고르시오.","explanation":"이전 스프린트가 끝나고 새 스프린트를 시작하는 시점에서 목표를 정하고 백로그 항목을 선택해 작업 계획을 세우는 것은 스프린트 계획(Sprint Planning)이다.","context":"[프로젝트 진행 상황]\nC사 Scrum 팀은 그룹 통합 멤버십 앱의 '쿠폰함 개편' 프로젝트를 진행 중이다.\n어제 이전 스프린트의 리뷰와 회고를 모두 마쳤고, 오늘 새로운 2주 스프린트를 시작한다.\n제품 책임자(PO)는 우선순위가 정리된 제품 백로그를 제시했고, 팀은 이번 스프린트에서 달성할 목표를 정한 뒤,\n그 목표를 위해 어떤 백로그 항목을 가져올지, 각 항목을 어떻게 완료할지 작업 단위로 나누어 계획하려 한다.","choices":["데일리 스크럼(Daily Scrum): 개발자들이 매일 같은 시간에 15분 이내로 스프린트 목표 대비 진척을 점검하고 당일 계획을 조정하는 이벤트이다.","스프린트 계획(Sprint Planning): 스프린트 목표를 설정하고, 목표 달성을 위해 제품 백로그에서 가져올 항목과 실행 계획을 수립하는 이벤트이다.","스프린트 리뷰(Sprint Review): 스프린트 결과물(Increment)을 이해관계자에게 시연하고 피드백을 받아 제품 백로그를 조정하는 이벤트이다.","스프린트 회고(Sprint Retrospective): 팀이 일하는 방식(사람·관계·프로세스·도구)을 돌아보고 다음 스프린트에서 실행할 개선 항목을 도출하는 이벤트이다.","제품 백로그 정제(Product Backlog Refinement): 백로그 항목을 상세화하고 추정치와 우선순위를 지속적으로 다듬는 활동이다."],"answer":[2],"id":"MP-009"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"Scrum 이벤트 판단 Ⅱ","prompt":"아래 [프로젝트 진행 상황]에서 Scrum 팀이 지금 수행하려는 이벤트에 대한 설명으로 가장 적절한 것을 고르시오.","explanation":"스프린트 마지막에 완성된 결과물을 이해관계자에게 시연하고 피드백을 받아 백로그를 조정하는 이벤트는 스프린트 리뷰이다. 일하는 방식의 개선을 다루는 회고와 구분해야 한다.","context":"[프로젝트 진행 상황]\nC사 Scrum 팀은 2주 스프린트의 마지막 날을 맞았다.\n팀은 이번 스프린트에서 완성한 '매장 재고 실시간 조회' 기능을 현업 매장 운영팀과 마케팅팀 앞에서 실제로 시연하려 한다.\n참석자들은 시연을 보고 의견을 제시하며, PO는 그 피드백을 반영하여 다음에 다룰 제품 백로그 항목과 우선순위를 조정할 예정이다.","choices":["데일리 스크럼(Daily Scrum): 개발자들이 매일 같은 시간에 15분 이내로 스프린트 목표 대비 진척을 점검하고 당일 계획을 조정하는 이벤트이다.","스프린트 계획(Sprint Planning): 스프린트 목표를 설정하고, 목표 달성을 위해 제품 백로그에서 가져올 항목과 실행 계획을 수립하는 이벤트이다.","스프린트 리뷰(Sprint Review): 스프린트 결과물(Increment)을 이해관계자에게 시연하고 피드백을 받아 제품 백로그를 조정하는 이벤트이다.","스프린트 회고(Sprint Retrospective): 팀이 일하는 방식(사람·관계·프로세스·도구)을 돌아보고 다음 스프린트에서 실행할 개선 항목을 도출하는 이벤트이다.","제품 백로그 정제(Product Backlog Refinement): 백로그 항목을 상세화하고 추정치와 우선순위를 지속적으로 다듬는 활동이다."],"answer":[3],"id":"MP-010"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"Scrum 역할과 책임","prompt":"Scrum의 역할과 책임에 대한 설명으로 옳지 않은 것을 고르시오.","explanation":"제품 백로그 우선순위의 최종 결정은 제품 책임자의 책임이다. 스크럼 마스터는 지시·할당하는 관리자가 아니라 서번트 리더로서 팀을 지원한다.","choices":["Scrum 팀은 자기 관리(Self-managing) 방식으로 누가 무엇을 어떻게 할지 스스로 결정한다.","제품 책임자(Product Owner)는 제품 백로그를 관리하고 항목의 우선순위를 결정한다.","스크럼 마스터는 제품 백로그 항목의 우선순위를 최종 결정하고 개발자에게 작업을 할당한다.","스크럼 마스터는 팀이 Scrum을 이해하고 실천하도록 돕고, 진행을 방해하는 장애물을 제거한다.","개발자(Developers)는 스프린트 백로그를 만들고 매 스프린트마다 사용 가능한 Increment를 만든다."],"answer":[3],"id":"MP-011"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"Scrum 산출물","prompt":"Scrum의 산출물 중 ⓐ 스프린트 목표, 이번 스프린트에서 수행하기로 선택한 제품 백로그 항목, 이를 완료하기 위한 실행 계획으로 구성된 산출물과, ⓑ 스프린트 동안 완성되어 '완료 정의'를 충족한, 사용 가능한 결과물을 각각 작성하시오.","explanation":"Scrum의 3가지 산출물은 제품 백로그, 스프린트 백로그, Increment(증분)이다.","blanks":[{"label":"ⓐ","answers":["스프린트백로그","sprintbacklog","스프린트 백로그"]},{"label":"ⓑ","answers":["Increment","증분","인크리먼트","제품증분","제품 증분","productincrement"]}],"id":"MP-012"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"번다운 차트 해석","prompt":"10일짜리 스프린트의 [번다운 데이터]가 아래와 같다. 이에 대한 해석으로 가장 적절한 것을 고르시오.","explanation":"40점을 10일에 소진하려면 하루 평균 4점씩 줄어 7일차에는 약 12점이 남아야 한다. 실제로는 34점이 남아 크게 뒤처져 있다. Scrum에서 스프린트 기간은 고정이며, 목표 달성이 위험하면 PO와 범위를 재협의한다.","context":"[번다운 데이터] (스프린트 시작 시 총 40 스토리 포인트)\n| 일차 | 1 | 3 | 5 | 7 |\n| 남은 스토리 포인트 | 40 | 38 | 36 | 34 |","choices":["남은 스토리 포인트가 매일 조금씩 줄고 있으므로 계획대로 순조롭게 진행 중이며, 현재 속도를 유지하면 된다.","목표 달성이 어려워 보이면 스크럼 마스터가 스프린트 기간을 연장하여 남은 작업을 모두 완료하는 것이 원칙이다.","남은 스토리 포인트가 증가한 날이 없으므로 범위 변경은 없었으며, 차트상 진척에는 문제가 없다고 판단할 수 있다.","이상적인 소진 속도보다 크게 뒤처져 있어 스프린트 목표 달성이 위험하므로, 원인을 파악하고 범위 조정 등을 PO와 협의해야 한다.","번다운 차트는 팀원 개인별 생산성을 평가하는 지표이므로, 진척이 늦은 팀원을 찾아 개별 면담을 진행해야 한다."],"answer":[4],"id":"MP-013"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"팀 속도 기반 계획","prompt":"아래 [최근 스프린트 실적]을 기준으로 ⓐ 팀의 평균 속도(Velocity)와, ⓑ 남은 제품 백로그 160 스토리 포인트를 모두 완료하는 데 필요한 최소 스프린트 수를 각각 숫자로 작성하시오.","explanation":"평균 속도 = (30 + 34 + 32) / 3 = 32 SP. 필요한 스프린트 수 = 160 / 32 = 5.","context":"[최근 스프린트 실적]\n| 스프린트 | S1 | S2 | S3 |\n| 완료한 스토리 포인트 | 30 | 34 | 32 |","blanks":[{"label":"ⓐ","answers":["32","32SP","32점"]},{"label":"ⓑ","answers":["5","5개","5회","5스프린트"]}],"id":"MP-014"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"사용자 스토리 작성","prompt":"다음 중 사용자 스토리(User Story)로 가장 잘 작성된 것을 고르시오.","explanation":"사용자 스토리는 '누가(역할) / 무엇을(기능) / 왜(가치)'를 사용자 관점에서 표현한다(As a ~, I want ~, so that ~). 기술 작업이나 모호한 품질 표현은 사용자 스토리가 아니다.","choices":["개발자는 Spring Boot와 MyBatis를 이용하여 주문 내역 조회 API와 화면을 구현하고 배포한다.","회원으로서, 나는 최근 3개월 주문 내역을 기간별로 조회하고 싶다. 그래야 반품 신청할 상품을 쉽게 찾을 수 있다.","주문, 반품, 교환과 관련된 모든 기능을 고객이 만족할 수 있도록 빠짐없이 완벽하게 개발한다.","시스템은 회원이 주문 내역을 조회할 때 빠르고 편리하게 사용할 수 있도록 전반적으로 개선되어야 한다.","주문 내역 조회 성능 개선을 위해 주문 테이블의 주문일자 컬럼에 인덱스를 추가하고 실행 계획을 확인한다."],"answer":[2],"id":"MP-015"},{"category":"방법론/프로세스","type":"short","difficulty":"중","title":"Scrum 품질 기준","prompt":"Scrum 팀이 '코드 리뷰 승인, 단위 테스트 통과, 운영 매뉴얼 반영'처럼 제품 백로그 항목이 Increment로 인정되기 위해 반드시 충족해야 하는 팀 공통 품질 기준을 정의하였다. 이를 무엇이라 하는지 ⓐ에 작성하시오.","explanation":"완료의 정의(DoD, Definition of Done)는 Increment가 갖춰야 할 품질 기준에 대한 공식적인 설명으로, 팀 전체가 공유한다.","blanks":[{"label":"ⓐ","answers":["완료의정의","DoD","DefinitionofDone","완료정의","완료 정의","완료의 정의","Done의정의"]}],"id":"MP-016"},{"category":"방법론/프로세스","type":"mcq","difficulty":"하","title":"칸반 방식의 특징","prompt":"칸반(Kanban) 방식에 대한 설명으로 가장 옳은 것을 고르시오.","explanation":"칸반은 작업 흐름을 시각화하고 WIP를 제한하여 지속적으로 흐름을 개선하는 방식이다. 고정된 스프린트나 정해진 역할을 요구하지 않는다.","choices":["스크럼 마스터와 제품 책임자 역할을 반드시 지정해야 한다.","작업이 시작되면 완료될 때까지 우선순위를 절대 변경할 수 없다.","작업 보드는 사용하지 않고 문서로만 진행 상황을 관리한다.","반드시 2주 단위의 고정된 스프린트를 운영해야 한다.","진행 중 작업(WIP)의 수를 제한하여 병목을 드러내고 작업 흐름을 개선한다."],"answer":[5],"id":"MP-017"},{"category":"방법론/프로세스","type":"mcq","difficulty":"중","title":"MSA 비동기 통신의 고려사항","prompt":"마이크로서비스 간 통신을 동기 REST 호출에서 메시지 브로커 기반 비동기 통신으로 바꿀 때 추가로 고려해야 할 사항으로 가장 옳은 것을 고르시오.","explanation":"비동기 메시징은 결합도를 낮추고 장애 전파를 줄이지만, 메시지 중복·순서·유실 가능성과 최종 일관성을 고려한 멱등성·재처리(DLQ 등)·분산 추적 설계가 필요하다.","choices":["비동기 통신에서도 메시지를 보낸 서비스는 수신 서비스의 처리 결과를 받을 때까지 대기해야 다음 작업을 진행할 수 있다.","메시지 브로커가 전달을 보장하므로 비동기 통신에서는 메시지 유실·중복이 원천적으로 발생하지 않아, 별도의 재처리 설계가 필요 없다.","비동기 통신으로 바꾸면 모든 서비스의 처리가 하나의 분산 트랜잭션으로 묶여, 데이터가 즉시 일관된 상태로 보장된다.","메시지 중복 수신, 순서 변경, 일시적 불일치(최종 일관성)를 처리할 수 있도록 멱등 처리와 재처리 전략을 설계해야 한다.","메시지 브로커를 사용하면 서비스 간 호출 흐름이 하나의 큐에 모이므로, 동기 방식보다 장애 추적과 디버깅이 항상 단순해진다."],"answer":[4],"id":"MP-018"},{"category":"방법론/프로세스","type":"mcq","difficulty":"상","title":"MSA 데이터 일관성","prompt":"주문·결제·재고가 각각 별도 DB를 가진 마이크로서비스로 분리되어 있다. 결제는 성공했으나 재고 차감이 실패한 경우를 처리하기 위한 방식으로 가장 적절한 것을 고르시오.","explanation":"Database per Service 환경에서는 로컬 트랜잭션들을 순차적으로 연결하고, 실패 시 이전 단계를 취소하는 보상 트랜잭션을 실행하는 Saga 패턴을 사용한다. 다른 서비스 DB에 직접 접근하는 것은 서비스 독립성을 해친다.","choices":["결제가 이미 승인되었으므로 재고 차감 실패는 무시하고 주문을 확정한 뒤, 재고는 다음 입고 시점에 수동으로 맞춘다.","결제 서비스가 재고 서비스의 DB에 직접 접속하여 재고 수량을 수정함으로써 차감 실패를 즉시 보정한다.","서비스별 DB를 하나로 합쳐 단일 로컬 트랜잭션으로 처리하는 것만이 결제와 재고의
